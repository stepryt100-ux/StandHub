<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}

.pbar{height:6px;background:var(--line);border-radius:3px;flex:1;margin:0 12px;overflow:hidden}.pbar div{height:100%;background:var(--orange)}

/* ===== Плавность и анимации ===== */
@property --p{syntax:"<percentage>";inherits:true;initial-value:0%}
html{scrollbar-color:#3a3a41 #141416}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#3a3a41;border-radius:6px;border:2px solid #141416}::-webkit-scrollbar-thumb:hover{background:#4a4a52}
::selection{background:rgba(255,85,0,.45);color:#fff}
.btn{transition:transform .18s var(--ease),background-color .18s,box-shadow .25s,border-color .18s,opacity .18s,color .18s}
.btn:not(:disabled):not(span):active{transform:scale(.97);transition-duration:.06s}
span.btn{cursor:default}
.logo svg{transition:transform .35s cubic-bezier(.2,1.6,.4,1)}
.userchip{transition:background-color .2s}
.search input,.field input,.field select{transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--orange)}
.search input:focus,.field input:focus{box-shadow:0 0 0 3px rgba(255,85,0,.15)}
.side a{transition:background-color .2s,color .2s,box-shadow .25s}
.side a .ic{transition:transform .25s var(--ease),color .2s}
.side a.on .ic{color:var(--orange)}
.chip{transition:background-color .2s,border-color .2s,color .2s,transform .12s}
.chip:active{transform:scale(.96)}
button.slot{transition:border-color .2s,color .2s,background-color .2s}
.slot .plus{transition:transform .35s var(--ease),border-color .2s}
.slot.me{box-shadow:0 0 28px -12px rgba(255,85,0,.8)}
tr.click td,.prow{transition:background-color .15s}
.prow a b,.pl b{transition:color .15s}
.feat .card,a.podium{transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.dot{position:relative}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.6);opacity:0}}
.tag.live::before{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
[data-live]{display:inline-block;font-variant-numeric:tabular-nums}
[data-live].bump{animation:bump .6s var(--ease)}
@keyframes bump{from{transform:translateY(-4px);color:var(--orange2)}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(var(--i,0)*90ms)}
.rv.in{opacity:1;transform:none}
.hero .emblem{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-50%)}50%{transform:translateY(calc(-50% - 14px))}}
.spin-slow{transform-box:fill-box;transform-origin:center;animation:sp 40s linear infinite}
.hero .stripes::before{content:"";position:absolute;inset:0 -140px 0 0;background:repeating-linear-gradient(115deg,transparent 0 60px,rgba(255,85,0,.07) 60px 64px);animation:drift 5s linear infinite}
@keyframes drift{to{transform:translateX(-70.62px)}}
.btn-o.btn-lg,.btn-find{position:relative;overflow:hidden}
.btn-o.btn-lg::after,.btn-find::after{content:"";position:absolute;inset:0;pointer-events:none;transform:translateX(-130%);background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 65%);animation:idleShine 4.5s ease-in-out infinite}
@keyframes idleShine{0%,62%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.btn:disabled::after{animation:none!important;opacity:0}
.btn-find.searching{animation:glow 1.8s ease-in-out infinite}
.btn-find.searching::after{background:linear-gradient(100deg,transparent 30%,rgba(255,85,0,.28) 50%,transparent 70%);animation:sweep 2s linear infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,85,0,.15),0 0 30px rgba(255,85,0,.35)}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.live-banner{position:relative}
.live-banner::after{content:"";position:absolute;inset:-1px;border-radius:inherit;box-shadow:0 0 26px rgba(255,85,0,.4);opacity:0;animation:fadePulse 2.4s ease-in-out infinite;pointer-events:none}
@keyframes fadePulse{50%{opacity:1}}
.modal .card{position:relative;isolation:isolate;overflow:hidden}
#accModal .card{box-shadow:0 0 0 1px rgba(255,85,0,.45),0 24px 70px -20px rgba(255,85,0,.6)}
#accModal .card::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(420px 170px at 50% 0,rgba(255,85,0,.22),transparent 70%);animation:aura 2.2s ease-in-out infinite;pointer-events:none}

#accModal h2{text-shadow:0 0 28px rgba(255,85,0,.55)}
.acc-sec{transition:color .3s,text-shadow .3s}
.acc-sec.tick{animation:tick .4s var(--ease)}
.acc-sec.hot{color:var(--red);text-shadow:0 0 24px rgba(255,77,77,.5)}
@keyframes tick{from{transform:scale(1.18);opacity:.55}}
#accBar{background:linear-gradient(90deg,var(--orange),var(--yellow))}
#accBar.hot{background:var(--red)}
.accepts i{transition:background-color .3s}
.accepts i.new{animation:dotPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes dotPop{from{transform:scale(.3);background:#fff}}
.pop-in{animation:popIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.8)}}
.vmap{overflow:hidden;transition:transform .15s var(--ease),border-color .15s,box-shadow .2s}
.vmap.can:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px -8px rgba(255,77,77,.75)}
.vmap.can:active{transform:scale(.97)}
.vmap.banned::after{content:"✕";position:absolute;top:4px;right:10px;font-size:20px;font-weight:900;line-height:1.2;color:#fff}
.vmap.just{animation:banOut .65s var(--ease) both}
.vmap.just::after{animation:xIn .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes banOut{0%{filter:none;opacity:1}35%{transform:scale(.93)}100%{filter:grayscale(1);opacity:.35}}
@keyframes xIn{from{opacity:0;transform:scale(2.4) rotate(-30deg)}}
.turn{transition:border-color .2s,background-color .2s}
.turn.mine{animation:turnGlow 1.6s ease-in-out infinite}
@keyframes turnGlow{50%{box-shadow:0 0 0 4px rgba(255,85,0,.15),0 0 24px rgba(255,85,0,.25)}}
.vt{transition:color .2s;transform-origin:right center}
.vt.hot{animation:beat 1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.14)}}
.mapbig{position:relative;overflow:hidden}
.mapbig.reveal{animation:mapIn .8s var(--ease) both}
@keyframes mapIn{from{opacity:0;transform:scale(.92);filter:brightness(2) saturate(.4)}}
.mapbig.reveal::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:shine 1.1s .35s var(--ease) forwards;pointer-events:none}
@keyframes shine{to{transform:translateX(100%)}}
/* подсветка при наведении — только там, где есть мышь (на телефоне не «залипает») */

.btn:not(:disabled):not(span):hover{transform:translateY(-1px)}

button.slot:hover{border-color:var(--orange);color:#fff;background:rgba(255,85,0,.06)}

.feat .card:hover,a.podium:hover{transform:translateY(-4px);border-color:rgba(255,85,0,.45);box-shadow:0 18px 40px -20px rgba(255,85,0,.55)}
.logo:hover svg{transform:rotate(-10deg) scale(1.1)}
.userchip:hover{background:var(--card2)}
.chip:hover{color:#fff;border-color:#4a4a52}.chip.on:hover{border-color:var(--orange)}
.prow a:hover b,tr.click:hover .pl b{color:var(--orange2)}

}

.sk{display:block;height:12px;border-radius:4px;background:linear-gradient(90deg,#2b2b30 25%,#3a3a41 50%,#2b2b30 75%);background-size:300% 100%;animation:shimmer 1.3s linear infinite}

.sk-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.sk-row+.sk-row{border-top:1px solid var(--line)}
.sk-c{width:28px;height:28px;border-radius:50%;flex:none}
.empty-ic{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.lvl.xl{box-shadow:0 0 24px -8px var(--c)}
.lvl.ring{animation:ring 1.1s var(--ease) .15s backwards}
@keyframes ring{from{--p:0%}}
@media (min-width:761px){.top{background:rgba(15,15,17,.82);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3)}}
.no-motion *,.no-motion *::before,.no-motion *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}.no-motion .rv{opacity:1;transform:none}
.no-motion body::before,.no-motion body::after{animation:none}
/* ===== v1.6: монеты, меню «Ещё», запрет поиска, чат, оценки игроков, задания, магазин, правила, поддержка ===== */
.hid{display:none!important}
.side{overflow-y:auto;scrollbar-width:none}.side::-webkit-scrollbar{display:none}
.side a{height:40px;flex:none}
.side .mo{display:none}
.side a.inst{color:var(--orange2)}
.coins{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 6px;border-radius:17px;background:rgba(255,200,0,.08);border:1px solid rgba(255,200,0,.28);color:#ffd84d;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;transition:background-color .2s}
.coins:hover{background:rgba(255,200,0,.15)}
.coins.bump b{animation:bump .6s var(--ease)}
.coin{width:22px;height:22px;flex:none;display:block}
/* меню «Ещё» на телефоне */
.more-bg{position:fixed;inset:0 0 64px 0;background:rgba(0,0,0,.6);z-index:44;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.more-bg.show{opacity:1;visibility:visible;transition:opacity .2s}
.more{position:fixed;left:0;right:0;bottom:64px;z-index:45;background:#16161a;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px 12px 12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;transform:translateY(calc(100% + 70px));visibility:hidden;transition:transform .28s var(--ease),visibility 0s .28s;box-shadow:0 -18px 40px -20px rgba(0,0,0,.9)}
.more.show{transform:none;visibility:visible;transition:transform .28s var(--ease)}
.more a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;padding:10px 4px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:#e6e6ea;font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.more a .ic{width:22px;height:22px;color:var(--orange2)}
.more a.on{border-color:var(--orange);background:rgba(255,85,0,.1)}
.more a .nb{position:absolute;top:6px;right:6px;margin:0}
.more .mot b{color:#fff;font-weight:800}
.nb.dot{min-width:9px;width:9px;height:9px;padding:0;font-size:0}
@media (min-width:761px){.more,.more-bg{display:none}}
/* запрет поиска */
.ban-card{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px;border-color:rgba(255,77,77,.55);background:linear-gradient(90deg,rgba(255,77,77,.14),var(--card))}
.ban-card .bt{font-size:20px;font-weight:900;margin-top:2px}
.ban-card .bc{font-variant-numeric:tabular-nums;color:#ff8080}
.ban-card p{font-size:14px;margin-top:4px;max-width:560px}
.qwarn{margin-top:8px;font-size:13px;font-weight:600;color:#ffb37a;max-width:440px}
/* чат матча */
.chat{display:flex;flex-direction:column;overflow:hidden}
.chat-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.chat-h h3{margin:0}
.chat-h .muted{font-size:12px;text-align:right}
.chat-list{height:250px;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:7px;overscroll-behavior:contain}
.cm{font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.cm b{font-weight:800;margin-right:6px;color:var(--orange2)}
.cm b.cA{color:#5fe08a}.cm b.cB{color:#ff7a7a}
.cm .t2{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;padding:0 5px;border-radius:3px;margin-right:6px;vertical-align:1px;line-height:16px}
.cm .t2.tm{background:rgba(120,140,255,.16);color:#a9b4ff}
.cm .t2.adm{background:rgba(255,85,0,.2);color:var(--orange2)}
.cm time{font-size:11px;color:#6f6f78;margin-left:6px;white-space:nowrap}
.cm.me span.tx{color:#fff}
.cm span.tx{color:#dcdce2}
.chat-empty{margin:auto;text-align:center;color:var(--muted);font-size:13px;padding:16px 10px;max-width:300px}
.chat-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.chat-f input{flex:1;min-width:0;height:40px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:#fff;padding:0 12px;font-size:15px;font-family:inherit}
.chat-f input:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px rgba(255,85,0,.15)}
.chat-ch{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.chat-ch button{height:38px;padding:0 10px;background:var(--bg2);color:var(--muted);font-size:12px;font-weight:700;transition:background-color .15s,color .15s}
.chat-ch button.on{background:rgba(255,85,0,.18);color:#fff}
.chat-send{width:40px;height:40px;border-radius:6px;background:linear-gradient(180deg,#ff6c22,#ff4f00);color:#fff;display:grid;place-items:center;flex:none}
.chat-send:disabled{opacity:.5;cursor:default}
.chat-send .ic{width:18px;height:18px}
.chat-ro{padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
/* оценки после матча */
.fbk-sub{font-size:13px;margin:-6px 0 6px}
.fbr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.fbr:last-child{border:0}
.fbr .fn{flex:1;min-width:0}.fbr .fn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.fbr .fa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.frb.thx{border-color:rgba(63,207,106,.5);color:#5fe08a}
.frb.rep{color:var(--muted)}
@media (hover:hover){.frb.thx:hover{background:rgba(63,207,106,.12);color:#fff}.frb.rep:hover{border-color:var(--red);color:#ff8080}}
.pill.cmd{background:rgba(63,207,106,.14);color:#5fe08a;font-size:12px;padding:4px 10px;border-radius:14px;text-transform:none;letter-spacing:0}
/* окно жалобы и подсказки */
.rsn{display:grid;gap:6px;margin:14px 0 12px}
.rsn label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);cursor:pointer;font-size:14px;transition:border-color .15s,background-color .15s}
.rsn label:has(input:checked){border-color:var(--orange);background:rgba(255,85,0,.1)}
.rsn input{accent-color:var(--orange);width:16px;height:16px;flex:none}
.txa{display:block;width:100%;min-height:84px;resize:vertical;background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:#fff;padding:10px 12px;font:inherit;font-size:15px}
.txa:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px rgba(255,85,0,.15)}
.modal .card.pm .howto{margin:14px 0 0}
/* задания */
.tk{display:grid;gap:12px;max-width:860px}
.tk-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tk-bal{display:flex;align-items:center;gap:14px}
.tk-bal .coin{width:46px;height:46px}
.tk-bal .v{font-size:32px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.tk-reset{font-size:13px;color:var(--muted);text-align:right}
.tk-reset b{color:#fff;font-size:18px;font-variant-numeric:tabular-nums}
.tk-sub{font-size:15px;text-transform:uppercase;font-weight:800;margin:10px 0 0}
.tk-row{display:flex;align-items:center;gap:16px;padding:16px 20px;transition:border-color .25s,box-shadow .25s,opacity .25s}
.tk-ic{width:48px;height:48px;border-radius:12px;background:rgba(255,85,0,.12);display:grid;place-items:center;font-size:24px;flex:none}
.tk-main{flex:1;min-width:0}
.tk-main>b{display:block;font-size:16px}
.tk-prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tk-prog .bar{flex:1;margin:0;height:8px;border-radius:4px;max-width:320px}
.tk-prog .bar div{background:linear-gradient(90deg,var(--orange),var(--yellow));border-radius:4px}
.tk-rw{display:flex;align-items:center;gap:6px;font-weight:900;color:#ffd84d;white-space:nowrap;font-size:16px}
.tk-rw .coin{width:20px;height:20px}
.tk-act{flex:none;min-width:124px;display:flex;justify-content:flex-end}
.tk-done{color:var(--green);font-weight:800;font-size:13px;white-space:nowrap}
.tk-wait{color:var(--muted);font-size:13px;white-space:nowrap}
.tk-row.ready{border-color:rgba(255,200,0,.6);box-shadow:0 0 0 1px rgba(255,200,0,.2),0 14px 34px -20px rgba(255,200,0,.55)}
.tk-row.got{opacity:.62}
/* магазин */
.sh{display:grid;gap:14px}
.sh>.tk-sub{margin:14px 0 0}
.sh-hero{position:relative;overflow:hidden;isolation:isolate;padding:36px 40px;min-height:260px;display:flex;align-items:center;border-color:rgba(255,200,0,.3);background:radial-gradient(70% 130% at 88% 50%,rgba(255,150,0,.26),transparent 62%),radial-gradient(60% 90% at 0% 0%,rgba(255,85,0,.14),transparent 70%),linear-gradient(160deg,#2b2519,#1d1b17 60%,#19181b)}
.sh-stripes{position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,200,0,.05) 46px 50px);-webkit-mask:linear-gradient(90deg,transparent 35%,#000);mask:linear-gradient(90deg,transparent 35%,#000)}
.sh-in{position:relative;z-index:1;max-width:560px}
.sh-kick{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ffd84d}
.sh-kick .ic{width:16px;height:16px}
.sh-hero h1{font-size:48px;line-height:1;font-weight:900;font-style:italic;text-transform:uppercase;margin:10px 0 12px}
.sh-hero h1 span{background:linear-gradient(180deg,#ffe680,#ffb000 60%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.sh-hero p{color:#d0d0d6;font-size:16px;max-width:460px;margin:0 0 22px}
.sh-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sh-bal{display:flex;flex-direction:column;gap:2px;padding:8px 18px 8px 12px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid rgba(255,200,0,.28)}
.sh-bal>span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sh-bal>div{display:flex;align-items:center;gap:8px}
.sh-bal .coin{width:30px;height:30px}
.sh-bal b{font-size:28px;font-weight:900;line-height:1.1;color:#ffd84d;font-variant-numeric:tabular-nums}
.sh-bal.bump b{animation:bump .6s var(--ease)}
.sh-art{position:absolute;right:5%;top:50%;width:310px;height:250px;transform:translateY(-50%);pointer-events:none}
.sh-art .cw{position:absolute;display:block;filter:drop-shadow(0 18px 22px rgba(0,0,0,.55))}
.sh-art .coin{width:100%;height:100%}
.sh-art .c1{width:160px;height:160px;right:64px;top:44px;animation:shFloat 5.5s ease-in-out infinite}
.sh-art .c1 .coin{animation:shFlip 7s var(--ease) 1.2s infinite}
.sh-art .c2{width:78px;height:78px;right:0;top:4px;opacity:.92;animation:shFloat 4.5s ease-in-out -1.6s infinite}
.sh-art .c3{width:58px;height:58px;right:236px;top:168px;opacity:.75;filter:blur(1.2px) drop-shadow(0 12px 16px rgba(0,0,0,.5));animation:shFloat 6.5s ease-in-out -3s infinite}
@keyframes shFloat{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-12px) rotate(5deg)}}
@keyframes shFlip{0%,82%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.sh-item{display:flex;flex-direction:column;overflow:hidden;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.sh-item:not(.out):not(.sh-soon):hover{transform:translateY(-4px);border-color:rgba(255,200,0,.55);box-shadow:0 22px 44px -24px rgba(255,170,0,.6)}
.sh-vis{position:relative;height:172px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(90% 85% at 50% 100%,rgba(255,170,0,.4),transparent 66%),linear-gradient(160deg,#352a19,#1f1b15);border-bottom:1px solid rgba(255,200,0,.2)}
.sh-vis .gold{width:196px;height:135px;transition:transform .35s var(--ease)}
.sh-item:not(.out):hover .sh-vis .gold{transform:scale(1.06) translateY(-3px)}
.sh-vis::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-110%);pointer-events:none}
.sh-item:not(.out):hover .sh-vis::after{transform:translateX(110%);transition:transform .9s var(--ease)}
.sh-tag{position:absolute;top:12px;left:12px;z-index:1;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:4px;background:var(--orange);color:#fff}
.sh-for{position:absolute;top:13px;right:14px;z-index:1;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#ffd84d;opacity:.85}
.sh-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.sh-name{font-size:24px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.1}
.sh-desc{font-size:13px}
.sh-desc a,.sh-help a{color:var(--orange2);text-decoration:underline}
.sh-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.sh-price{display:inline-flex;align-items:center;gap:7px}
.sh-price .coin{width:28px;height:28px}
.sh-price b{font-size:28px;font-weight:900;color:#ffd84d;font-variant-numeric:tabular-nums;line-height:1}
.sh-st{font-size:12px;font-weight:800;color:var(--green);text-align:right}
.sh-st.low{color:var(--orange2)}
.sh-st.out{color:var(--red)}
.sh-lim{font-size:12px}
.sh-prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sh-prog .bar{flex:1;margin:0;height:6px}
.sh-prog .bar div{background:linear-gradient(90deg,var(--orange),var(--yellow))}
.sh-cta{width:100%;margin-top:4px}
.sh-cta.on{border-color:rgba(63,207,106,.5);color:var(--green)}
.sh-cta .ic{width:18px;height:18px}
.sh-item.out .sh-vis .gold{filter:grayscale(.7) brightness(.75)}
.sh-soon{border-style:dashed;background:rgba(255,255,255,.015);box-shadow:none}
.sh-soon .sh-vis{background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 12px,transparent 12px 24px);border-bottom:1px dashed var(--line)}
.sh-q{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.sh-q .ic{width:30px;height:30px}
.sh-mine{padding:4px 18px}
.sh-ord{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.sh-ord:last-child{border-bottom:0}
.sh-oic{width:52px;height:42px;flex:none;border-radius:8px;background:radial-gradient(circle at 50% 85%,rgba(255,170,0,.35),transparent 70%),#2a2419;display:grid;place-items:center;border:1px solid rgba(255,200,0,.2)}
.sh-oic .gold{width:42px;height:29px}
.sh-om{flex:1;min-width:0}
.sh-om b{display:block;font-size:15px}
.sh-om .muted{font-size:12px}
.sh-oc{display:flex;align-items:center;gap:8px}
.sh-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;font-weight:700;letter-spacing:.06em;padding:6px 12px;border-radius:6px;background:var(--bg2);border:1px dashed rgba(255,200,0,.45);color:#ffd84d;-webkit-user-select:all;user-select:all;word-break:break-all}
.sh-oc .btn .ic{width:16px;height:16px}
.sh-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sh-step{display:flex;gap:12px;padding:16px}
.sh-step .n{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(180deg,#ff6c22,#ff4f00)}
.sh-step b{display:block;font-size:15px}
.sh-step p{font-size:13px;margin:2px 0 0}
.sh-help{font-size:13px}
.sh-how{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);text-align:left}
.sh-how-t{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.sh-how ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sh-how li{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.35}
.sh-how li i{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ff6c22,#ff4f00)}
.sh-how li b{color:#fff}
.sh-mhint{margin-top:10px}
.sh-mhint b{color:var(--text,#fff)}
.sh-mhint a{color:var(--orange2);font-weight:700}
.sh-ost{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:800;white-space:nowrap;background:rgba(255,200,0,.1);color:#ffd84d;border:1px solid rgba(255,200,0,.35)}
.sh-ost.od{background:rgba(63,207,106,.1);color:var(--green);border-color:rgba(63,207,106,.35)}
.sh-ost.orf{background:var(--card2);color:var(--muted);border-color:var(--line)}
.sh-ord.off .sh-om b{color:var(--muted)}
.sh-rc{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px;padding:12px 14px;border-radius:10px;border:1px dashed rgba(255,200,0,.55);background:rgba(255,200,0,.06);text-align:left}
.sh-rc>div{min-width:0}
.sh-rc small{display:block;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.sh-rc b{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:900;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.sh-rc b.no{font-size:22px;color:#ffd84d;letter-spacing:.02em}
.sh-rc .coin{width:18px;height:18px;flex:none}
.sh-rc .w2{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px dashed rgba(255,200,0,.3)}
.sh-pv.sm{height:92px}
.sh-pv.sm .gold{width:124px;height:85px}
.sh-fn{font-size:13px;margin-top:12px}
.sh-fn b{color:#fff}
.sh-pm .row2 .btn .ic{width:18px;height:18px}
.adm-ct{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.adm-ct>div:first-child{flex:1;min-width:240px}
.adm-cfg input[type=number][data-cfg="qty"]{width:190px}
.adm-cfg input[type=text]{width:200px;height:40px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:#fff;padding:0 12px;font:inherit;font-size:15px}
.adm-cfg input[type=text]:focus,.adm-oh input:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px rgba(255,85,0,.15)}
.adm-oh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}

<script>
/* ===== Справочники ===== */
const MAPS=[["Sandstone","#c89a5b,#6b4a22"],["Rust","#b5532b,#3e1c0d"],["Province","#7fa36a,#2f4524"],["Zone 7","#6a7f9e,#232c3d"],["Hanami","#d77fa1,#4a2233"],["Breeze","#5fb5c9,#1f4550"],["Dune","#d9b26a,#5c4318"],["Sakura","#e59aa8,#57303a"]]; // цвета карт; Sakura больше не в пуле (см. match.js), цвет оставлен для старых матчей
const TH=[0,100,801,951,1101,1251,1401,1551,1701,1851,2001];
function lvlOf(e){let l=1;for(let i=1;i<=10;i++)if(e>=TH[i])l=i;return l}
function lvlColor(l){return l===1?"var(--l1)":l<=3?"var(--l2)":l<=7?"var(--l4)":l<=9?"var(--l8)":"var(--l10)"}
function lvlPct(e){const l=lvlOf(e);if(l===10)return 100;return Math.round((e-TH[l])/(TH[l+1]-TH[l])*100)}
function badge(e,cls=""){const l=lvlOf(e);return `<span class="lvl ${cls}" style="--c:${lvlColor(l)};--p:${Math.max(8,lvlPct(e))}%" title="Уровень ${l} · ${e} ELO">${l}</span>`}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ava(n,url){if(url)return `<span class="ava" style="background:#26262b center/cover no-repeat url('${esc(url)}')" role="img" aria-label="${esc(n)}"></span>`;const h=[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360;return `<span class="ava" style="background:linear-gradient(135deg,hsl(${h} 70% 45%),hsl(${(h+40)%360} 60% 20%))">${esc(n[0].toUpperCase())}</span>`}
function mapBg(m){const x=MAPS.find(a=>a[0]===m);return `linear-gradient(135deg,${x?x[1]:"#555,#222"})`}
const fmt=n=>Number(n).toLocaleString("ru-RU");
const kd=u=>u.deaths?(u.kills/u.deaths).toFixed(2):(u.kills?u.kills.toFixed(2):"—");
const wr=u=>u.matches?Math.round(u.wins/u.matches*100)+"%":"—";
const hsp=u=>u.kills?Math.round(u.hsKills/u.kills*100)+"%":"—";

/* ===== Состояние и API ===== */
const S={token:localStorage.getItem("sh_token"),user:null,searching:false,qSince:0,timer:null,mode:"5v5",match:null,mv:{},skew:0,live:{online:null,searching:null,live:null},party:null,psent:[],pinv:[],tasks:null,ban:null,misses:0,badges:{},chat:null};
const VID=localStorage.getItem("sh_vid")||(()=>{const v=crypto.randomUUID();localStorage.setItem("sh_vid",v);return v})();
async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{"Content-Type":"application/json",...(S.token?{Authorization:"Bearer "+S.token}:{})}});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||"Ошибка"),j);return j;
}
let es;
function connectLive(){
  if(es)es.close();loadCup();
  if(location.protocol==="file:"){S.live={online:null};paintLive();return}
  const tok=S.token;
  es=new EventSource(`/api/events?vid=${VID}&token=${tok||""}`);
  es.onmessage=e=>{try{const d=JSON.parse(e.data);
    if(d.type==="loggedout"){if(S.token&&S.token===tok){dropSession("#/login");toast(d.text)}return} // пароль сменили на другом устройстве
    onLive(d)}catch(err){console.error(err)}};
  es.onerror=()=>{S.live={online:null,searching:null,live:null};paintLive()};
}
function paintLive(){
  const v=k=>S.live[k]==null?"—":fmt(S.live[k]);
  document.querySelectorAll("[data-live]").forEach(el=>{const t=v(el.dataset.live),was=el.textContent;if(was===t)return;el.textContent=t;
    if(was!=="—"&&!RM()){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}});
  document.querySelectorAll("[data-mq]").forEach(el=>{const n=(S.live.modes||{})[el.dataset.mq]||0;if(el.textContent!==String(n))el.textContent=n;el.classList.toggle("z",!n)});
  const h=document.getElementById("qhint");if(h){const t=qHint();if(h.textContent!==t)h.textContent=t}
}
// подсказка: игроки ищут в другом режиме — в один матч попадают только при одинаковом режиме
function qHint(){
  const md=S.live.modes;if(!md||!S.user||pMember()||(S.match&&["accept","veto","live"].includes(S.match.state)))return "";
  if((md[S.mode]||0)-(S.searching?1:0)>0)return "";
  const oth=Object.keys(MODE_NAME).filter(k=>k!==S.mode&&md[k]>0);if(!oth.length)return "";
  const names=oth.map(k=>"«"+MODE_NAME[k]+"»").join(" и ");
  return S.searching?`Другие игроки сейчас ищут в режиме ${names}. Чтобы попасть в один матч, отмените поиск и выберите тот же режим.`:`Сейчас ищут матч в режиме ${names} — выберите его, чтобы сыграть вместе.`;
}
const L=k=>`<b data-live="${k}">${S.live[k]==null?"—":fmt(S.live[k])}</b>`;

/>","crown":"<path d=\"M3 7l5 4 4-7 4 7 5-4-2 12H5z\"/>","shield":"<path d=\"M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z\"/>","spark":"<path d=\"M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z\"/>","help":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.5 9a2.5 2.5 0 115 0c0 2-2.5 2-2.5 4M12 17h0\" stroke=\"#0f0f11\" stroke-width=\"2\" fill=\"none\"/>",
 "tasks":"<path fill-rule=\"evenodd\" d=\"M7 2h2v2h6V2h2v2h2a2 2 0 012 2v13a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2h2zM7.4 13.1l1.5-1.5 2.1 2.1 4.6-4.6 1.5 1.5-6.1 6.1z\"/>",
 "shop":"<path d=\"M3.6 8h16.8l-1.3 13H4.9zM8 8V6.5a4 4 0 018 0V8h-2V6.5a2 2 0 00-4 0V8z\"/>",
 "book":"<path d=\"M5 3.5A1.5 1.5 0 016.5 2H20v15H6.6a1.6 1.6 0 000 3.2H20V22H6.5A2.5 2.5 0 014 19.5v-15c0-.4.4-1 1-1zM8 6v2h8V6z\"/>",
 "download":"<path d=\"M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16l-5.7-5.7 1.4-1.4 3.3 3.3zM4 18h16v3H4z\"/>",
 "logout":"<path d=\"M10 3h9a1 1 0 011 1v16a1 1 0 01-1 1h-9v-2h8V5h-8zM8.6 7.6 10 9l-2 2H15v2H8l2 2-1.4 1.4L4.2 12z\"/>",
 "more":"<circle cx=\"5\" cy=\"12\" r=\"2.2\"/><circle cx=\"12\" cy=\"12\" r=\"2.2\"/><circle cx=\"19\" cy=\"12\" r=\"2.2\"/>",
 "send":"<path d=\"M3 20.5 21 12 3 3.5 3 10l12 2-12 2z\"/>"};
const COIN=`<svg class="coin" viewBox="0 0 48 48" aria-hidden="true"><use href="#coinS"/></svg>`;
const GOLD=()=>`<svg class="gold" viewBox="0 0 160 110" aria-hidden="true"><use href="#goldS"/></svg>`;
// «NEW» у магазина в меню — пока игрок его не открыл
const shopNew=()=>{try{return !localStorage.getItem("sh_shop_seen")}catch{return false}};
const SHOP_NB=`<span class="nb new z" data-shopn aria-label="Новое">NEW</span>`;
function ic(n){return `<svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">${ICONS[n]}</svg>`}
function renderChrome(route){
  const u=S.user,tr=document.getElementById("topRight"),side=document.getElementById("side"),more=document.getElementById("more");
  const tk=u?[u.nick,u.elo,u.admin?1:0,(u.avatar||"").length,(u.avatar||"").slice(-24)].join("|"):"-";
  if(tr.dataset.k!==tk){tr.dataset.k=tk;
  tr.innerHTML=u?`
    <a class="coins" href="#/shop" title="Монеты — тратьте в магазине" aria-label="Монеты — открыть магазин">${COIN}<b data-coins>${fmt(S.tasks?S.tasks.coins:0)}</b></a>
    <a class="btn btn-o" href="#/lobby">Играть</a>
    <a class="userchip" href="#/profile" aria-label="Мой профиль">${ava(u.nick,u.avatar)}<span class="nm">${esc(u.nick)}</span>${badge(u.elo,"sm")}</a>
    <button class="btn btn-g" id="logout">Выйти</button>`:`
    <a class="btn btn-g" href="#/login">Войти</a><a class="btn btn-o" href="#/register">Регистрация</a>`;
  const lo=document.getElementById("logout");if(lo)lo.onclick=logout}
  // в нижнем меню телефона — Главная, Играть, Друзья, Задания и «Ещё»; остальное — в «Ещё»
  const items=[["#/","home","Главная",1],["#/lobby","play","Играть",1],["#/profile","user","Профиль"],["#/friends","users","Друзья",1],["#/matches","swords","Матчи"],["#/leaderboard","crown","Рейтинг"],["#/tasks","tasks","Задания",1],["#/shop","shop","Магазин"]];
  if(u&&u.admin)items.push(["#/admin","shield","Админ"]);
  const nbOf=h=>h==="#/shop"?SHOP_NB:h==="#/friends"?`<span class="nb z" data-frn aria-label="Новые заявки">0</span>`:h==="#/tasks"?`<span class="nb z" data-tkn aria-label="Можно забрать награду">0</span>`:h==="#/admin"?`<span class="nb z" data-admn aria-label="Новые жалобы и обращения">0</span>`:"";
  const sk=items.map(x=>x[0]).join()+(u?"|u":"");
  if(side.dataset.k!==sk){side.dataset.k=sk;side.innerHTML=items.map(([h,i,t,m])=>`<a href="${h}" data-r="${h.slice(1)}"${m?"":' class="dk"'}>${ic(i)}${t}${nbOf(h)}</a>`).join("")+
   `<a class="mo" id="moreBtn" role="button" tabindex="0" aria-expanded="false" aria-controls="more">${ic("more")}Ещё<span class="nb dot z" data-mon aria-hidden="true"></span></a>`+
   `<div class="sep"></div><a href="#/rules" data-r="/rules" class="dk">${ic("book")}Правила</a><a href="#/support" data-r="/support" class="dk">${ic("help")}Поддержка<span class="nb z" data-supn aria-label="Ответы поддержки">0</span></a><a href="#" class="dk mot" data-motion>${ic("spark")}Анимации: <b>вкл</b></a><a href="#" class="dk inst hid" data-install>${ic("download")}<span class="il">Установить приложение</span></a>
    <div class="sfoot"><div class="ver">Версия ${APP_V}</div></div>`;
   const mb=document.getElementById("moreBtn");mb.onclick=()=>toggleMore();mb.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleMore()}};
   const mi=[["#/profile","user","Профиль"],["#/matches","swords","Матчи"],["#/leaderboard","crown","Рейтинг"],["#/shop","shop","Магазин",SHOP_NB],["#/rules","book","Правила"],["#/support","help","Поддержка",`<span class="nb z" data-supn>0</span>`]];
   if(u&&u.admin)mi.push(["#/admin","shield","Админ",`<span class="nb z" data-admn>0</span>`]);
   more.innerHTML=mi.map(([h,i,t,b])=>`<a href="${h}" data-r="${h.slice(1)}">${ic(i)}${t}${b||""}</a>`).join("")+
    `<a href="#" class="mot" data-motion>${ic("spark")}Анимации: <b>вкл</b></a><a href="#" class="inst hid" data-install>${ic("download")}<span class="il">Значок на экран</span></a>${u?`<a href="#" data-logout>${ic("logout")}Выйти</a>`:`<a href="#/login">${ic("user")}Войти</a>`}`}
  paintMotion();frBadge();paintCoins();paintInstall();
  const act=a=>{const on=a.dataset.r===route;a.classList.toggle("on",on);if(on)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")};
  side.querySelectorAll("a[data-r]").forEach(act);more.querySelectorAll("a[data-r]").forEach(act);

function toggleMore(force){const m=document.getElementById("more"),bg=document.getElementById("moreBg"),b=document.getElementById("moreBtn"),on=force!=null?force:!m.classList.contains("show");
  m.classList.toggle("show",on);bg.classList.toggle("show",on);if(b)b.setAttribute("aria-expanded",on?"true":"false");if(on){const f=m.querySelector("a");if(f)f.focus({preventScroll:true})}}
const closeMore=()=>{const m=document.getElementById("more");if(m&&m.classList.contains("show"))toggleMore(false)};
document.getElementById("moreBg").onclick=()=>closeMore();
document.getElementById("more").addEventListener("click",e=>{if(e.target.closest("a[href^='#/']"))closeMore()});
async function logout(){S.searching=false;stopQTimer();try{await api("/api/logout",{method:"POST"})}catch{}dropSession()}
function dropSession(to="#/"){S.searching=false;stopQTimer();
  S.token=null;S.user=null;S.match=null;S.lobbyMs=null;S.fr=null;S.party=null;S.psent=[];S.pinv=[];S.pSeen=false;S.tasks=null;S.shop=null;S.ban=null;S.misses=0;S.badges={};S.chat=null;S.sup=null;
  frBadge();paintBadges();paintPInv();closeInvite();closeAccept();closeX();closeMore();localStorage.removeItem("sh_token");connectLive();if(location.hash===to||curHash()===to.slice(1))route();else location.hash=to}

// анимации включены всегда; выключить можно кнопкой «Анимации» (меню слева / низ главной)
const RM=()=>document.documentElement.classList.contains("no-motion");
function paintMotion(){document.querySelectorAll("[data-motion] b").forEach(b=>b.textContent=RM()?"выкл":"вкл")}
document.addEventListener("click",e=>{const t=e.target.closest("[data-motion]");if(!t)return;e.preventDefault();const off=!RM();
  document.documentElement.classList.toggle("no-motion",off);try{localStorage.setItem("sh_motion",off?"off":"on")}catch{}paintMotion();toast(off?"Анимации выключены":"Анимации включены")});
const EASE="cubic-bezier(.2,.8,.2,1)";
// плавное появление снизу; конечное состояние — собственные стили элемента
function rise(els,step=60,dur=450,y=14){if(RM())return;[...els].forEach((el,i)=>{try{el.animate([{offset:0,opacity:0,transform:`translateY(${y}px)`}],{duration:dur,delay:i*step,easing:EASE,fill:"backwards"})}catch{}})}
// числа «набегают» от нуля: data-count, data-dec (знаки после точки), data-suf (%), data-sign (+/−)
function countUp(root){if(!root||RM())return;root.querySelectorAll("[data-count]").forEach(el=>{
  const to=+el.dataset.count,dec=+(el.dataset.dec||0),suf=el.dataset.suf||"",sg=el.dataset.sign,fin=el.textContent;if(!isFinite(to)||!to)return;
  const f=v=>{const r=dec?+v.toFixed(dec):(Math.round(v)||0);return (sg&&r>=0?"+":"")+(dec?r.toFixed(dec):r)+suf};
  const t0=performance.now(),D=Math.min(1200,600+Math.abs(to)*.3);el.textContent=f(0);
  const st=t=>{if(!el.isConnected)return;const k=Math.max(0,Math.min(1,(t-t0)/D));if(k>=1){el.textContent=fin;return}el.textContent=f(to*(1-Math.pow(1-k,3)));requestAnimationFrame(st)};
  requestAnimationFrame(st)})}
// появление блоков главной при прокрутке
let rvObs=null;
function reveal(){const els=app.querySelectorAll(".rv:not(.in)");if(!els.length)return;
  if(RM()||!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return}
  if(rvObs)rvObs.disconnect();
  rvObs=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;rvObs.unobserve(t);t.classList.add("in");setTimeout(()=>t.classList.remove("rv","in"),1500)}),{rootMargin:"0px 0px -40px 0px"});
  els.forEach(e=>rvObs.observe(e))}
// вход на страницу: блоки появляются по очереди, кольцо уровня и ELO «заполняются»
function animateIn(){if(RM())return;
  const sel=".mtop,h1.h,.wrap>p,.hero .wrap>*,.phead,.mhead,.card,.mapbig",H=innerHeight;
  const els=[...app.querySelectorAll(sel)].filter(el=>!el.closest(".rv")&&!el.parentElement.closest(sel)).filter(el=>{const r=el.getBoundingClientRect();return r.bottom>0&&r.top<H});
  rise(els.slice(0,14),70,560,22);
  app.querySelectorAll("h1.h").forEach(e=>e.classList.add("grow"));
  app.querySelectorAll(".lvl.xl").forEach(el=>el.classList.add("ring"));
  app.querySelectorAll(".elo-prog .bar div").forEach(el=>{try{el.animate([{offset:0,width:"0%"}],{duration:1000,delay:250,easing:EASE,fill:"backwards"})}catch{}});
  countUp(app)}
function entered(){if(!S.enter)return;S.enter=false;animateIn()}
function fadeRows(root){if(!root||RM())return;rise(root.querySelectorAll(".podium"),70,450);rise([...root.querySelectorAll("tbody tr,.mrow,.empty")].slice(0,20),30,350,8)}
function skel(n=4,pad=true){const w=[52,38,64,46,58,42,60,36];return `<div${pad?' class="pad"':""} aria-busy="true" aria-label="Загрузка">${Array.from({length:n},(_,i)=>`<div class="sk-row"><span class="sk sk-c"></span><span class="sk" style="width:${w[i%8]}%"></span><span class="sk" style="width:14%;margin-left:auto"></span></div>`).join("")}</div>`}
const profSkel=()=>`<div class="wrap"><div class="sk" style="height:152px;border-radius:8px"></div><div class="stats" style="margin-top:24px">${'<div class="sk" style="height:86px;border-radius:8px"></div>'.repeat(6)}</div><div class="card" style="margin-top:16px">${skel(4)}</div></div>`;
function numSpan(v){const s=String(v),m=s.match(/^(\d+(?:\.(\d+))?)(%?)$/);return m?`<span data-count="${m[1]}" data-dec="${m[2]?m[2].length:0}" data-suf="${m[3]}">${s}</span>`:esc(s)}
// конфетти при победе
function confetti(){if(RM())return;const box=document.createElement("div");box.className="cf";box.setAttribute("aria-hidden","true");document.body.appendChild(box);
  const cols=["#ff5500","#ff7a33","#ffc800","#3fcf6a","#ffffff"],H=innerHeight;
  for(let i=0;i<90;i++){const p=document.createElement("i"),w=6+Math.random()*6;p.style.cssText=`left:${Math.random()*100}%;width:${w}px;height:${w*.45}px;background:${cols[i%5]}`;box.appendChild(p);
    try{p.animate([{transform:"translate(0,0) rotate(0deg)",opacity:1},{transform:`translate(${(Math.random()-.5)*260}px,${H+40}px) rotate(${(Math.random()-.5)*1440}deg)`,opacity:.85}],{duration:1800+Math.random()*1600,delay:Math.random()*500,easing:"cubic-bezier(.25,.6,.45,1)",fill:"both"})}catch{}}
  setTimeout(()=>box.remove(),4400)}

    pw:()=>{const a=document.getElementById("pw").value,b=document.getElementById("pw2").value;if(a.length<6){set("pw","Минимум 6 символов");return null}if(a!==b){set("pw2","Пароли не совпадают");return null}return a}}}
let fpTick=null;
const fpSt=(login,r)=>({login,next:Date.now()+(r.wait||0)*1000,exp:Date.now()+(r.ttl||1800)*1000});
function pageForgot(){
  clearInterval(fpTick);
  const st=JSON.parse(sessionStorage.getItem("sh_fp")||"null");
  if(st&&st.exp>Date.now())return fpCode(st);
  sessionStorage.removeItem("sh_fp");
  app.innerHTML=`<div class="auth"><form class="card" id="fpf" novalidate>
   <div class="tag">Шаг 1 из 2</div>
   <h1 style="margin-top:6px">Восстановление пароля</h1>
   <p class="muted">Пришлём код в Telegram — в чат с <span data-botn>ботом StandHub</span>, через которого вы подтверждали аккаунт.</p>
   <div class="field"><label for="fpl">Email или ник</label><input id="fpl" autocomplete="username" placeholder="you@mail.ru или ваш ник" value="${esc(sessionStorage.getItem("sh_fp_login")||(S.user&&S.user.email)||"")}"><div class="err" id="e-login"></div></div>
   <button class="btn btn-o btn-lg" style="width:100%;margin-top:20px" type="submit">Получить код</button>
   <div class="fp-alt"><b>Не помните email?</b><span class="muted">Напишите боту команду /password — он покажет email для входа и пришлёт ссылку для нового пароля.</span><a class="btn btn-g btn-sm hid" data-botl="?start=reset" target="_blank" rel="noopener">Открыть бота</a></div>
   <p class="muted" style="text-align:center;margin-top:20px;font-size:14px">Вспомнили пароль? <a href="#/login" style="color:var(--orange)">Войти</a></p>
  </form></div>`;
  entered();paintBot();
  const f=document.getElementById("fpf"),E=fErr();
  f.onsubmit=async e=>{e.preventDefault();E.clear(["login"]);const l=document.getElementById("fpl").value.trim();if(!l)return E.set("login","Введите email или ник");
    const b=f.querySelector("[type=submit]");b.disabled=true;
    try{const r=await api("/api/forgot",{method:"POST",body:JSON.stringify({login:l})});sessionStorage.setItem("sh_fp_login",l);fpCode(fpSt(l,r));toast("Код отправлен в Telegram")}
    catch(err){b.disabled=false;if(err.sent){fpCode(fpSt(l,err));return toast(err.message)}E.show(err)}};

function fpCode(st){
  sessionStorage.setItem("sh_fp",JSON.stringify(st));
  app.innerHTML=`<div class="auth"><form class="card" id="fpf2" novalidate>
   <div class="tag">Шаг 2 из 2</div>
   <h1 style="margin-top:6px">Введите код</h1>
   <p class="muted">Код отправлен в Telegram — в чат с <span data-botn>ботом StandHub</span>. Аккаунт: <b style="color:#fff">${esc(st.login)}</b></p>
   <a class="btn btn-g hid" style="width:100%;margin-top:16px" data-botl="" target="_blank" rel="noopener">Открыть Telegram</a>
   <input class="sr" tabindex="-1" aria-hidden="true" autocomplete="username" value="${esc(st.login)}">
   <div class="field"><label for="fpc">Код из Telegram</label><input id="fpc" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 цифр"><div class="err" id="e-code"></div></div>
   ${pwFields()}
   <button class="btn btn-o btn-lg" style="width:100%;margin-top:20px" type="submit">Сменить пароль</button>
   <div class="fp-row"><button type="button" class="lnk" id="fpRe"></button><button type="button" class="lnk" id="fpBack">Другой email или ник</button></div>
  </form></div>`;
  entered();paintBot();
  const re=document.getElementById("fpRe"),f=document.getElementById("fpf2"),E=fErr();
  const tick=()=>{if(!document.body.contains(re))return clearInterval(fpTick);const s=Math.ceil((st.next-Date.now())/1000);re.disabled=s>0;re.textContent=s>0?`Отправить код ещё раз · ${s} с`:"Отправить код ещё раз"};
  clearInterval(fpTick);fpTick=setInterval(tick,1000);tick();
  const keep=r=>{Object.assign(st,fpSt(st.login,r));sessionStorage.setItem("sh_fp",JSON.stringify(st));tick()};
  re.onclick=async()=>{re.disabled=true;try{keep(await api("/api/forgot",{method:"POST",body:JSON.stringify({login:st.login})}));toast("Код отправлен ещё раз")}catch(err){if(err.wait)keep(err);else tick();toast(err.message)}};
  document.getElementById("fpBack").onclick=()=>{sessionStorage.removeItem("sh_fp");pageForgot()};
  f.onsubmit=async e=>{e.preventDefault();E.clear(["code","pw","pw2"]);
    const code=document.getElementById("fpc").value.replace(/\D/g,"");if(code.length!==6)return E.set("code","Введите 6 цифр из сообщения бота");
    const pw=E.pw();if(!pw)return;
    const b=f.querySelector("[type=submit]");b.disabled=true;
    try{const r=await api("/api/reset",{method:"POST",body:JSON.stringify({login:st.login,code,pw})});sessionStorage.removeItem("sh_fp");sessionStorage.removeItem("sh_fp_login");clearInterval(fpTick);loginWith(r,"Пароль изменён — вы вошли в аккаунт")}
    catch(err){b.disabled=false;if(err.expired){st.next=Date.now();sessionStorage.setItem("sh_fp",JSON.stringify(st));tick()}E.show(err)}};
}

  app.innerHTML=`<div class="auth"><form class="card" id="rsf" novalidate>
   <h1>Новый пароль</h1>

  </form></div>`;
  entered();
  const f=document.getElementById("rsf"),E=fErr();
  f.onsubmit=async e=>{e.preventDefault();E.clear(["pw","pw2"]);const pw=E.pw();if(!pw)return;const b=f.querySelector("[type=submit]");b.disabled=true;

    catch(err){b.disabled=false;if(err.expired)return pageReset(tok);E.show(err)}};

/* ===== Друзья ===== */
function frRel(nick){const f=S.fr;if(!f)return {r:"none"};const n=String(nick).toLowerCase(),eq=u=>u.nick.toLowerCase()===n;
  if(f.friends.some(eq))return {r:"friend"};const o=f.outgoing.find(x=>eq(x.user));if(o)return {r:"out",id:o.id};
  const i=f.incoming.find(x=>eq(x.user));if(i)return {r:"in",id:i.id};return {r:"none"}}
function frInner(nick,big){const x=frRel(nick);
  return x.r==="friend"?`<span class="frb ok">✓ В друзьях</span>`:x.r==="out"?`<span class="frb wait">Заявка отправлена</span>`
   :x.r==="in"?`<button class="frb hot" data-fact="accept" data-id="${x.id}">${big?"Принять заявку в друзья":"Принять в друзья"}</button>`
   :`<button class="frb add" data-fact="add" data-nick="${esc(nick)}">+ ${big?"Добавить в друзья":"В друзья"}</button>`}
function frBtn(nick,big){if(!S.user||S.user.nick===nick)return "";return `<span class="frw" data-fr="${esc(nick)}"${big?' data-big="1"':""}>${frInner(nick,big)}</span>`}
function frBadge(){const n=S.fr?S.fr.incoming.length:0;document.querySelectorAll("[data-frn]").forEach(el=>{el.textContent=n;el.classList.toggle("z",!n)})}
function paintFr(){frBadge();paintInvite();
  document.querySelectorAll("[data-fr]").forEach(el=>{const h=frInner(el.dataset.fr,!!el.dataset.big);if(el.innerHTML!==h)el.innerHTML=h});
  const fb=document.getElementById("frBody");if(fb){const k=frKey();if(fb.dataset.k!==k){fb.dataset.k=k;fb.innerHTML=frBody()}}}
const frKey=()=>JSON.stringify([S.fr,S.party&&S.party.members.map(x=>x.nick),(S.psent||[]).map(r=>r.user.nick)]);
function onFriends(d){const prev=S.fr;S.fr={friends:d.friends||[],incoming:d.incoming||[],outgoing:d.outgoing||[]};
  if(prev){const seen=new Set(prev.incoming.map(r=>r.id)),nw=S.fr.incoming.filter(r=>!seen.has(r.id));
    if(nw.length)toast(nw.length>1?`Новые заявки в друзья: ${nw.length}`:`${nw[0].user.nick} хочет добавить вас в друзья`);
    else{const was=new Set(prev.friends.map(f=>f.nick)),acc=S.fr.friends.find(f=>!was.has(f.nick)&&prev.outgoing.some(r=>r.user.nick===f.nick));if(acc)toast(`${acc.nick} принял(а) вашу заявку — теперь вы друзья`)}}
  paintFr()}
async function loadFr(){if(!S.user)return;try{onFriends(await api("/api/friends"))}catch{}}
const frMsg=r=>r.accepted?`${r.nick} теперь ваш друг 🤝`:`Заявка в друзья отправлена: ${r.nick}`;
// кнопки друзей (на странице друзей, в профиле, в комнате матча) — один общий обработчик
document.addEventListener("click",async e=>{const b=e.target.closest("[data-fact]");if(!b)return;e.preventDefault();e.stopPropagation();
  if(!S.user)return needAuth();if(b.disabled)return;
  const a=b.dataset.fact,post=(u,o)=>api("/api/friends/"+u,{method:"POST",body:JSON.stringify(o)});
  if(a==="remove"&&!b.classList.contains("sure")){const t=b.textContent;b.classList.add("sure");b.textContent="Точно удалить?";setTimeout(()=>{if(b.isConnected){b.classList.remove("sure");b.textContent=t}},3000);return}
  b.disabled=true;
  try{let r;
    if(a==="add"){r=await post("request",{nick:b.dataset.nick});toast(frMsg(r))}
    else if(a==="accept"){r=await post("accept",{id:b.dataset.id});toast(`${r.nick||"Игрок"} теперь ваш друг 🤝`)}
    else if(a==="decline"){await post("decline",{id:b.dataset.id});toast("Заявка отклонена")}
    else if(a==="cancel"){await post("cancel",{id:b.dataset.id});toast("Заявка отменена")}
    else if(a==="remove"){r=await post("remove",{nick:b.dataset.nick});toast(`${r.nick} больше не в друзьях`)}
    await loadFr()}
  catch(err){toast(err.message);if(b.isConnected)b.disabled=false}
},true);
function frRow(u,act,st){return `<div class="frow">${ava(u.nick,u.avatar)}<div class="fn"><a href="#/player/${encodeURIComponent(u.nick)}"><b>${esc(u.nick)}</b></a>${st?`<div class="st${u.inMatch?" m":u.online?" on":""}">${u.inMatch?"● в матче":u.online?"● на сайте":"не в сети"}</div>`:""}</div>${badge(u.elo,"sm")}<div class="fa">${act}</div></div>`}
function frBody(){if(!S.fr)return `<div class="card pad">${skel(3,false)}</div>`;const {friends,incoming,outgoing}=S.fr;
  return (incoming.length?`<div class="card pad fr-in"><h3>Заявки в друзья<span class="cnt">${incoming.length}</span></h3>${incoming.map(r=>frRow(r.user,`<button class="btn btn-o btn-sm" data-fact="accept" data-id="${r.id}">Принять</button><button class="btn btn-g btn-sm" data-fact="decline" data-id="${r.id}">Отклонить</button>`)).join("")}</div>`:"")
   +`<div class="card pad"><h3>Мои друзья<span class="cnt">${friends.length}</span></h3>${friends.length?friends.map(u=>frRow(u,`${pInvBtn(u.nick,"Позвать в пати")}<button class="btn btn-g btn-sm" data-fact="remove" data-nick="${esc(u.nick)}">Удалить</button>`,1)).join(""):`<p class="muted" style="margin:0">Пока никого нет. Добавьте игрока по ID в игре или нику — или прямо после матча, в комнате матча.</p>`}</div>`
   +(outgoing.length?`<div class="card pad"><h3>Отправленные заявки<span class="cnt">${outgoing.length}</span></h3>${outgoing.map(r=>frRow(r.user,`<button class="btn btn-g btn-sm" data-fact="cancel" data-id="${r.id}">Отменить</button>`)).join("")}</div>`:"")}
function pageFriends(){
  if(needAuth())return;
  app.innerHTML=`<div class="wrap"><h1 class="h">Друзья</h1><div class="fr-wrap">
   <div class="card pad"><h3>Добавить в друзья</h3>
    <form class="fadd" id="faddF" autocomplete="off"><input id="fq" maxlength="24" placeholder="ID в игре или ник на StandHub" aria-label="ID в игре или ник на StandHub" enterkeyhint="send"><button class="btn btn-o" type="submit">Отправить заявку</button></form>

   <div id="frBody" style="display:grid;gap:16px"></div></div></div>`;
  const fb=document.getElementById("frBody");fb.innerHTML=frBody();fb.dataset.k=frKey();
  const f=document.getElementById("faddF"),q=document.getElementById("fq"),sug=document.getElementById("fsug");
  f.onsubmit=async e=>{e.preventDefault();const v=q.value.trim();if(!v)return q.focus();const bt=f.querySelector("button");bt.disabled=true;

    bt.disabled=false};
  let tm;q.oninput=()=>{clearTimeout(tm);const v=q.value.trim();if(v.length<2||/^\d+$/.test(v)){sug.innerHTML="";return}
    tm=setTimeout(async()=>{const r=await api("/api/search?q="+encodeURIComponent(v)).catch(()=>[]);if(q.value.trim()!==v)return;
      sug.innerHTML=r.filter(u=>!S.user||u.nick!==S.user.nick).slice(0,5).map(u=>frRow(u,frBtn(u.nick))).join("")},250)};
  loadFr();entered();
  clearInterval(S.frT);S.frT=setInterval(()=>{if(curHash()!=="/friends")return clearInterval(S.frT);loadFr()},20000);
}

function showAccept(m){
  const el=document.getElementById("accModal"),same=el.dataset.id===m.id,prevN=same?+el.dataset.n||0:0,prevAcc=same&&el.dataset.acc==="1";
  const sig=[m.id,m.accepted,m.total,m.iAccepted?1:0,m.acceptDeadline].join("|");
  if(same&&el.dataset.sig===sig&&el.classList.contains("show"))return; // то же самое — не перерисовываем, чтобы не сбивать анимации
  clearTimeout(el._ct);el.classList.add("show");Object.assign(el.dataset,{id:m.id,n:m.accepted,acc:m.iAccepted?"1":"",sig});
  const total=(m.acceptDeadline-m.created)||15000,left=()=>Math.max(0,m.acceptDeadline-(Date.now()+S.skew)),sec0=Math.ceil(left()/1000);
  el.innerHTML=`<div class="card${same?"":" pop"}" role="dialog" aria-modal="true" aria-labelledby="accH">
    <div class="tag">${MODE_NAME[m.mode]} · StandLeo${m.test?" · тестовый матч":""}</div>
    <h2 id="accH">Матч найден!</h2>
    <div class="acc-sec${sec0<=5?" hot":""}" id="accSec" aria-hidden="true">${sec0}</div>
    <div class="bar"><div id="accBar" class="${sec0<=5?"hot":""}" style="width:${left()/total*100}%"></div></div>
    <div class="accepts">${Array.from({length:m.total},(_,i)=>`<i class="${i<m.accepted?"ok":""}${i<m.accepted&&i>=prevN?" new":""}"></i>`).join("")}</div>
    <p class="muted" style="margin-bottom:20px">Приняли <b style="color:#fff">${m.accepted} из ${m.total}</b>. Матч начнётся, когда примут все.${!m.test&&!m.iAccepted?`<br><span style="font-size:13px">Не примете — поиск закроется на время</span>`:""}</p>
    ${m.iAccepted?`<div class="acc-ok${prevAcc?"":" pop-in"}">✓ Вы приняли матч — ждём остальных</div>`:`<button class="btn btn-o btn-lg" style="width:100%" id="accYes">Принять</button><button class="btn btn-g" style="width:100%;margin-top:8px" id="accNo">Отклонить</button>`}
  </div>`;
  const y=document.getElementById("accYes");if(y){y.onclick=()=>{y.disabled=true;act(m.id,"accept")};y.focus()}
  const n=document.getElementById("accNo");if(n)n.onclick=()=>act(m.id,"decline");
  clearInterval(accTimer);
  const upd=()=>{const s=document.getElementById("accSec"),b=document.getElementById("accBar");if(!s)return clearInterval(accTimer);const ms=left(),sec=Math.ceil(ms/1000);
    if(s.textContent!==String(sec)){s.textContent=sec;if(!RM()){s.classList.remove("tick");void s.offsetWidth;s.classList.add("tick")}}
    s.classList.toggle("hot",sec<=5);b.classList.toggle("hot",sec<=5);b.style.width=(ms/total*100)+"%"};
  upd();accTimer=setInterval(upd,200);
}
function closeAccept(){clearInterval(accTimer);const el=document.getElementById("accModal");el.classList.remove("show");["id","n","acc","sig"].forEach(k=>delete el.dataset[k]);clearTimeout(el._ct);el._ct=setTimeout(()=>{if(!el.classList.contains("show"))el.innerHTML=""},300)}
/* обратный отсчёт для всех таймеров на странице */
setInterval(()=>document.querySelectorAll("[data-dl]").forEach(el=>{const s=Math.ceil(Math.max(0,+el.dataset.dl-(Date.now()+S.skew))/1000);el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");el.classList.toggle("hot",s<=5)}),250);

   </div>

     ${[["Матчи",p.matches],["Победы",wr(p)],["K/D",kd(p)],["Хедшоты",hsp(p)],["Средн. убийств",p.matches?(p.kills/p.matches).toFixed(1):"—"],["Убийств всего",p.kills]].map(([k,v])=>`<div class="card stat"><div class="k">${k}</div><div class="v">${numSpan(v)}</div></div>`).join("")}

function matchTable(list,nick){
  return `<table><thead><tr><th>Результат</th><th>Карта</th><th>Режим</th><th>Счёт</th><th>ELO</th><th>Дата</th></tr></thead><tbody>
  ${list.map(m=>{const x=myRes(m,nick);return `<tr class="click" data-m="${m.id}"><td><span class="res ${x.cls}">${x.r}</span>${m.test?' <span class="pill">тест</span>':""}</td><td><b>${esc(m.map)}</b></td><td>${MODE_NAME[m.mode]}</td><td>${x.sc}</td><td class="${(x.p.delta||0)>=0?"w":"l"}">${fmtD(x.p.delta)}</td><td class="muted">${new Date(m.date).toLocaleDateString("ru-RU")}</td></tr>`}).join("")}</tbody></table>`;
}

async function uploadAvatar(file){
  if(!file)return;if(!/^image\//.test(file.type))return toast("Выберите картинку");
  try{
    const img=await createImageBitmap(file);const S2=256,c=document.createElement("canvas");c.width=c.height=S2;
    const k=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,S2,S2);
    const u=await api("/api/avatar",{method:"POST",body:JSON.stringify({image:c.toDataURL("image/jpeg",.88)})});
    S.user=u;toast("Аватар обновлён");renderChrome("/profile");pageProfile();
  }catch(e){toast(e.message||"Не удалось загрузить аватар")}
}

/* ===== Матчи / рейтинг ===== */
const capName=(m,t)=>{const c=m.players.find(p=>p.captain===t);return c?c.nick:"Команда "+t};
async function pageMatches(){
  app.innerHTML=`<div class="wrap"><h1 class="h">Матчи</h1><div class="card" id="ml">${skel(6)}</div></div>`;entered();
  const ms=await api("/api/matches").catch(()=>[]);const el=document.getElementById("ml");if(!el)return;
  el.innerHTML=ms.length?`<div class="scroll"><table><thead><tr><th>Режим</th><th>Карта</th><th>Команды</th><th>Счёт</th><th>Дата</th></tr></thead><tbody>${ms.map(m=>{const t=x=>`<span class="${m.winner===x?"w":""}">Команда ${esc(capName(m,x))}</span>`;return `<tr class="click" data-m="${m.id}"><td>${MODE_NAME[m.mode]}${m.test?' <span class="pill">тест</span>':""}</td><td><b>${esc(m.map)}</b></td><td>${t("A")} <span class="muted">vs</span> ${t("B")}</td><td><b>${m.scoreA==null?"—":m.scoreA+" : "+m.scoreB}</b></td><td class="muted">${new Date(m.date).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</td></tr>`}).join("")}</tbody></table></div>`:
    empty("Матчей пока нет","На StandHub ещё не сыграно ни одного матча. Здесь будет история всех игр.",S.user?`<a class="btn btn-o" href="#/lobby">Найти матч</a>`:"");
  fadeRows(el);bind();
}
/* ----- Комната матча ----- */
const ST={accept:"Принятие матча",veto:"Выбор карты",live:"Идёт игра",dispute:"Проверка результата",finished:"Матч завершён",cancelled:"Матч отменён"};
let matchPoll=null;
async function pageMatch(id){
  clearInterval(matchPoll);
  const cached=S.mv[id];
  if(cached)renderMatch(cached);else app.innerHTML=`<div class="wrap"><div class="card">${skel(5)}</div></div>`;
  const load=async()=>{const m=await api("/api/match/"+id);S.skew=m.now-Date.now();const prev=S.mv[id];S.mv[id]=m;if(curHash()==="/match/"+id&&(!prev||prev.state!==m.state||!m.me)&&mSig(m)!==renderMatch.sig)renderMatch(m);return m};
  try{const m=await load();
    // зрители (не участники) не получают события — обновляем страницу сами
    if(!m.me&&!["finished","cancelled"].includes(m.state))matchPoll=setInterval(()=>{if(curHash()!=="/match/"+id)return clearInterval(matchPoll);load().catch(()=>{})},4000);
  }catch{if(!cached&&curHash()==="/match/"+id)app.innerHTML=`<div class="wrap">${empty("Матч не найден","Возможно, ссылка устарела",`<a class="btn btn-g" href="#/matches">Все матчи</a>`)}</div>`}
}
let JUST=null; // карты, убранные только что (для анимации)
const mSig=m=>JSON.stringify(m,(k,v)=>k==="now"?undefined:v);
function renderMatch(m){
  const keep=chatKeep();
  const L0=renderMatch.last||{},same=L0.id===m.id,stCh=same&&L0.state!==m.state,nb=(m.bans||[]).length;
  JUST=same&&m.state==="veto"&&L0.state==="veto"&&nb>L0.bans?new Set(m.bans.slice(L0.bans).map(b=>b.map)):null;
  renderMatch.last={id:m.id,state:m.state,bans:nb};renderMatch.sig=mSig(m);
  const fin=m.state==="finished",teams=m.players.some(p=>p.team);
  const avg=t=>{const ps=m.players.filter(p=>p.team===t);return ps.length?Math.round(ps.reduce((a,p)=>a+p.elo,0)/ps.length):"—"};
  const wt=t=>fin?(m.winner==="draw"?`<span class="wtag muted">Ничья</span>`:m.winner===t?`<span class="wtag w">Победа</span>`:`<span class="wtag l">Поражение</span>`):"";
  const head=teams?`<div class="mhead">
     <div class="team"><div class="logo-t ta">A</div><div><b>Команда ${esc(capName(m,"A"))}</b><div class="muted" style="font-size:13px">Средний ELO ${avg("A")}</div>${wt("A")}</div></div>
     <div class="score">${fin&&m.scoreA!=null?`<div class="s">${m.scoreA}<span>:</span>${m.scoreB}</div>`:`<div class="s vs">VS</div>`}<div class="st st-${m.state}">${ST[m.state]}</div>${m.map?`<div class="muted" style="margin-top:6px;font-weight:700">${esc(m.map)}</div>`:""}</div>
     <div class="team r"><div><b>Команда ${esc(capName(m,"B"))}</b><div class="muted" style="font-size:13px">Средний ELO ${avg("B")}</div>${wt("B")}</div><div class="logo-t tb">B</div></div>
   </div>`:"";
  const body=teams?`<div class="room"><div class="card">${roster(m,"A")}</div><div class="grid center" style="align-content:start">${center(m)}</div><div class="card">${roster(m,"B")}</div></div>`
    :`<div class="room" style="grid-template-columns:1fr 1fr"><div class="grid center" style="align-content:start">${center(m)}</div><div class="card"><div class="thead"><b>Игроки</b><span class="muted">${m.accepted} из ${m.total} приняли</span></div>${m.players.map(p=>prow(m,p,true)).join("")}</div></div>`;
  app.innerHTML=`<div class="wrap">
   <div class="mtop"><div><div class="tag">${MODE_NAME[m.mode]} · StandLeo${m.test?" · тестовый матч":""}</div><h1 class="h" style="margin:4px 0 0">Комната матча</h1></div><div class="muted" style="font-size:13px">Матч #${m.id}</div></div>
   ${head}${body}</div>`;
  mountChat(m,keep);
  bindMatch(m);
  if(S.enter)return entered();
  if(stCh&&!RM()){ // этап матча сменился — плавно показываем новое
    rise([...app.querySelectorAll(".center>*")].filter(e=>!(m.state==="live"&&e.classList.contains("mapbig"))),70,450);
    const mb=m.state==="live"&&app.querySelector(".mapbig");if(mb)mb.classList.add("reveal");
    if(fin){app.querySelectorAll(".score .s,.resbig").forEach(e=>e.classList.add("pop-in"));countUp(app.querySelector(".center"))}
  }
}
function prow(m,p,acc){
  return `<div class="prow${p.me?" me":""}">${ava(p.nick,p.avatar)}<div class="pn">${p.bot?`<b>${esc(p.nick)}</b>`:`<a href="#/player/${encodeURIComponent(p.nick)}"><b>${esc(p.nick)}</b></a>`}<div class="pills">${p.party?`<span class="pill pty" title="Пришли в матч вместе, одним пати">${esc(p.party)}</span>`:""}${p.captain?`<span class="pill cap">Капитан</span>`:""}${p.host?`<span class="pill host">Хост</span>`:""}${p.bot?`<span class="pill">Бот</span>`:""}${p.me?`<span class="pill me">Вы</span>`:""}${!acc&&!p.bot&&!p.me?frBtn(p.nick):""}</div></div>
   <div class="pr">${acc?(p.accepted?`<span class="w">✓ принял</span>`:`<span class="muted">ждём…</span>`):`${badge(p.elo,"sm")}<span>${p.elo}</span>${m.state==="finished"&&p.delta!=null?`<span class="${p.delta>=0?"w":"l"}">${fmtD(p.delta)}</span>`:""}`}</div></div>`;
}
function roster(m,t){const ps=m.players.filter(p=>p.team===t).sort((a,b)=>b.elo-a.elo);return `<div class="thead"><b>Команда ${esc(capName(m,t))}</b><span class="muted">${ps.length} игр.</span></div>${ps.map(p=>prow(m,p)).join("")}`}
function center(m){
  const me=m.me,h=m.host||{};
  if(m.state==="accept")return `<div class="card pad"><h3>Ждём, пока все примут матч</h3><p class="muted">Приняли ${m.accepted} из ${m.total}. Осталось <b style="color:#fff" data-dl="${m.acceptDeadline}">0:15</b></p>${me&&!m.iAccepted?`<button class="btn btn-o btn-lg" style="width:100%;margin-top:16px" data-acc>Принять матч</button>`:""}</div>`;
  if(m.state==="cancelled")return `<div class="card pad"><h3>Матч отменён</h3><p class="muted">${esc(m.cancelReason||"")}. ELO не изменился.</p><a class="btn btn-o" style="margin-top:16px" href="#/lobby">В лобби</a></div>`+fbCard(m)+chatPh(m);
  if(m.state==="veto"){
    const my=me&&me.captain&&m.turn===me.team;
    return `<div class="card pad"><div class="vhead"><div><h3 style="margin:0">Выбор карты</h3><div class="muted" style="font-size:13px">Капитаны по очереди убирают карты. Последняя оставшаяся — карта матча.</div></div><div class="vt" data-dl="${m.turnDeadline}" aria-label="Время на ход">0:20</div></div>
     <div class="turn ${my?"mine":""}">${my?"Ваш ход — уберите одну карту":`Убирает команда ${esc(capName(m,m.turn))}`}</div>
     <div class="vmaps">${m.maps.map(x=>{const b=m.bans.find(y=>y.map===x);return `<button class="vmap${b?" banned":""}${b&&JUST&&JUST.has(x)?" just":""}${my&&!b?" can":""}" style="background:${mapBg(x)}" ${my&&!b?`data-ban="${esc(x)}" aria-label="Убрать карту ${esc(x)}"`:"disabled"}><span class="vn">${esc(x)}</span>${b?`<span class="vb">Убрана · ${b.auto?"время вышло":"команда "+esc(capName(m,b.team))}</span>`:my?`<span class="vb">Убрать</span>`:""}</button>`}).join("")}</div>
     <div class="muted" style="font-size:13px;margin-top:10px">Если капитан не успеет за 20 секунд, карта уберётся случайно.</div></div>`+chatPh(m);
  }
  const mapCard=`<div class="mapbig" style="background:${mapBg(m.map)}"><div><div class="tag" style="color:#fff">Карта матча</div><b>${esc(m.map)}</b></div></div>`;
  if(m.state==="live"){
    let guide;
    if(!me)guide=`<div class="card pad"><h3>Идёт игра</h3><p class="muted">Хост матча: <b style="color:#fff">${esc(h.nick||"")}</b>. ${m.claim?`Капитан ${esc(m.claim.nick)} отметил: <b style="color:#fff">${outFor(m,claimW(m.claim))}</b> — ждём подтверждения соперников.`:"Результат появится, когда капитан отметит его, а соперники подтвердят."}</p></div>`;
    else if(me.host)guide=`<div class="card pad"><h3>Вы — хост матча</h3><ol class="steps">
      <li><b>Создайте лобби в StandLeo</b><span class="muted">Карта ${esc(m.map)} · ${MODE_NAME[m.mode]} · <b style="color:#fff">13 раундов до победы</b></span></li>
      <li><b>Ждите сообщений «.» в личке</b><span class="muted">Игроки найдут вас по вашему ID <b style="color:#fff">${esc(h.soid||"")}</b> и напишут «.» — пригласите каждого в лобби</span></li>
      <li><b>Рассадите игроков по командам и начните</b><span class="muted">Составы команд — слева и справа</span></li></ol></div>`;
    else guide=`<div class="card pad"><h3>Как зайти в матч</h3><ol class="steps">
      <li><b>Найдите хоста в StandLeo по ID</b><span class="muted">Хост: ${esc(h.nick||"")}</span><span class="idcopy"><code class="vcode">${esc(h.soid||"")}</code><button class="btn btn-g btn-sm" data-copy="${esc(h.soid||"")}">Скопировать ID</button></span></li>
      <li><b>Напишите ему «.» в личные сообщения</b><span class="muted">Так хост поймёт, что вы из этого матча, и пригласит вас в лобби</span></li>
      <li><b>Играйте за свою команду</b><span class="muted">Карта ${esc(m.map)} · 13 раундов до победы</span></li></ol></div>`;
    return mapCard+guide+resultCard(m)+chatPh(m)+(me?`<div class="card pad"><h3>Матч не состоялся?</h3><p class="muted" style="font-size:14px">Если лобби так и не собралось — проголосуйте. Когда наберётся ${m.cancelNeed} из ${m.total} голосов, матч отменится без изменения ELO.</p><button class="btn btn-g" style="margin-top:12px" id="voteC">${me.votedCancel?"Отозвать голос":"Матч не состоялся"} · ${m.cancelVotes}/${m.cancelNeed}</button></div>`:"");
  }

   :lim?`<button class="btn btn-g sh-cta" disabled>Снова можно ${dtm(x.next)}</button>`
   :!S.tasks?`<button class="btn btn-g sh-cta" disabled>Загрузка…</button>`

   :`<button class="btn btn-o sh-cta" data-buy="${x.id}">Купить за ${fmt(x.price)}</button>`;

  const prog=S.user&&S.tasks&&can&&need&&!lim?`<div class="sh-prog"><div class="bar"><div style="width:${Math.min(100,Math.round(c/x.price*100))}%"></div></div><span>${fmt(c)} / ${fmt(x.price)}</span></div>`:"";
  return `<div class="card sh-item${can?"":" out"}" data-item="${x.id}"><div class="sh-vis"><span class="sh-tag">Промокод</span><span class="sh-for">StandLeo</span>${GOLD()}</div>
   <div class="sh-body"><b class="sh-name">${esc(x.title)}</b><div class="muted sh-desc">Промокод для StandLeo. После покупки напишите ${esc(shWho())} в Telegram — вам выдадут код.</div>
    <div class="sh-meta"><span class="sh-price">${COIN}<b>${fmt(x.price)}</b></span>${st}</div>${x.limit?`<div class="sh-lim muted">Не больше ${x.limit} в неделю на игрока</div>`:""}${prog}${act}</div></div>`;
}
