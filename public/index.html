const TOPICS={question:"Вопрос",match:"Проблема с матчем",account:"Аккаунт и подтверждение",player:"Жалоба на игрока",idea:"Предложение",shop:"Магазин и промокоды",other:"Другое"};
const FAQ=[["Бот не принимает скриншот профиля","Нужен скриншот экрана «Мой профиль» (вкладка «Общее») целиком, без обрезки — с надписью «Мой профиль» и вашим ID. Чужой профиль («Профиль друга») не подходит. Если ID не читается, отправьте скриншот боту как файл, без сжатия."],
 ["Забыл пароль или email","На странице входа нажмите «Забыли пароль?» — код придёт в Telegram от нашего бота (того, через которого вы подтверждали аккаунт). Не помните email — напишите боту команду /password: он покажет email для входа и пришлёт ссылку для нового пароля."],
 ["Почему у меня закрыт поиск матчей?","Скорее всего, вы не приняли несколько найденных матчей за сутки. 1-й пропуск — предупреждение, 2-й — 5 минут, 3-й — 30 минут, дальше — 2 часа. Сколько осталось, видно в «Играть»."],
 ["Как зайти в матч?","Когда карта выбрана, в комнате матча появится ID хоста. Найдите его в StandLeo, напишите «.» в личные сообщения — хост пригласит вас в лобби."],
 ["Как отметить результат матча?","После игры капитан нажимает в комнате матча «Мы победили» или «Мы проиграли» — кнопки открываются через 10 минут после начала. Соперники подтверждают результат или оспаривают его в течение 30 минут. Если не ответят — результат засчитается сам."],
 ["Засчитали неверный результат","Пока результат не засчитан — нажмите «Оспорить» в комнате матча и отправьте Telegram-боту запись экрана или скриншот итогового счёта: администратор проверит матч. Если результат уже засчитан — напишите сюда и укажите номер матча (он есть в комнате матча)."],
 ["Как получить монеты?","Выполняйте ежедневные задания и забирайте бонус за вход в разделе «Задания». Тратить монеты можно в «Магазине»."],
 ["Как купить промокод на голду?","Откройте «Магазин» и нажмите «Купить». Затем напишите в Telegram @TG и пришлите скриншот заказа — вам выдадут промокод. Номер и статус заказа видны в разделе «Мои покупки»."],
 ["Где ввести промокод в StandLeo?","На главном экране игры нажмите «События», затем «Секретный код» — и вставьте туда промокод, который вам прислали в Telegram."],
 ["Мне не выдали промокод","Проверьте, что написали @TG в Telegram и прислали скриншот заказа с его номером. Статус заказа виден в «Магазине», в разделе «Мои покупки». Если ответа долго нет — напишите в поддержку, тема «Магазин и промокоды»."],
 ["Промокод не сработал","Проверьте, что вводите его в StandLeo через «События» → «Секретный код», без лишних пробелов. Если всё равно не работает — напишите в поддержку, тема «Магазин и промокоды», и укажите код: администратор проверит и поможет."],
 ["Как пожаловаться на игрока?","После матча откройте комнату матча и нажмите «Жалоба» рядом с игроком — это быстрее, чем писать в поддержку."]];
function supHtml(list){
  return list.map(x=>{const last=x.msgs[x.msgs.length-1],st=x.status==="closed"?["","Закрыто"]:last.by==="admin"?["ans","Есть ответ"]:["open","Ждёт ответа"];
    return `<div class="tkt${x.unread?" new":""}"><div class="tkt-h"><b>${esc(x.topic)}${x.mid?` <span class="muted" style="font-weight:600">· матч #${esc(x.mid)}</span>`:""}</b><span class="tkt-st ${st[0]}">${st[1]}</span></div>
     ${x.msgs.map(m=>`<div class="msg${m.by==="admin"?" adm":""}"><div class="mh"><b>${m.by==="admin"?"Поддержка StandHub":"Вы"}</b> · ${dtm(m.at)}</div>${esc(m.t)}</div>`).join("")}
     ${x.status==="open"?`<form class="tkt-f" data-tid="${x.id}"><textarea class="txa" maxlength="1500" rows="2" placeholder="Дополнить обращение…" aria-label="Сообщение"></textarea><button class="btn btn-g btn-sm" type="submit">Отправить</button></form><div class="tkt-a"><button class="frb" data-tclose="${x.id}">✓ Вопрос решён</button></div>`:""}</div>`}).join("")}
function paintSup(){const el=document.getElementById("supList");if(!el)return;const l=S.sup||[];document.getElementById("supMine").classList.toggle("hid",!l.length);
  const h=supHtml(l);if(el._h===h)return;el._h=h;const kp=keepTx(el);el.innerHTML=h;restoreTx(el,kp);
  el.querySelectorAll("form[data-tid]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const t=f.querySelector("textarea"),b=f.querySelector("button");if(!t.value.trim())return t.focus();b.disabled=true;
    try{const r=await api("/api/support/reply",{method:"POST",body:JSON.stringify({id:f.dataset.tid,text:t.value})});t.value="";S.sup=r.list;paintSup();toast("Сообщение отправлено")}catch(err){toast(err.message);b.disabled=false}});
  el.querySelectorAll("[data-tclose]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await api("/api/support/close",{method:"POST",body:JSON.stringify({id:b.dataset.tclose})});S.sup=r.list;paintSup();toast("Обращение закрыто")}catch(e){toast(e.message);b.disabled=false}})}
async function loadSup(){try{const r=await api("/api/support");S.sup=r.list;paintSup();if(r.list.some(x=>x.unread))api("/api/support/seen",{method:"POST"}).catch(()=>{})}catch{}}
function pageSupport(){
  if(!S.shop)loadShop();
  const u=S.user;
  app.innerHTML=`<div class="wrap"><h1 class="h">Поддержка</h1><div class="doc">
   ${u?`<div class="card hid" id="supMine"><h2>${ic("help")}Мои обращения</h2><div id="supList"></div></div>
    <div class="card"><h2>${ic("send")}Написать в поддержку</h2><form class="sup-f" id="supF" novalidate>
     <div class="two"><div><label for="supT">Тема</label><select id="supT">${Object.entries(TOPICS).map(([k,t])=>`<option value="${k}">${t}</option>`).join("")}</select></div>
      <div><label for="supM">Номер матча <span style="font-weight:400">(если вопрос о матче)</span></label><input id="supM" maxlength="20" placeholder="например, 3fa9c01b2d" autocomplete="off"></div></div>
     <div><label for="supX">Сообщение</label><textarea class="txa" id="supX" maxlength="1500" rows="5" placeholder="Опишите, что случилось. Ответ придёт сюда и в Telegram."></textarea></div>
     <div><button class="btn btn-o" type="submit">Отправить</button></div></form></div>`
    :`<div class="card">${empty("Нужен аккаунт","Войдите, чтобы написать в поддержку — ответ придёт сюда и в Telegram. Забыли пароль — восстановите его через Telegram-бота.",`<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><a class="btn btn-o" href="#/login">Войти</a><a class="btn btn-g" href="#/forgot">Забыли пароль?</a></div>`)}</div>`}
   <div class="card faq"><h2>${ic("book")}Частые вопросы</h2>${FAQ.map(([q,a])=>`<details><summary>${q}</summary><p>${a.replace(/@TG/g,tgw())}</p></details>`).join("")}</div>
  </div></div>`;entered();
  if(!u)return;
  const f=document.getElementById("supF");
  f.onsubmit=async e=>{e.preventDefault();const x=document.getElementById("supX"),b=f.querySelector("[type=submit]");if(x.value.trim().length<10){toast("Опишите вопрос подробнее — хотя бы пару предложений");return x.focus()}
    b.disabled=true;try{const r=await api("/api/support/new",{method:"POST",body:JSON.stringify({topic:document.getElementById("supT").value,mid:document.getElementById("supM").value,text:x.value})});
      S.sup=r.list;x.value="";document.getElementById("supM").value="";paintSup();toast("Обращение отправлено — ответим как можно скорее");document.getElementById("supMine").scrollIntoView({behavior:RM()?"auto":"smooth",block:"start"})}
    catch(err){toast(err.message)}b.disabled=false};
  if(S.sup)paintSup();loadSup();
}
/* ===== Значок на экран (установка как приложение) ===== */
let bip=null;
const DOTS3=`<svg width="6" height="18" viewBox="0 0 6 18" style="vertical-align:-3px;margin:0 2px" aria-hidden="true"><circle cx="3" cy="3" r="2" fill="currentColor"/><circle cx="3" cy="9" r="2" fill="currentColor"/><circle cx="3" cy="15" r="2" fill="currentColor"/></svg>`;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const iOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const touch=()=>matchMedia("(pointer:coarse)").matches;
const canInstall=()=>!standalone()&&(!!bip||iOS()||touch());
function paintInstall(){const on=canInstall(),mob=touch();document.querySelectorAll("[data-install]").forEach(el=>{el.classList.toggle("hid",!on);const l=el.querySelector(".il");if(l&&!el.closest(".more"))l.textContent=mob?"Значок на экран":"Установить приложение"})}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();bip=e;paintInstall()});
window.addEventListener("appinstalled",()=>{bip=null;paintInstall();toast("Готово! StandHub теперь на экране")});
async function doInstall(){
  if(bip){const e=bip;bip=null;try{await e.prompt();const r=await e.userChoice;if(r&&r.outcome==="accepted")toast("Готово! Значок StandHub появится на экране")}catch{}paintInstall();return}
  const how=steps=>openX(`<div class="card pm" role="dialog" aria-modal="true" aria-labelledby="xH"><button class="pm-x" data-x aria-label="Закрыть">×</button><h3 id="xH">Значок StandHub на экране</h3><p class="muted pm-sub">StandHub будет открываться как приложение — на весь экран, без адресной строки.</p>
    <ol class="howto">${steps.map(x=>`<li><span>${x}</span></li>`).join("")}</ol>${iOS()?"":`<p class="muted" style="font-size:13px;margin-top:14px">Открыли сайт из Telegram? Сначала нажмите <b>${DOTS3}</b> → <b>«Открыть в браузере»</b>.</p>`}
    <button class="btn btn-o" data-x style="width:100%;margin-top:18px">Понятно</button></div>`);
  if(iOS())how(["Нажмите <b>«Поделиться»</b> — квадрат со стрелкой вверх внизу экрана","Прокрутите вниз и выберите <b>«На экран „Домой“»</b>","Нажмите <b>«Добавить»</b> — значок появится на экране"]);
  else how([`Откройте меню браузера — <b>${DOTS3}</b> (три точки) вверху справа`,"Выберите <b>«Добавить на главный экран»</b> или <b>«Установить приложение»</b>","Нажмите <b>«Добавить»</b> — значок появится на экране"]);
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-install]");if(!b)return;e.preventDefault();closeMore();doInstall()});
if("serviceWorker" in navigator&&window.isSecureContext)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
async function pageLeaderboard(){
  app.innerHTML=`<div class="wrap"><h1 class="h">Таблица лидеров</h1><div id="lb"><div class="card">${skel(8)}</div></div></div>`;entered();
  const list=(await getLb()).map((p,i)=>({...p,rank:i+1}));const el=document.getElementById("lb");if(!el)return;
  if(!list.length){el.innerHTML=`<div class="card">${lbEmpty()}</div>`;return}
  el.innerHTML=`${list.length>=3?`<div class="lb-top">${[1,0,2].map(i=>{const p=list[i];return `<a href="#/player/${encodeURIComponent(p.nick)}" class="card podium p${i+1}"><span class="rk">#${i+1}</span>${ava(p.nick,p.avatar)}<b style="font-size:18px;display:block">${esc(p.nick)}</b><div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px">${badge(p.elo,"sm")}<b>${p.elo} ELO</b></div><div class="muted" style="font-size:13px;margin-top:4px">${p.matches} матчей · ${wr(p)} побед</div></a>`}).join("")}</div>`:""}
   <div class="card scroll">${lbTable(list.length>=3?list.slice(3):list,false)}</div>`;
  fadeRows(el);bind();
}

/* ===== Роутер ===== */
function route(){
  S.enter=true;
  const h=location.hash.slice(1)||"/";const [,a,b]=h.split("/");
  renderChrome("/"+(a||""));window.scrollTo(0,0);clearInterval(matchPoll);clearTimeout(S.enT);S.chgM=null;closeInvite();closeX();closeMore();
  if(!a)pageHome();else if(a==="login")pageAuth("login");else if(a==="register")pageAuth("register");else if(a==="verify")pageVerify();
  else if(a==="forgot")pageForgot();else if(a==="reset")pageReset(b);else if(a==="password")pagePassword();
  else if(a==="lobby")pageLobby();else if(a==="profile")pageProfile();else if(a==="player")pageProfile(decodeURIComponent(b));
  else if(a==="friends")pageFriends();else if(a==="matches")pageMatches();else if(a==="match")pageMatch(b);else if(a==="leaderboard")pageLeaderboard();else if(a==="admin")pageAdmin(b);
  else if(a==="tasks")pageTasks();else if(a==="shop")pageShop();else if(a==="rules")pageRules(b);else if(a==="support")pageSupport();else pageHome();
  bind();
}
function bind(){
  document.querySelectorAll("[data-p]").forEach(r=>r.onclick=()=>location.hash="#/player/"+encodeURIComponent(r.dataset.p));
  document.querySelectorAll("[data-m]").forEach(r=>r.onclick=()=>location.hash="#/match/"+r.dataset.m);
}
document.getElementById("q").addEventListener("keydown",async e=>{if(e.key!=="Enter")return;const r=await api("/api/search?q="+encodeURIComponent(e.target.value)).catch(()=>[]);if(r[0])location.hash="#/player/"+encodeURIComponent(r[0].nick);else toast("Игрок не найден")});
window.addEventListener("hashchange",route);
(async()=>{if(S.token){try{S.user=await api("/api/me")}catch{S.token=null;localStorage.removeItem("sh_token")}}connectLive();route()})();
</script>
