<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StandHub — соревновательный StandLeo</title>
<script>try{if(localStorage.getItem("sh_motion")==="off")document.documentElement.classList.add("no-motion")}catch(e){}</script>
<style>
:root{
  --bg:#141416;--bg2:#1c1c1f;--card:#232327;--card2:#2b2b30;--line:#34343a;
  --text:#fff;--muted:#a3a3ad;--orange:#ff5500;--orange2:#ff7a33;
  --ease:cubic-bezier(.2,.8,.2,1);--green:#3fcf6a;--red:#ff4d4d;--yellow:#ffc800;
  --l1:#eeeeee;--l2:#1ce400;--l4:#ffc800;--l8:#ff6309;--l10:#fe1f00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.upper{text-transform:uppercase;letter-spacing:.02em}
/* Topbar */
.top{position:fixed;inset:0 0 auto 0;height:60px;background:#0f0f11;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:50}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:.04em;font-style:italic}
.logo b{color:var(--orange)}
.logo svg{width:30px;height:30px}
.search{flex:1;max-width:420px;margin-left:24px;position:relative}
.search input{width:100%;height:38px;background:var(--card);border:1px solid var(--line);border-radius:6px;color:#fff;padding:0 12px 0 36px}
.search span{position:absolute;left:12px;top:8px;color:var(--muted)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.btn{height:40px;padding:0 20px;border-radius:4px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn-o{background:linear-gradient(180deg,#ff6c22,#ff4f00);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}.btn-o:hover{background:linear-gradient(180deg,#ff8240,#ff5f14)}
.btn-g{background:var(--card2);color:#fff;border:1px solid var(--line)}.btn-g:hover{background:#38383e}
.btn-lg{height:52px;padding:0 36px;font-size:17px}
.userchip{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:6px;background:var(--card)}
.ava{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff5500,#7a2a00);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
/* Sidebar */
.side{position:fixed;top:60px;bottom:0;left:0;width:220px;background:#0f0f11;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;z-index:40}
.side a{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:6px;color:var(--muted);font-weight:600}
.side a:hover{background:var(--card);color:#fff}
.side a.on{background:linear-gradient(90deg,rgba(255,85,0,.2),rgba(255,85,0,.04) 70%,transparent);color:#fff;box-shadow:inset 3px 0 0 var(--orange)}
.side .ic{width:20px;text-align:center}
.side .sep{height:1px;background:var(--line);margin:12px 6px}
.side .online{margin-top:auto;font-size:13px;color:var(--muted);padding:12px 14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
main{margin:60px 0 0 220px;min-height:calc(100vh - 60px)}
.wrap{max-width:1180px;margin:0 auto;padding:32px}
h1.h{font-size:30px;font-weight:900;text-transform:uppercase;font-style:italic;margin-bottom:24px}
.card{background:linear-gradient(180deg,#28282d,#212125);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px -22px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04)}
.pad{padding:20px}
.muted{color:var(--muted)}
.grid{display:grid;gap:16px}
/* Level badge */
.lvl{--c:var(--l4);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;color:var(--c);background:radial-gradient(circle,#1a1a1d 58%,transparent 60%),conic-gradient(var(--c) var(--p,70%),#3a3a40 0);flex:none}
.lvl.sm{width:28px;height:28px;font-size:12px}
.lvl.xl{width:84px;height:84px;font-size:34px}
/* Home */
.hero{position:relative;overflow:hidden;min-height:560px;display:flex;align-items:center;background:
 radial-gradient(800px 400px at 80% 40%,rgba(255,85,0,.35),transparent 60%),
 radial-gradient(600px 300px at 10% 90%,rgba(255,85,0,.12),transparent 60%),#0c0c0e;border-bottom:1px solid var(--line)}
.hero .wrap{position:relative;z-index:2;width:100%}
.hero h1{font-size:72px;line-height:.95;font-weight:900;font-style:italic;text-transform:uppercase}
.hero h1 .rot{color:var(--orange);display:block;height:1.25em;line-height:1.25em;overflow:hidden;margin-top:-.08em}
.hero h1 .rot span{display:block;animation:rot 14s cubic-bezier(.7,0,.3,1) infinite}
.hero h1 .rot i{display:block;height:1.25em;font-style:inherit}
@keyframes rot{0%,12.1%{transform:translateY(0)}14.3%,26.4%{transform:translateY(-1.25em)}28.6%,40.7%{transform:translateY(-2.5em)}42.9%,55%{transform:translateY(-3.75em)}57.1%,69.3%{transform:translateY(-5em)}71.4%,83.6%{transform:translateY(-6.25em)}85.7%,97.9%{transform:translateY(-7.5em)}100%{transform:translateY(-8.75em)}}
.no-motion .hero h1 .rot span{animation:none}
.hero p{max-width:520px;color:#d0d0d6;font-size:18px;margin:24px 0 32px}
.hero .stripes{position:absolute;right:-80px;top:0;bottom:0;width:55%;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 40%);mask:linear-gradient(90deg,transparent,#000 40%)}
.hero .emblem{position:absolute;right:8%;top:50%;transform:translateY(-50%);width:340px;height:340px;opacity:.9}
.online-big{margin-top:20px;color:var(--muted)}
.online-big b{color:#fff}
.sec{padding:64px 0}
.sec h2{font-size:38px;font-weight:900;font-style:italic;text-transform:uppercase;margin-bottom:12px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:32px}
.feat .card{padding:24px;display:flex;flex-direction:column;gap:10px;min-height:240px}
.tag{font-size:12px;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:.06em}
.tag.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px}
.feat h3{font-size:22px;font-weight:900;text-transform:uppercase;font-style:italic}
.feat .btn{margin-top:auto;align-self:flex-start}
.cta{text-align:center;padding:72px 0;background:linear-gradient(90deg,#1b0d05,#2a1206,#1b0d05);border-top:1px solid var(--line)}
footer{border-top:1px solid var(--line);padding:40px 32px;color:var(--muted);font-size:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:1180px;margin:0 auto}
footer h4{color:#fff;margin-bottom:10px;text-transform:uppercase;font-size:13px}
footer a{display:block;margin:4px 0}footer a:hover{color:#fff}
/* Auth */
.auth{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:32px;background:radial-gradient(600px 300px at 50% 0,rgba(255,85,0,.18),transparent 70%)}
.auth .card{width:100%;max-width:420px;padding:32px}
.auth h1{font-size:26px;font-weight:900;font-style:italic;text-transform:uppercase;margin-bottom:6px}
.field{margin-top:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;height:46px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:#fff;padding:0 14px}
.field input:focus{border-color:var(--orange);outline:none}
.err{color:var(--red);font-size:13px;margin-top:6px;min-height:0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;color:var(--muted)}
.chk input{margin-top:4px;accent-color:var(--orange);width:16px;height:16px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:20px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.social{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Lobby */
.lobby{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.party{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}
.slot{aspect-ratio:3/4;border-radius:8px;background:var(--bg2);border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.slot.me{border:1px solid var(--orange);background:linear-gradient(180deg,rgba(255,85,0,.15),var(--bg2));color:#fff}
.slot .ava{width:56px;height:56px;font-size:20px}
.slot .plus{width:48px;height:48px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:22px}
/* пати */
.slot{position:relative;min-width:0}
.slot b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .crown{position:absolute;top:8px;left:8px;color:var(--yellow);display:grid;line-height:0}
.slot .crown .ic{width:16px;height:16px}
.slot .sst{font-size:11px;line-height:1.1;color:var(--muted)}
.slot .sst.on{color:var(--green)}.slot .sst.m{color:var(--orange2)}
.slot.mem{border-style:solid;color:#fff}
.slot.off .ava,.slot.off b{opacity:.55}
.slot.inv{color:#fff}.slot.inv .ava{opacity:.5}
.slot .sl-a{display:flex;flex-direction:column;align-items:center;gap:10px;color:inherit;max-width:100%;min-width:0}
.slot .sx{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-size:15px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0;font-family:inherit;z-index:1}
.slot .sx:hover,.slot .sx:focus-visible{color:#fff;border-color:var(--red)}
.slot .sx.sure{padding:0 8px;background:var(--red);border-color:var(--red);color:#fff;font-size:11px;font-weight:800}
.ptbar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-6px 0 0;min-height:32px}
.ptbar b{color:#fff}
.chip.lock{opacity:.55;cursor:not-allowed}.chip.na:not(.on){opacity:.38}
.modal .card.pm{text-align:left;max-width:480px;padding:24px}
.pm h3{margin:0 40px 6px 0;font-size:20px}
.pm-sub{font-size:13px;margin:0 0 10px}
.pm-list{max-height:min(60vh,460px);overflow:auto;margin:0 -6px;padding:0 6px}
.pm-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:17px;border:1px solid var(--line);background:var(--bg2);color:#fff;font-size:20px;line-height:1;cursor:pointer;font-family:inherit}
.pm-x:hover{border-color:var(--orange)}
.pm-empty{text-align:center;padding:14px 0 4px}.pm-empty p{margin:0 0 14px;font-size:14px}
.pinv-wrap{position:fixed;top:72px;right:24px;z-index:150;display:grid;gap:10px;width:min(390px,calc(100vw - 32px));pointer-events:none}
.pinv{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:14px;border-color:var(--orange);box-shadow:0 18px 44px -16px rgba(0,0,0,.85),0 0 0 1px rgba(255,85,0,.3),0 0 34px -14px rgba(255,85,0,.7);animation:pinvIn .45s var(--ease) both}
.pinv .ava{width:44px;height:44px;flex:none;font-size:16px}
.pinv .pi-t{flex:1;min-width:0;font-size:14px;line-height:1.35}
.pinv .pi-t b{color:#fff}
.pinv .pi-t .muted{font-size:12px;margin-top:2px}
.pinv .pi-a{display:flex;flex-direction:column;gap:6px;flex:none}
.pinv-more{pointer-events:auto;justify-self:end;font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px 10px}
@keyframes pinvIn{from{opacity:0;transform:translateY(-14px) scale(.97)}}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 16px;border-radius:4px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);font-weight:700}
.chip.on{border-color:var(--orange);color:#fff;background:rgba(255,85,0,.12)}
.mq{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:8px;border-radius:9px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;line-height:1;vertical-align:1px}
.mq.z{display:none}
.qhint{margin-top:8px;font-size:13px;font-weight:600;color:#ffb37a;max-width:440px}
.qhint:empty{display:none}
.findbox{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
.btn-find{height:64px;min-width:280px;font-size:20px;font-style:italic;font-weight:900}
.btn-find.searching{background:var(--card2);border:1px solid var(--orange)}
.maps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.map{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);height:64px;border-radius:6px;display:flex;align-items:flex-end;padding:8px;font-weight:800;font-size:13px;text-transform:uppercase;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden}
.map.on{border-color:var(--orange)}
.map.off{opacity:.35}
.qrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.qrow:last-child{border:0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:100;padding:20px;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal.show{opacity:1;visibility:visible;transition:opacity .25s}
.modal .card{max-width:560px;width:100%;padding:32px;text-align:center;border-color:var(--orange)}
.modal h2{font-size:32px;font-weight:900;font-style:italic;text-transform:uppercase;color:var(--orange)}
.accepts{display:flex;justify-content:center;gap:6px;margin:20px 0}
.accepts i{width:28px;height:8px;border-radius:2px;background:var(--line)}
.accepts i.ok{background:var(--green)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:16px 0}
.bar div{height:100%;background:var(--orange);transition:width 1s linear}
/* Profile */
.phead{background:linear-gradient(120deg,#2a1206 0%,#1c1c1f 60%);border:1px solid var(--line);border-radius:8px;padding:28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.phead .ava{width:96px;height:96px;font-size:36px;border:3px solid var(--orange)}
.phead h1{font-size:32px;font-weight:900}
.flag{font-size:13px;color:var(--muted)}
.elo-box{margin-left:auto;display:flex;align-items:center;gap:16px}
.elo-box .v{font-size:32px;font-weight:900}
.elo-prog{width:220px}
.elo-prog .bar{margin:6px 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:24px 0 20px;overflow-x:auto}
.tabs button{background:none;color:var(--muted);height:46px;padding:0 18px;font-weight:700;text-transform:uppercase;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-color:var(--orange)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.stat{padding:16px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700}
.stat .v{font-size:26px;font-weight:900;margin-top:4px}
.pgrid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}
.card h3{font-size:15px;text-transform:uppercase;font-weight:800;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);text-transform:uppercase;text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{white-space:nowrap;padding:12px;border-bottom:1px solid var(--line);font-size:14px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
.w{color:var(--green);font-weight:800}.l{color:var(--red);font-weight:800}
.res{display:inline-block;width:26px;height:26px;border-radius:4px;text-align:center;line-height:26px;font-weight:900;font-size:12px}
.res.w{background:rgba(63,207,106,.15)}.res.l{background:rgba(255,77,77,.15)}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.mrow:last-child{border:0}
.pbar{height:6px;background:var(--line);border-radius:3px;flex:1;margin:0 12px;overflow:hidden}.pbar div{height:100%;background:var(--orange)}
.scroll{overflow-x:auto}
/* Match */
.mhead{border-radius:8px;border:1px solid var(--line);padding:32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;background:linear-gradient(90deg,rgba(63,207,106,.12),#1c1c1f 40%,#1c1c1f 60%,rgba(255,77,77,.12))}
.team{display:flex;align-items:center;gap:14px}
.team.r{justify-content:flex-end;text-align:right}
.team .logo-t{width:60px;height:60px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:22px}
.score{text-align:center}
.score .s{font-size:56px;font-weight:900;font-style:italic;line-height:1}
.score .s span{color:var(--muted);margin:0 10px}
.score .st{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:4px;background:var(--card2);text-transform:uppercase}
.board th:first-child,.board td:first-child{min-width:200px}
.pl{display:flex;align-items:center;gap:10px}
.thead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.thead b{font-size:16px;text-transform:uppercase}
/* Leaderboard */
.lb-top{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;align-items:end}
.podium{padding:24px;text-align:center;position:relative}
.podium .ava{width:72px;height:72px;font-size:26px;margin:0 auto 12px}
.podium .rk{position:absolute;top:12px;left:16px;font-size:28px;font-weight:900;font-style:italic;color:var(--muted)}
.podium.p1{border-color:var(--yellow);padding:36px 24px;background:linear-gradient(180deg,rgba(255,200,0,.1),var(--card))}
.podium.p1 .rk{color:var(--yellow)}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filters select{height:40px;background:var(--card);color:#fff;border:1px solid var(--line);border-radius:4px;padding:0 12px}
.rank{font-weight:900;font-style:italic;color:var(--muted)}
.chart{width:100%;height:200px}
.empty{padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}.empty b{font-size:18px}.empty p{max-width:420px}.empty .btn{margin-top:12px}.empty-ic{width:56px;height:56px;border-radius:50%;background:rgba(255,85,0,.12);color:var(--orange);display:grid;place-items:center;margin-bottom:4px}
.steps{list-style:none;counter-reset:s;margin:20px 0;display:grid;gap:12px}.steps li{counter-increment:s;position:relative;padding:12px 12px 12px 52px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:2px}.steps li::before{content:counter(s);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-weight:900}.vcode{align-self:flex-start;margin-top:6px;background:#0f0f11;padding:6px 12px;border-radius:4px;font-size:20px;font-weight:900;letter-spacing:.2em}
.ava-edit{position:relative;cursor:pointer;border-radius:50%;display:block;flex:none}.ava-edit .ava-cam{position:absolute;right:0;bottom:0;width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;border:3px solid #1c1c1f}.ava-edit:hover .ava{filter:brightness(.75)}.ava-edit:focus-within{outline:2px solid var(--orange);outline-offset:4px}.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.toast{position:fixed;bottom:24px;right:24px;background:var(--card2);border:1px solid var(--orange);padding:14px 18px;border-radius:6px;z-index:200;box-shadow:0 12px 32px -12px rgba(0,0,0,.7);opacity:0;visibility:hidden;transform:translateY(14px) scale(.98);pointer-events:none;transition:opacity .25s,transform .35s var(--ease),visibility 0s .35s}
.toast.show{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .35s var(--ease)}
/* Match room */
.mtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.room{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:16px;margin-top:16px;align-items:start}

.pill{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--card2);color:var(--muted);letter-spacing:.03em;vertical-align:middle}

.fr-wrap{display:grid;gap:16px;max-width:780px}

.btn-sm{height:34px;padding:0 12px;font-size:12px}
.row2{display:flex;gap:8px;flex-wrap:wrap}

.resbig{font-size:34px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.1}
.live-banner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;border-color:var(--orange);background:linear-gradient(90deg,rgba(255,85,0,.14),var(--card))}
.admin-box{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:20px;padding:16px;border:1px dashed var(--orange);border-radius:6px;background:rgba(255,85,0,.05)}

.howto{counter-reset:h;list-style:none;display:grid;gap:10px;font-size:14px}.howto li{counter-increment:h;display:flex;gap:10px;align-items:flex-start}.howto li::before{content:counter(h);flex:none;width:22px;height:22px;border-radius:50%;background:var(--card2);color:var(--orange);font-weight:900;font-size:12px;display:grid;place-items:center;margin-top:1px}
.adm-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lobby>*,.room>*,.pgrid>*,.grid>*,.mhead>*{min-width:0}

<script>
/* ===== Справочники ===== */
const MAPS=[["Sandstone","#c89a5b,#6b4a22"],["Rust","#b5532b,#3e1c0d"],["Province","#7fa36a,#2f4524"],["Zone 7","#6a7f9e,#232c3d"],["Hanami","#d77fa1,#4a2233"],["Breeze","#5fb5c9,#1f4550"],["Dune","#d9b26a,#5c4318"],["Sakura","#e59aa8,#57303a"]];
const TH=[0,100,801,951,1101,1251,1401,1551,1701,1851,2001];
function lvlOf(e){let l=1;for(let i=1;i<=10;i++)if(e>=TH[i])l=i;return l}
function lvlColor(l){return l===1?"var(--l1)":l<=3?"var(--l2)":l<=7?"var(--l4)":l<=9?"var(--l8)":"var(--l10)"}
function lvlPct(e){const l=lvlOf(e);if(l===10)return 100;return Math.round((e-TH[l])/(TH[l+1]-TH[l])*100)}
function badge(e,cls=""){const l=lvlOf(e);return `<span class="lvl ${cls}" style="--c:${lvlColor(l)};--p:${Math.max(8,lvlPct(e))}%" title="Уровень ${l} · ${e} ELO">${l}</span>`}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ava(n,url){if(url)return `<span class="ava" style="background:#26262b center/cover no-repeat url('${esc(url)}')" role="img" aria-label="${esc(n)}"></span>`;const h=[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360;return `<span class="ava" style="background:linear-gradient(135deg,hsl(${h} 70% 45%),hsl(${(h+40)%360} 60% 20%))">${esc(n[0].toUpperCase())}</span>`}
function mapBg(m){const x=MAPS.find(a=>a[0]===m);return `linear-gradient(135deg,${x?x[1]:"#555,#222"})`}
const fmt=n=>Number(n).toLocaleString("ru-RU");
const kd=u=>u.deaths?(u.kills/u.deaths).toFixed(2):(u.kills?u.kills.toFixed(2):"—");
const wr=u=>u.matches?Math.round(u.wins/u.matches*100)+"%":"—";
const hsp=u=>u.kills?Math.round(u.hsKills/u.kills*100)+"%":"—";

/* ===== Состояние и API ===== */
const S={token:localStorage.getItem("sh_token"),user:null,searching:false,qSince:0,timer:null,mode:"5v5",match:null,mv:{},skew:0,live:{online:null,searching:null,live:null},party:null,psent:[],pinv:[]};
const VID=localStorage.getItem("sh_vid")||(()=>{const v=crypto.randomUUID();localStorage.setItem("sh_vid",v);return v})();
async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{"Content-Type":"application/json",...(S.token?{Authorization:"Bearer "+S.token}:{})}});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||"Ошибка"),j);return j;
}
let es;
function connectLive(){
  if(es)es.close();
  if(location.protocol==="file:"){S.live={online:null};paintLive();return}
  es=new EventSource(`/api/events?vid=${VID}&token=${S.token||""}`);
  es.onmessage=e=>{try{onLive(JSON.parse(e.data))}catch(err){console.error(err)}};
  es.onerror=()=>{S.live={online:null,searching:null,live:null};paintLive()};
}
function paintLive(){
  const v=k=>S.live[k]==null?"—":fmt(S.live[k]);
  document.querySelectorAll("[data-live]").forEach(el=>{const t=v(el.dataset.live),was=el.textContent;if(was===t)return;el.textContent=t;
    if(was!=="—"&&!RM()){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}});
  document.querySelectorAll("[data-mq]").forEach(el=>{const n=(S.live.modes||{})[el.dataset.mq]||0;if(el.textContent!==String(n))el.textContent=n;el.classList.toggle("z",!n)});
  const h=document.getElementById("qhint");if(h){const t=qHint();if(h.textContent!==t)h.textContent=t}
}
// подсказка: игроки ищут в другом режиме — в один матч попадают только при одинаковом режиме
function qHint(){
  const md=S.live.modes;if(!md||!S.user||pMember()||(S.match&&["accept","veto","live"].includes(S.match.state)))return "";
  if((md[S.mode]||0)-(S.searching?1:0)>0)return "";
  const oth=Object.keys(MODE_NAME).filter(k=>k!==S.mode&&md[k]>0);if(!oth.length)return "";
  const names=oth.map(k=>"«"+MODE_NAME[k]+"»").join(" и ");
  return S.searching?`Другие игроки сейчас ищут в режиме ${names}. Чтобы попасть в один матч, отмените поиск и выберите тот же режим.`:`Сейчас ищут матч в режиме ${names} — выберите его, чтобы сыграть вместе.`;
}
const L=k=>`<b data-live="${k}">${S.live[k]==null?"—":fmt(S.live[k])}</b>`;

/* ===== Каркас ===== */
const ICONS={"users":"<circle cx=\"9\" cy=\"8\" r=\"3.6\"/><path d=\"M2.5 20c0-3.7 2.9-5.8 6.5-5.8s6.5 2.1 6.5 5.8z\"/><circle cx=\"16.6\" cy=\"8.8\" r=\"2.9\"/><path d=\"M16.3 13.4c3.2.1 5.2 2.1 5.2 5.4h-4.6c-.1-2.1-.9-3.9-2.3-5.2.5-.1 1.1-.2 1.7-.2z\"/>","home":"<path d=\"M3 11l9-8 9 8v10h-6v-6H9v6H3z\"/>","play":"<path d=\"M7 4l13 8-13 8z\"/>","user":"<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6z\"/>","swords":"<path d=\"M3 3h4l10 10-2 2-2-2-3 3-2-2 3-3zM21 3h-4l-5 5 2 2 1-1 2 2-6 6 2 2 3-3 2 2 2-2-2-2 3-3z\"/>","crown":"<path d=\"M3 7l5 4 4-7 4 7 5-4-2 12H5z\"/>","shield":"<path d=\"M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z\"/>","spark":"<path d=\"M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z\"/>","help":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.5 9a2.5 2.5 0 115 0c0 2-2.5 2-2.5 4M12 17h0\" stroke=\"#0f0f11\" stroke-width=\"2\" fill=\"none\"/>"};
function ic(n){return `<svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">${ICONS[n]}</svg>`}
function renderChrome(route){
  const u=S.user,tr=document.getElementById("topRight"),side=document.getElementById("side");
  const tk=u?[u.nick,u.elo,u.admin?1:0,(u.avatar||"").length,(u.avatar||"").slice(-24)].join("|"):"-";
  if(tr.dataset.k!==tk){tr.dataset.k=tk;
  tr.innerHTML=u?`
    <a class="btn btn-o" href="#/lobby">Играть</a>
    <a class="userchip" href="#/profile" aria-label="Мой профиль">${ava(u.nick,u.avatar)}<span class="nm">${esc(u.nick)}</span>${badge(u.elo,"sm")}</a>
    <button class="btn btn-g" id="logout">Выйти</button>`:`
    <a class="btn btn-g" href="#/login">Войти</a><a class="btn btn-o" href="#/register">Регистрация</a>`;
  const lo=document.getElementById("logout");if(lo)lo.onclick=async()=>{S.searching=false;stopQTimer();try{await api("/api/logout",{method:"POST"})}catch{}S.token=null;S.user=null;S.match=null;S.lobbyMs=null;S.fr=null;S.party=null;S.psent=[];S.pinv=[];S.pSeen=false;frBadge();paintPInv();closeInvite();closeAccept();localStorage.removeItem("sh_token");connectLive();if(curHash()==="/")route();else location.hash="#/"}}
  const items=[["#/","home","Главная"],["#/lobby","play","Играть"],["#/profile","user","Профиль"],["#/friends","users","Друзья"],["#/matches","swords","Матчи"],["#/leaderboard","crown","Рейтинг"]];
  if(u&&u.admin)items.push(["#/admin","shield","Админ"]);
  const sk=items.map(x=>x[0]).join();
  if(side.dataset.k!==sk){side.dataset.k=sk;side.innerHTML=items.map(([h,i,t])=>`<a href="${h}" data-r="${h.slice(1)}">${ic(i)}${t}${h==="#/friends"?`<span class="nb z" data-frn aria-label="Новые заявки">0</span>`:""}</a>`).join("")+
   `<div class="sep"></div><a href="#" class="hide-m">${ic("shield")}Античит</a><a href="#" class="hide-m">${ic("help")}Поддержка</a><a href="#" class="hide-m mot" data-motion>${ic("spark")}Анимации: <b>вкл</b></a>
    <div class="online"><span class="dot"></span>${L("online")} на сайте<div class="ver">Версия ${APP_V}</div></div>`}
  paintMotion();frBadge();
  side.querySelectorAll("a[data-r]").forEach(a=>{const on=a.dataset.r===route;a.classList.toggle("on",on);if(on)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
}
const app=document.getElementById("app");
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2600)}
function needAuth(){if(!S.user){location.hash="#/login";toast("Войдите, чтобы продолжить");return true}return false}
function empty(title,text,btn){return `<div class="empty"><div class="empty-ic">${ic("crown")}</div><b>${title}</b><p class="muted">${text}</p>${btn||""}</div>`}
/* ===== Анимации ===== */
const APP_V="1.5";
// анимации включены всегда; выключить можно кнопкой «Анимации» (меню слева / низ главной)
const RM=()=>document.documentElement.classList.contains("no-motion");
function paintMotion(){document.querySelectorAll("[data-motion] b").forEach(b=>b.textContent=RM()?"выкл":"вкл")}
document.addEventListener("click",e=>{const t=e.target.closest("[data-motion]");if(!t)return;e.preventDefault();const off=!RM();
  document.documentElement.classList.toggle("no-motion",off);try{localStorage.setItem("sh_motion",off?"off":"on")}catch{}paintMotion();toast(off?"Анимации выключены":"Анимации включены")});
const EASE="cubic-bezier(.2,.8,.2,1)";
// плавное появление снизу; конечное состояние — собственные стили элемента
function rise(els,step=60,dur=450,y=14){if(RM())return;[...els].forEach((el,i)=>{try{el.animate([{offset:0,opacity:0,transform:`translateY(${y}px)`}],{duration:dur,delay:i*step,easing:EASE,fill:"backwards"})}catch{}})}
// числа «набегают» от нуля: data-count, data-dec (знаки после точки), data-suf (%), data-sign (+/−)
function countUp(root){if(!root||RM())return;root.querySelectorAll("[data-count]").forEach(el=>{
  const to=+el.dataset.count,dec=+(el.dataset.dec||0),suf=el.dataset.suf||"",sg=el.dataset.sign,fin=el.textContent;if(!isFinite(to)||!to)return;
  const f=v=>{const r=dec?+v.toFixed(dec):(Math.round(v)||0);return (sg&&r>=0?"+":"")+(dec?r.toFixed(dec):r)+suf};
  const t0=performance.now(),D=Math.min(1200,600+Math.abs(to)*.3);el.textContent=f(0);
  const st=t=>{if(!el.isConnected)return;const k=Math.max(0,Math.min(1,(t-t0)/D));if(k>=1){el.textContent=fin;return}el.textContent=f(to*(1-Math.pow(1-k,3)));requestAnimationFrame(st)};
  requestAnimationFrame(st)})}
// появление блоков главной при прокрутке
let rvObs=null;
function reveal(){const els=app.querySelectorAll(".rv:not(.in)");if(!els.length)return;
  if(RM()||!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return}
  if(rvObs)rvObs.disconnect();
  rvObs=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;rvObs.unobserve(t);t.classList.add("in");setTimeout(()=>t.classList.remove("rv","in"),1500)}),{rootMargin:"0px 0px -40px 0px"});
  els.forEach(e=>rvObs.observe(e))}
// вход на страницу: блоки появляются по очереди, кольцо уровня и ELO «заполняются»
function animateIn(){if(RM())return;
  const sel=".mtop,h1.h,.wrap>p,.hero .wrap>*,.phead,.mhead,.card,.mapbig",H=innerHeight;
  const els=[...app.querySelectorAll(sel)].filter(el=>!el.closest(".rv")&&!el.parentElement.closest(sel)).filter(el=>{const r=el.getBoundingClientRect();return r.bottom>0&&r.top<H});
  rise(els.slice(0,14),70,560,22);
  app.querySelectorAll("h1.h").forEach(e=>e.classList.add("grow"));
  app.querySelectorAll(".lvl.xl").forEach(el=>el.classList.add("ring"));
  app.querySelectorAll(".elo-prog .bar div").forEach(el=>{try{el.animate([{offset:0,width:"0%"}],{duration:1000,delay:250,easing:EASE,fill:"backwards"})}catch{}});
  countUp(app)}
function entered(){if(!S.enter)return;S.enter=false;animateIn()}
function fadeRows(root){if(!root||RM())return;rise(root.querySelectorAll(".podium"),70,450);rise([...root.querySelectorAll("tbody tr,.mrow,.empty")].slice(0,20),30,350,8)}
function skel(n=4,pad=true){const w=[52,38,64,46,58,42,60,36];return `<div${pad?' class="pad"':""} aria-busy="true" aria-label="Загрузка">${Array.from({length:n},(_,i)=>`<div class="sk-row"><span class="sk sk-c"></span><span class="sk" style="width:${w[i%8]}%"></span><span class="sk" style="width:14%;margin-left:auto"></span></div>`).join("")}</div>`}
const profSkel=()=>`<div class="wrap"><div class="sk" style="height:152px;border-radius:8px"></div><div class="stats" style="margin-top:24px">${'<div class="sk" style="height:86px;border-radius:8px"></div>'.repeat(6)}</div><div class="card" style="margin-top:16px">${skel(4)}</div></div>`;
function numSpan(v){const s=String(v),m=s.match(/^(\d+(?:\.(\d+))?)(%?)$/);return m?`<span data-count="${m[1]}" data-dec="${m[2]?m[2].length:0}" data-suf="${m[3]}">${s}</span>`:esc(s)}
// конфетти при победе
function confetti(){if(RM())return;const box=document.createElement("div");box.className="cf";box.setAttribute("aria-hidden","true");document.body.appendChild(box);
  const cols=["#ff5500","#ff7a33","#ffc800","#3fcf6a","#ffffff"],H=innerHeight;
  for(let i=0;i<90;i++){const p=document.createElement("i"),w=6+Math.random()*6;p.style.cssText=`left:${Math.random()*100}%;width:${w}px;height:${w*.45}px;background:${cols[i%5]}`;box.appendChild(p);
    try{p.animate([{transform:"translate(0,0) rotate(0deg)",opacity:1},{transform:`translate(${(Math.random()-.5)*260}px,${H+40}px) rotate(${(Math.random()-.5)*1440}deg)`,opacity:.85}],{duration:1800+Math.random()*1600,delay:Math.random()*500,easing:"cubic-bezier(.25,.6,.45,1)",fill:"both"})}catch{}}
  setTimeout(()=>box.remove(),4400)}

/* ===== Главная ===== */

  const words=["ПРИЦЕЛ","СКИЛЛ","РАНГ","РЕАКЦИЮ","ТАКТИКУ","КОМАНДУ","ИГРУ"];
  app.innerHTML=`
  <section class="hero"><div class="stripes"></div>
   <svg class="emblem" viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a33"/><stop offset="1" stop-color="#ff3d00"/></linearGradient></defs>
    <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,85,0,.25)" stroke-width="2"/><circle class="spin-slow" cx="100" cy="100" r="70" fill="none" stroke="rgba(255,85,0,.15)" stroke-width="10" stroke-dasharray="6 10"/>
    <path d="M40 40h120l-30 40h30L70 170l20-55H50z" fill="url(#g)"/></svg>
   <div class="wrap">
    <h1 aria-label="Прокачай свою игру">Прокачай<span class="rot" aria-hidden="true"><span>${[...words,words[0]].map(w=>`<i>${w}</i>`).join("")}</span></span></h1>
    <p>Соревновательный StandLeo на максимуме. Матчмейкинг 5 на 5, ELO-рейтинг, турниры и команды — без потолка для роста.</p>
    <a class="btn btn-o btn-lg" href="${S.user?"#/lobby":"#/register"}">Играть сейчас</a>
    <div class="online-big"><span class="dot"></span>${L("online")} на сайте прямо сейчас</div>
   </div></section>
  <section class="sec"><div class="wrap">

    <p class="muted rv" style="max-width:640px;--i:1">StandHub — дом для любых амбиций: разные соревновательные форматы для игроков любого уровня и размера пати.</p>
    <div class="feat">

      <div class="card rv" style="--i:4"><span class="tag">Скоро</span><h3>Турниры</h3><p class="muted">Официальные квалификации и турниры от организаторов сообщества.</p><span class="btn btn-g">Скоро</span></div>
    </div></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap">

/* ===== Вход / регистрация ===== */
function pageAuth(type){
  const reg=type==="register";
  app.innerHTML=`<div class="auth"><form class="card" id="f" novalidate>
   <h1>${reg?"Создать аккаунт":"Вход в StandHub"}</h1>
   <p class="muted">${reg?"Присоединяйся к соревновательному StandLeo":"Рады видеть снова, боец"}</p>
   ${reg?`<div class="field"><label for="nick">Никнейм</label><input id="nick" autocomplete="nickname" placeholder="Например, Fl4mus"><div class="err" id="e-nick"></div></div>

  </form></div>`;
  entered();

    e.preventDefault();const v=id=>(document.getElementById(id)||{}).value?.trim()||"";

      if(r.pending){sessionStorage.setItem("sh_pending",JSON.stringify(r));location.hash="#/verify";return}
      S.token=r.token;S.user=r.user;localStorage.setItem("sh_token",r.token);connectLive();
      toast("Вы вошли");location.hash="#/lobby";

/* ===== Подтверждение через Telegram ===== */
let verifyTimer=null;
function pageVerify(){
  const p=JSON.parse(sessionStorage.getItem("sh_pending")||"null");

  const link=p.bot?`https://t.me/${p.bot}?start=${p.code}`:null;
  app.innerHTML=`<div class="auth"><div class="card" style="max-width:520px">
   <div class="tag">Шаг 2 из 2</div>
   <h1 style="margin-top:6px">Подтвердите аккаунт</h1>

   <ol class="steps">
     <li><b>Откройте нашего Telegram-бота</b><span class="muted">${p.bot?"@"+esc(p.bot):"Бот пока не подключён"}</span></li>
     <li><b>Отправьте боту код</b><span class="muted">Если нажали кнопку ниже — код отправится сам</span><code class="vcode">${esc(p.code)}</code></li>
     <li><b>Пришлите скриншот экрана «Мой профиль» из StandLeo</b><span class="muted">Весь экран, без обрезки — так, чтобы были видны надпись «Мой профиль» и ваш ID. Другие скриншоты бот не примет</span></li>
   </ol>
   ${link?`<a class="btn btn-o btn-lg" style="width:100%" href="${link}" target="_blank" rel="noopener">Открыть бота в Telegram</a>`:`<div class="card pad" style="border-color:var(--orange)">Telegram-бот ещё не настроен администратором сайта.</div>`}
   <div id="vstatus" class="muted" style="text-align:center;margin-top:16px"><span class="dot" style="background:var(--orange)"></span>Ждём подтверждения от бота…</div>
   <p class="muted" style="text-align:center;margin-top:16px;font-size:13px">Код действует 24 часа. <a href="#/register" style="color:var(--orange)">Зарегистрироваться заново</a></p>
  </div></div>`;
  entered();

      else if(r.linked){document.getElementById("vstatus").innerHTML='<span class="dot" style="background:var(--orange)"></span>Бот на связи — пришлите ему скриншот экрана «Мой профиль»'}
    }catch{}
  },3000);

/* ===== Друзья ===== */
function frRel(nick){const f=S.fr;if(!f)return {r:"none"};const n=String(nick).toLowerCase(),eq=u=>u.nick.toLowerCase()===n;
  if(f.friends.some(eq))return {r:"friend"};const o=f.outgoing.find(x=>eq(x.user));if(o)return {r:"out",id:o.id};
  const i=f.incoming.find(x=>eq(x.user));if(i)return {r:"in",id:i.id};return {r:"none"}}
function frInner(nick,big){const x=frRel(nick);
  return x.r==="friend"?`<span class="frb ok">✓ В друзьях</span>`:x.r==="out"?`<span class="frb wait">Заявка отправлена</span>`
   :x.r==="in"?`<button class="frb hot" data-fact="accept" data-id="${x.id}">${big?"Принять заявку в друзья":"Принять в друзья"}</button>`
   :`<button class="frb add" data-fact="add" data-nick="${esc(nick)}">+ ${big?"Добавить в друзья":"В друзья"}</button>`}
function frBtn(nick,big){if(!S.user||S.user.nick===nick)return "";return `<span class="frw" data-fr="${esc(nick)}"${big?' data-big="1"':""}>${frInner(nick,big)}</span>`}
function frBadge(){const n=S.fr?S.fr.incoming.length:0;document.querySelectorAll("[data-frn]").forEach(el=>{el.textContent=n;el.classList.toggle("z",!n)})}
function paintFr(){frBadge();paintInvite();
  document.querySelectorAll("[data-fr]").forEach(el=>{const h=frInner(el.dataset.fr,!!el.dataset.big);if(el.innerHTML!==h)el.innerHTML=h});
  const fb=document.getElementById("frBody");if(fb){const k=frKey();if(fb.dataset.k!==k){fb.dataset.k=k;fb.innerHTML=frBody()}}}
const frKey=()=>JSON.stringify([S.fr,S.party&&S.party.members.map(x=>x.nick),(S.psent||[]).map(r=>r.user.nick)]);
function onFriends(d){const prev=S.fr;S.fr={friends:d.friends||[],incoming:d.incoming||[],outgoing:d.outgoing||[]};
  if(prev){const seen=new Set(prev.incoming.map(r=>r.id)),nw=S.fr.incoming.filter(r=>!seen.has(r.id));
    if(nw.length)toast(nw.length>1?`Новые заявки в друзья: ${nw.length}`:`${nw[0].user.nick} хочет добавить вас в друзья`);
    else{const was=new Set(prev.friends.map(f=>f.nick)),acc=S.fr.friends.find(f=>!was.has(f.nick)&&prev.outgoing.some(r=>r.user.nick===f.nick));if(acc)toast(`${acc.nick} принял(а) вашу заявку — теперь вы друзья`)}}
  paintFr()}
async function loadFr(){if(!S.user)return;try{onFriends(await api("/api/friends"))}catch{}}
const frMsg=r=>r.accepted?`${r.nick} теперь ваш друг 🤝`:`Заявка в друзья отправлена: ${r.nick}`;
// кнопки друзей (на странице друзей, в профиле, в комнате матча) — один общий обработчик
document.addEventListener("click",async e=>{const b=e.target.closest("[data-fact]");if(!b)return;e.preventDefault();e.stopPropagation();
  if(!S.user)return needAuth();if(b.disabled)return;
  const a=b.dataset.fact,post=(u,o)=>api("/api/friends/"+u,{method:"POST",body:JSON.stringify(o)});
  if(a==="remove"&&!b.classList.contains("sure")){const t=b.textContent;b.classList.add("sure");b.textContent="Точно удалить?";setTimeout(()=>{if(b.isConnected){b.classList.remove("sure");b.textContent=t}},3000);return}
  b.disabled=true;
  try{let r;
    if(a==="add"){r=await post("request",{nick:b.dataset.nick});toast(frMsg(r))}
    else if(a==="accept"){r=await post("accept",{id:b.dataset.id});toast(`${r.nick||"Игрок"} теперь ваш друг 🤝`)}
    else if(a==="decline"){await post("decline",{id:b.dataset.id});toast("Заявка отклонена")}
    else if(a==="cancel"){await post("cancel",{id:b.dataset.id});toast("Заявка отменена")}
    else if(a==="remove"){r=await post("remove",{nick:b.dataset.nick});toast(`${r.nick} больше не в друзьях`)}
    await loadFr()}
  catch(err){toast(err.message);if(b.isConnected)b.disabled=false}
},true);
function frRow(u,act,st){return `<div class="frow">${ava(u.nick,u.avatar)}<div class="fn"><a href="#/player/${encodeURIComponent(u.nick)}"><b>${esc(u.nick)}</b></a>${st?`<div class="st${u.inMatch?" m":u.online?" on":""}">${u.inMatch?"● в матче":u.online?"● на сайте":"не в сети"}</div>`:""}</div>${badge(u.elo,"sm")}<div class="fa">${act}</div></div>`}
function frBody(){if(!S.fr)return `<div class="card pad">${skel(3,false)}</div>`;const {friends,incoming,outgoing}=S.fr;
  return (incoming.length?`<div class="card pad fr-in"><h3>Заявки в друзья<span class="cnt">${incoming.length}</span></h3>${incoming.map(r=>frRow(r.user,`<button class="btn btn-o btn-sm" data-fact="accept" data-id="${r.id}">Принять</button><button class="btn btn-g btn-sm" data-fact="decline" data-id="${r.id}">Отклонить</button>`)).join("")}</div>`:"")
   +`<div class="card pad"><h3>Мои друзья<span class="cnt">${friends.length}</span></h3>${friends.length?friends.map(u=>frRow(u,`${pInvBtn(u.nick,"Позвать в пати")}<button class="btn btn-g btn-sm" data-fact="remove" data-nick="${esc(u.nick)}">Удалить</button>`,1)).join(""):`<p class="muted" style="margin:0">Пока никого нет. Добавьте игрока по ID в игре или нику — или прямо после матча, в комнате матча.</p>`}</div>`
   +(outgoing.length?`<div class="card pad"><h3>Отправленные заявки<span class="cnt">${outgoing.length}</span></h3>${outgoing.map(r=>frRow(r.user,`<button class="btn btn-g btn-sm" data-fact="cancel" data-id="${r.id}">Отменить</button>`)).join("")}</div>`:"")}
function pageFriends(){
  if(needAuth())return;
  app.innerHTML=`<div class="wrap"><h1 class="h">Друзья</h1><div class="fr-wrap">
   <div class="card pad"><h3>Добавить в друзья</h3>
    <form class="fadd" id="faddF" autocomplete="off"><input id="fq" maxlength="24" placeholder="ID в игре или ник на StandHub" aria-label="ID в игре или ник на StandHub" enterkeyhint="send"><button class="btn btn-o" type="submit">Отправить заявку</button></form>
    <div class="fsug" id="fsug"></div>
    <p class="muted" style="font-size:13px;margin:10px 0 0">Игрок должен быть зарегистрирован на StandHub. После матча добавить можно прямо в комнате матча — кнопкой «+ В друзья» рядом с ником.</p></div>
   <div id="frBody" style="display:grid;gap:16px"></div></div></div>`;
  const fb=document.getElementById("frBody");fb.innerHTML=frBody();fb.dataset.k=frKey();
  const f=document.getElementById("faddF"),q=document.getElementById("fq"),sug=document.getElementById("fsug");
  f.onsubmit=async e=>{e.preventDefault();const v=q.value.trim();if(!v)return q.focus();const bt=f.querySelector("button");bt.disabled=true;
    try{const r=await api("/api/friends/request",{method:"POST",body:JSON.stringify({q:v})});toast(frMsg(r));q.value="";sug.innerHTML="";await loadFr()}catch(err){toast(err.message)}
    bt.disabled=false};
  let tm;q.oninput=()=>{clearTimeout(tm);const v=q.value.trim();if(v.length<2||/^\d+$/.test(v)){sug.innerHTML="";return}
    tm=setTimeout(async()=>{const r=await api("/api/search?q="+encodeURIComponent(v)).catch(()=>[]);if(q.value.trim()!==v)return;
      sug.innerHTML=r.filter(u=>!S.user||u.nick!==S.user.nick).slice(0,5).map(u=>frRow(u,frBtn(u.nick))).join("")},250)};
  loadFr();entered();
  clearInterval(S.frT);S.frT=setInterval(()=>{if(curHash()!=="/friends")return clearInterval(S.frT);loadFr()},20000);
}

/* ===== Лобби ===== */
const MODE_NAME={"5v5":"5 на 5","2v2":"2 на 2","1v1":"1 на 1"};
function pageLobby(){
  if(needAuth())return;const u=S.user;const m=S.match&&["veto","live"].includes(S.match.state)?S.match:null;
  const pt=S.party,mem=pMember();
  app.innerHTML=`<div class="wrap"><h1 class="h">Матчмейкинг</h1>

  <div class="lobby">

       <div class="modes" role="radiogroup" aria-label="Режим">${["5v5","2v2","1v1"].map(x=>`<button class="chip ${S.mode===x?"on":""}${mem?" lock":""}${pt&&PMAX[x]<pt.members.length?" na":""}" data-mode="${x}" role="radio" aria-checked="${S.mode===x}"${mem?' aria-disabled="true"':""}>${MODE_NAME[x]}<span class="mq${(S.live.modes||{})[x]?"":" z"}" data-mq="${x}" title="Сейчас в поиске">${(S.live.modes||{})[x]||0}</span></button>`).join("")}</div>

       <button class="btn btn-o btn-find ${S.searching?"searching":""}" id="find" ${m||(mem&&!S.searching)?"disabled":""}>${S.searching?"Отменить поиск":mem?"Ждём лидера":"Найти матч"}</button>
     </div>
     ${u.admin?`<div class="admin-box"><div><b>Тестовый матч с ботами</b><div class="muted" style="font-size:13px;max-width:440px">Видно только администратору. Боты сами примут матч и будут убирать карты. Рейтинг не меняется.</div></div><button class="btn btn-g" id="testM" ${m||S.searching?"disabled":""}>Тест · ${MODE_NAME[S.mode]}</button></div>`:""}
   </div>
   <div class="grid" style="align-content:start">
     <div class="card pad"><h3>Твой уровень</h3><div style="display:flex;align-items:center;gap:14px">${badge(u.elo,"xl")}<div><div style="font-size:28px;font-weight:900"><span data-count="${u.elo}">${u.elo}</span> <span class="muted" style="font-size:14px">ELO</span></div><div class="muted" style="font-size:13px">${lvlOf(u.elo)<10?`До уровня ${lvlOf(u.elo)+1}: ${TH[lvlOf(u.elo)+1]-u.elo} ELO`:"Максимальный уровень"}</div></div></div></div>
     <div class="card pad"><h3>Как проходит матч</h3><ol class="howto">
       <li><span>Нажмите «Найти матч» и примите его за <b>15 секунд</b></span></li>

       <li><span>После игры капитаны загружают скриншот счёта — ELO пересчитается сам</span></li></ol></div>
     <div class="card pad"><h3>Сейчас на сайте</h3>
       <div class="qrow"><span class="muted">Онлайн</span>${L("online")}</div>

       <div class="qrow"><span class="muted">Матчей идёт</span>${L("live")}</div></div>
     <div class="card pad"><h3>Последние матчи</h3><div id="lobbyM" class="muted">${S.lobbyMs?lobbyMsHtml(S.lobbyMs):skel(3,false)}</div></div>

  document.getElementById("find").onclick=()=>S.searching?stopSearch():startSearch();

  if(S.searching)qtick();

}
const lobbyMsHtml=ms=>ms.length?ms.slice(0,4).map(mini).join(""):"Вы ещё не сыграли ни одного матча";
// лобби перерисовывается только когда что-то важное изменилось — без мерцания
const lobbyKey=()=>JSON.stringify([S.mode,S.searching,S.match&&[S.match.id,S.match.state,S.match.map],S.user&&[S.user.nick,S.user.elo,S.user.admin],S.party&&[S.party.leader,S.party.members.length]]);
/* ===== Пати ===== */
const PMAX={"5v5":5,"2v2":2,"1v1":1};
const igr=n=>n+" "+(n===1?"игрок":n<5?"игрока":"игроков");
const pMember=()=>!!(S.party&&S.user&&S.party.leader!==S.user.nick); // в пати, но не лидер
const CROWN=`<span class="crown" title="Лидер пати">${ic("crown")}</span>`;
function renderParty(){
  const el=document.getElementById("party");if(!el||!S.user)return;
  const u=S.user,pt=S.party,lead=!!pt&&pt.leader===u.nick,sent=S.psent||[];
  const mem=pt?pt.members:[],others=mem.filter(x=>x.nick!==u.nick),size=Math.max(1,mem.length);
  const cap=Math.min(5,Math.max(PMAX[S.mode],size+sent.length));
  const out=[`<div class="slot me">${lead?CROWN:""}${ava(u.nick,u.avatar)}<b>${esc(u.nick)}</b>${badge(u.elo,"sm")}<span class="sst">Вы</span></div>`];
  for(const x of others)out.push(`<div class="slot mem${x.online||x.inMatch?"":" off"}">${x.leader?CROWN:""}<a class="sl-a" href="#/player/${encodeURIComponent(x.nick)}">${ava(x.nick,x.avatar)}<b>${esc(x.nick)}</b></a>${badge(x.elo,"sm")}<span class="sst${x.inMatch?" m":x.online?" on":""}">${x.inMatch?"в матче":x.online?"на сайте":"не на сайте"}</span>${lead?`<button class="sx" data-pact="kick" data-nick="${esc(x.nick)}" title="Исключить из пати" aria-label="Исключить ${esc(x.nick)} из пати">×</button>`:""}</div>`);
  for(const r of sent)out.push(`<div class="slot inv">${ava(r.user.nick,r.user.avatar)}<b>${esc(r.user.nick)}</b><span class="sst">приглашён…</span>${r.by===u.nick||lead?`<button class="sx" data-pact="cancel" data-id="${r.id}" title="Отменить приглашение" aria-label="Отменить приглашение для ${esc(r.user.nick)}">×</button>`:""}</div>`);
  while(out.length<cap)out.push(`<button class="slot" data-pact="open" aria-label="Пригласить друга в пати"><span class="plus">+</span>Пригласить</button>`);
  while(out.length<5)out.push(`<div class="slot" style="opacity:.25"></div>`);
  const h=out.join("");if(el.innerHTML!==h)el.innerHTML=h;

async function uploadAvatar(file){
  if(!file)return;if(!/^image\//.test(file.type))return toast("Выберите картинку");
  try{
    const img=await createImageBitmap(file);const S2=256,c=document.createElement("canvas");c.width=c.height=S2;
    const k=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,S2,S2);
    const u=await api("/api/avatar",{method:"POST",body:JSON.stringify({image:c.toDataURL("image/jpeg",.88)})});
    S.user=u;toast("Аватар обновлён");renderChrome("/profile");pageProfile();
  }catch(e){toast(e.message||"Не удалось загрузить аватар")}
}

async function pageMatch(id){

  if(cached)renderMatch(cached);else app.innerHTML=`<div class="wrap"><div class="card">${skel(5)}</div></div>`;
  const load=async()=>{const m=await api("/api/match/"+id);S.skew=m.now-Date.now();const prev=S.mv[id];S.mv[id]=m;if(curHash()==="/match/"+id&&(!prev||prev.state!==m.state||!m.me)&&mSig(m)!==renderMatch.sig)renderMatch(m);return m};

const mSig=m=>JSON.stringify(m,(k,v)=>k==="now"?undefined:v);
function renderMatch(m){
  const L0=renderMatch.last||{},same=L0.id===m.id,stCh=same&&L0.state!==m.state,nb=(m.bans||[]).length;

  if(!me.captain)b=`<p class="muted">После игры капитаны загружают скриншот со счётом — ELO пересчитается автоматически.</p>`;
  else if(m.myReport)b=`<p>Вы отправили: <b>${resName(m.myReport.result)}${m.myReport.score?" · "+m.myReport.score.join(" : "):""}</b></p><p class="muted" style="font-size:14px">Ждём капитана соперников. Если он не загрузит скриншот за 30 минут, засчитается ваш результат.</p><label class="btn btn-g btn-sm" style="margin-top:12px">Загрузить другой скриншот<input type="file" accept="image/*" class="sr" data-shot></label>`;

  else b=`<p class="muted" style="font-size:14px">Вы капитан. После игры сделайте скриншот итогового экрана со счётом и загрузите сюда — сайт сам определит победителя. Скриншот нигде не сохраняется.</p><label class="btn btn-o" style="margin-top:12px;width:100%">Загрузить скриншот счёта<input type="file" accept="image/*" class="sr" data-shot></label>`;

function bindMatch(m){
  app.querySelectorAll("[data-ban]").forEach(x=>x.onclick=()=>{app.querySelectorAll("[data-ban]").forEach(y=>y.disabled=true);act(m.id,"ban",{map:x.dataset.ban})});
  app.querySelectorAll("[data-res]").forEach(x=>x.onclick=()=>{x.disabled=true;act(m.id,"confirm",{result:x.dataset.res})});
  app.querySelectorAll("[data-acc]").forEach(x=>x.onclick=()=>{x.disabled=true;act(m.id,"accept")});
  app.querySelectorAll("[data-shot]").forEach(x=>x.onchange=()=>uploadShot(m.id,x.files[0]));
  app.querySelectorAll("[data-copy]").forEach(x=>x.onclick=()=>{navigator.clipboard.writeText(x.dataset.copy).then(()=>toast("ID скопирован"),()=>toast("Не удалось скопировать"))});

// готовим скриншот: уменьшаем до 2000px + делаем контрастную ч/б копию для распознавания
async function prepShot(file){
  const img=await createImageBitmap(file);const k=Math.min(1,2000/Math.max(img.width,img.height));
  const w=Math.round(img.width*k),h=Math.round(img.height*k),c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");x.drawImage(img,0,0,w,h);const orig=c.toDataURL("image/jpeg",.85);
  const d=x.getImageData(0,0,w,h),p=d.data;let sum=0;
  for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i]=g;sum+=g}
  const inv=sum/(p.length/4)<128; // тёмный экран — инвертируем, чтобы текст стал тёмным на светлом
  for(let i=0;i<p.length;i+=4){let g=inv?255-p[i]:p[i];g=Math.max(0,Math.min(255,(g-128)*1.6+128));p[i]=p[i+1]=p[i+2]=g}
  x.putImageData(d,0,0);return [orig,c.toDataURL("image/jpeg",.85)];
}
async function uploadShot(id,file){
  if(!file)return;if(!/^image\//.test(file.type))return toast("Выберите картинку");
  const box=document.getElementById("resBox");if(box)box.innerHTML=`<h3>Результат матча</h3><div class="scan"><span class="spin"></span>Распознаём скриншот… Это может занять до 30 секунд</div>`;
  let imgs;try{imgs=await prepShot(file)}catch{toast("Не удалось прочитать картинку");return renderMatch(S.mv[id])}
  const r=await act(id,"report",{image:imgs[0],image2:imgs[1]});
  if(r&&r.needResult)toast("Счёт распознан — подтвердите результат");else if(r&&r.ok&&r.match.state==="live")toast("Результат отправлен");
  if(!r&&curHash()==="/match/"+id)renderMatch(S.mv[id]);
}

  el.innerHTML=list.map(m=>`<div class="card pad"><div class="adm-h"><div><span class="st st-${m.state}" style="display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:4px;background:var(--card2);text-transform:uppercase">${ST[m.state]}</span> <b>${MODE_NAME[m.mode]} · ${esc(m.map||"карта ещё выбирается")}</b>${m.test?' <span class="pill">тест</span>':""}<div class="muted" style="font-size:13px;margin-top:4px">Матч #${m.id} · ${new Date(m.created).toLocaleString("ru-RU")}</div></div><a class="btn btn-g btn-sm" href="#/match/${m.id}">Открыть</a></div>
    <div style="font-size:14px;margin:12px 0">Капитан ${esc(capName(m,"A"))}: <b>${rep(m,"A")}</b><span class="muted"> · </span>Капитан ${esc(capName(m,"B"))}: <b>${rep(m,"B")}</b></div>
    <div class="row2">${m.map?`<button class="btn btn-o btn-sm" data-w="A" data-id="${m.id}">Победа: команда ${esc(capName(m,"A"))}</button><button class="btn btn-o btn-sm" data-w="B" data-id="${m.id}">Победа: команда ${esc(capName(m,"B"))}</button><button class="btn btn-g btn-sm" data-w="draw" data-id="${m.id}">Ничья</button>`:""}<button class="btn btn-g btn-sm" data-w="cancel" data-id="${m.id}">Отменить матч</button></div></div>`).join("");
  rise(el.children,60,400);
  el.querySelectorAll("[data-w]").forEach(b=>b.onclick=async()=>{if(!confirm(b.dataset.w==="cancel"?"Отменить матч? ELO не изменится.":"Выставить результат: «"+b.textContent+"»?"))return;try{await api(`/api/admin/match/${b.dataset.id}/resolve`,{method:"POST",body:JSON.stringify({winner:b.dataset.w})});toast("Готово");pageAdmin()}catch(e){toast(e.message)}});
}
async function pageLeaderboard(){
  app.innerHTML=`<div class="wrap"><h1 class="h">Таблица лидеров</h1><div id="lb"><div class="card">${skel(8)}</div></div></div>`;entered();
  const list=(await getLb()).map((p,i)=>({...p,rank:i+1}));const el=document.getElementById("lb");if(!el)return;
  if(!list.length){el.innerHTML=`<div class="card">${lbEmpty()}</div>`;return}
  el.innerHTML=`${list.length>=3?`<div class="lb-top">${[1,0,2].map(i=>{const p=list[i];return `<a href="#/player/${encodeURIComponent(p.nick)}" class="card podium p${i+1}"><span class="rk">#${i+1}</span>${ava(p.nick,p.avatar)}<b style="font-size:18px;display:block">${esc(p.nick)}</b><div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px">${badge(p.elo,"sm")}<b>${p.elo} ELO</b></div><div class="muted" style="font-size:13px;margin-top:4px">${p.matches} матчей · ${wr(p)} побед</div></a>`}).join("")}</div>`:""}
   <div class="card scroll">${lbTable(list.length>=3?list.slice(3):list,false)}</div>`;
  fadeRows(el);bind();
}

/* ===== Роутер ===== */
function route(){
  S.enter=true;
  const h=location.hash.slice(1)||"/";const [,a,b]=h.split("/");
  renderChrome("/"+(a||""));window.scrollTo(0,0);clearInterval(matchPoll);closeInvite();
  if(!a)pageHome();else if(a==="login")pageAuth("login");else if(a==="register")pageAuth("register");else if(a==="verify")pageVerify();
  else if(a==="lobby")pageLobby();else if(a==="profile")pageProfile();else if(a==="player")pageProfile(decodeURIComponent(b));
  else if(a==="friends")pageFriends();else if(a==="matches")pageMatches();else if(a==="match")pageMatch(b);else if(a==="leaderboard")pageLeaderboard();else if(a==="admin")pageAdmin();else pageHome();
  bind();
}
function bind(){
  document.querySelectorAll("[data-p]").forEach(r=>r.onclick=()=>location.hash="#/player/"+encodeURIComponent(r.dataset.p));
  document.querySelectorAll("[data-m]").forEach(r=>r.onclick=()=>location.hash="#/match/"+r.dataset.m);
}
document.getElementById("q").addEventListener("keydown",async e=>{if(e.key!=="Enter")return;const r=await api("/api/search?q="+encodeURIComponent(e.target.value)).catch(()=>[]);if(r[0])location.hash="#/player/"+encodeURIComponent(r[0].nick);else toast("Игрок не найден")});
window.addEventListener("hashchange",route);
(async()=>{if(S.token){try{S.user=await api("/api/me")}catch{S.token=null;localStorage.removeItem("sh_token")}}connectLive();route()})();
</script>
