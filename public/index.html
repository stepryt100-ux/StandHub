<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StandHub — соревновательный StandLeo</title>
<style>
:root{
  --bg:#141416;--bg2:#1c1c1f;--card:#232327;--card2:#2b2b30;--line:#34343a;
  --text:#fff;--muted:#a3a3ad;--orange:#ff5500;--orange2:#ff7a33;
  --green:#3fcf6a;--red:#ff4d4d;--yellow:#ffc800;
  --l1:#eeeeee;--l2:#1ce400;--l4:#ffc800;--l8:#ff6309;--l10:#fe1f00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.upper{text-transform:uppercase;letter-spacing:.02em}
/* Topbar */
.top{position:fixed;inset:0 0 auto 0;height:60px;background:#0f0f11;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:50}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:.04em;font-style:italic}
.logo b{color:var(--orange)}
.logo svg{width:30px;height:30px}
.search{flex:1;max-width:420px;margin-left:24px;position:relative}
.search input{width:100%;height:38px;background:var(--card);border:1px solid var(--line);border-radius:6px;color:#fff;padding:0 12px 0 36px}
.search span{position:absolute;left:12px;top:8px;color:var(--muted)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.btn{height:40px;padding:0 20px;border-radius:4px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.btn-o{background:var(--orange);color:#fff}.btn-o:hover{background:var(--orange2)}
.btn-g{background:var(--card2);color:#fff;border:1px solid var(--line)}.btn-g:hover{background:#38383e}
.btn-lg{height:52px;padding:0 36px;font-size:17px}
.userchip{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:6px;background:var(--card)}
.ava{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff5500,#7a2a00);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
/* Sidebar */
.side{position:fixed;top:60px;bottom:0;left:0;width:220px;background:#0f0f11;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;z-index:40}
.side a{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:6px;color:var(--muted);font-weight:600}
.side a:hover{background:var(--card);color:#fff}
.side a.on{background:var(--card);color:#fff;box-shadow:inset 3px 0 0 var(--orange)}
.side .ic{width:20px;text-align:center}
.side .sep{height:1px;background:var(--line);margin:12px 6px}
.side .online{margin-top:auto;font-size:13px;color:var(--muted);padding:12px 14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
main{margin:60px 0 0 220px;min-height:calc(100vh - 60px)}
.wrap{max-width:1180px;margin:0 auto;padding:32px}
h1.h{font-size:30px;font-weight:900;text-transform:uppercase;font-style:italic;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.pad{padding:20px}
.muted{color:var(--muted)}
.grid{display:grid;gap:16px}
/* Level badge */
.lvl{--c:var(--l4);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;color:var(--c);background:radial-gradient(circle,#1a1a1d 58%,transparent 60%),conic-gradient(var(--c) var(--p,70%),#3a3a40 0);flex:none}
.lvl.sm{width:28px;height:28px;font-size:12px}
.lvl.xl{width:84px;height:84px;font-size:34px}
/* Home */
.hero{position:relative;overflow:hidden;min-height:560px;display:flex;align-items:center;background:
 radial-gradient(800px 400px at 80% 40%,rgba(255,85,0,.35),transparent 60%),
 radial-gradient(600px 300px at 10% 90%,rgba(255,85,0,.12),transparent 60%),#0c0c0e;border-bottom:1px solid var(--line)}
.hero .wrap{position:relative;z-index:2;width:100%}
.hero h1{font-size:72px;line-height:.95;font-weight:900;font-style:italic;text-transform:uppercase}
.hero h1 .rot{color:var(--orange);display:block;height:72px;overflow:hidden}
.hero h1 .rot span{display:block;animation:rot 14s infinite}
@keyframes rot{0%,12%{transform:translateY(0)}14%,26%{transform:translateY(-100%)}28%,40%{transform:translateY(-200%)}42%,54%{transform:translateY(-300%)}56%,68%{transform:translateY(-400%)}70%,82%{transform:translateY(-500%)}84%,100%{transform:translateY(-600%)}}
@media (prefers-reduced-motion:reduce){.hero h1 .rot span{animation:none}}
.hero p{max-width:520px;color:#d0d0d6;font-size:18px;margin:24px 0 32px}
.hero .stripes{position:absolute;right:-80px;top:0;bottom:0;width:55%;background:repeating-linear-gradient(115deg,transparent 0 60px,rgba(255,85,0,.07) 60px 64px);mask:linear-gradient(90deg,transparent,#000 40%)}
.hero .emblem{position:absolute;right:8%;top:50%;transform:translateY(-50%);width:340px;height:340px;opacity:.9}
.online-big{margin-top:20px;color:var(--muted)}
.online-big b{color:#fff}
.sec{padding:64px 0}
.sec h2{font-size:38px;font-weight:900;font-style:italic;text-transform:uppercase;margin-bottom:12px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:32px}
.feat .card{padding:24px;display:flex;flex-direction:column;gap:10px;min-height:240px}
.tag{font-size:12px;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:.06em}
.tag.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px}
.feat h3{font-size:22px;font-weight:900;text-transform:uppercase;font-style:italic}
.feat .btn{margin-top:auto;align-self:flex-start}
.cta{text-align:center;padding:72px 0;background:linear-gradient(90deg,#1b0d05,#2a1206,#1b0d05);border-top:1px solid var(--line)}
footer{border-top:1px solid var(--line);padding:40px 32px;color:var(--muted);font-size:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;max-width:1180px;margin:0 auto}
footer h4{color:#fff;margin-bottom:10px;text-transform:uppercase;font-size:13px}
footer a{display:block;margin:4px 0}footer a:hover{color:#fff}
/* Auth */
.auth{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:32px;background:radial-gradient(600px 300px at 50% 0,rgba(255,85,0,.18),transparent 70%)}
.auth .card{width:100%;max-width:420px;padding:32px}
.auth h1{font-size:26px;font-weight:900;font-style:italic;text-transform:uppercase;margin-bottom:6px}
.field{margin-top:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select{width:100%;height:46px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:#fff;padding:0 14px}
.field input:focus{border-color:var(--orange);outline:none}
.err{color:var(--red);font-size:13px;margin-top:6px;min-height:0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;color:var(--muted)}
.chk input{margin-top:4px;accent-color:var(--orange);width:16px;height:16px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:20px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.social{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Lobby */
.lobby{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.party{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}
.slot{aspect-ratio:3/4;border-radius:8px;background:var(--bg2);border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.slot.me{border:1px solid var(--orange);background:linear-gradient(180deg,rgba(255,85,0,.15),var(--bg2));color:#fff}
.slot .ava{width:56px;height:56px;font-size:20px}
.slot .plus{width:48px;height:48px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:22px}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 16px;border-radius:4px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);font-weight:700}
.chip.on{border-color:var(--orange);color:#fff;background:rgba(255,85,0,.12)}
.findbox{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
.btn-find{height:64px;min-width:280px;font-size:20px;font-style:italic;font-weight:900}
.btn-find.searching{background:var(--card2);border:1px solid var(--orange)}
.maps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.map{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);height:64px;border-radius:6px;display:flex;align-items:flex-end;padding:8px;font-weight:800;font-size:13px;text-transform:uppercase;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden}
.map.on{border-color:var(--orange)}
.map.off{opacity:.35}
.qrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.qrow:last-child{border:0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;place-items:center;z-index:100;padding:20px}
.modal.show{display:grid}
.modal .card{max-width:560px;width:100%;padding:32px;text-align:center;border-color:var(--orange)}
.modal h2{font-size:32px;font-weight:900;font-style:italic;text-transform:uppercase;color:var(--orange)}
.accepts{display:flex;justify-content:center;gap:6px;margin:20px 0}
.accepts i{width:28px;height:8px;border-radius:2px;background:var(--line)}
.accepts i.ok{background:var(--green)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:16px 0}
.bar div{height:100%;background:var(--orange);transition:width 1s linear}
/* Profile */
.phead{background:linear-gradient(120deg,#2a1206 0%,#1c1c1f 60%);border:1px solid var(--line);border-radius:8px;padding:28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.phead .ava{width:96px;height:96px;font-size:36px;border:3px solid var(--orange)}
.phead h1{font-size:32px;font-weight:900}
.flag{font-size:13px;color:var(--muted)}
.elo-box{margin-left:auto;display:flex;align-items:center;gap:16px}
.elo-box .v{font-size:32px;font-weight:900}
.elo-prog{width:220px}
.elo-prog .bar{margin:6px 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:24px 0 20px;overflow-x:auto}
.tabs button{background:none;color:var(--muted);height:46px;padding:0 18px;font-weight:700;text-transform:uppercase;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-color:var(--orange)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.stat{padding:16px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700}
.stat .v{font-size:26px;font-weight:900;margin-top:4px}
.pgrid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}
.card h3{font-size:15px;text-transform:uppercase;font-weight:800;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);text-transform:uppercase;text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{white-space:nowrap;padding:12px;border-bottom:1px solid var(--line);font-size:14px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
.w{color:var(--green);font-weight:800}.l{color:var(--red);font-weight:800}
.res{display:inline-block;width:26px;height:26px;border-radius:4px;text-align:center;line-height:26px;font-weight:900;font-size:12px}
.res.w{background:rgba(63,207,106,.15)}.res.l{background:rgba(255,77,77,.15)}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.mrow:last-child{border:0}
.pbar{height:6px;background:var(--line);border-radius:3px;flex:1;margin:0 12px;overflow:hidden}.pbar div{height:100%;background:var(--orange)}
.scroll{overflow-x:auto}
/* Match */
.mhead{border-radius:8px;border:1px solid var(--line);padding:32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;background:linear-gradient(90deg,rgba(63,207,106,.12),#1c1c1f 40%,#1c1c1f 60%,rgba(255,77,77,.12))}
.team{display:flex;align-items:center;gap:14px}
.team.r{justify-content:flex-end;text-align:right}
.team .logo-t{width:60px;height:60px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:22px}
.score{text-align:center}
.score .s{font-size:56px;font-weight:900;font-style:italic;line-height:1}
.score .s span{color:var(--muted);margin:0 10px}
.score .st{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:4px;background:var(--card2);text-transform:uppercase}
.board th:first-child,.board td:first-child{min-width:200px}
.pl{display:flex;align-items:center;gap:10px}
.thead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.thead b{font-size:16px;text-transform:uppercase}
/* Leaderboard */
.lb-top{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;align-items:end}
.podium{padding:24px;text-align:center;position:relative}
.podium .ava{width:72px;height:72px;font-size:26px;margin:0 auto 12px}
.podium .rk{position:absolute;top:12px;left:16px;font-size:28px;font-weight:900;font-style:italic;color:var(--muted)}
.podium.p1{border-color:var(--yellow);padding:36px 24px;background:linear-gradient(180deg,rgba(255,200,0,.1),var(--card))}
.podium.p1 .rk{color:var(--yellow)}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filters select{height:40px;background:var(--card);color:#fff;border:1px solid var(--line);border-radius:4px;padding:0 12px}
.rank{font-weight:900;font-style:italic;color:var(--muted)}
.chart{width:100%;height:200px}
.empty{padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}.empty b{font-size:18px}.empty p{max-width:420px}.empty .btn{margin-top:12px}.empty-ic{width:56px;height:56px;border-radius:50%;background:rgba(255,85,0,.12);color:var(--orange);display:grid;place-items:center;margin-bottom:4px}
.steps{list-style:none;counter-reset:s;margin:20px 0;display:grid;gap:12px}.steps li{counter-increment:s;position:relative;padding:12px 12px 12px 52px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:2px}.steps li::before{content:counter(s);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-weight:900}.vcode{align-self:flex-start;margin-top:6px;background:#0f0f11;padding:6px 12px;border-radius:4px;font-size:20px;font-weight:900;letter-spacing:.2em}
.ava-edit{position:relative;cursor:pointer;border-radius:50%;display:block;flex:none}.ava-edit .ava-cam{position:absolute;right:0;bottom:0;width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;border:3px solid #1c1c1f}.ava-edit:hover .ava{filter:brightness(.75)}.ava-edit:focus-within{outline:2px solid var(--orange);outline-offset:4px}.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.toast{position:fixed;bottom:24px;right:24px;background:var(--card2);border:1px solid var(--orange);padding:14px 18px;border-radius:6px;z-index:200;display:none}
/* Match room */
.mtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.room{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:16px;margin-top:16px;align-items:start}
.prow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
.prow.me{background:rgba(255,85,0,.08);box-shadow:inset 3px 0 0 var(--orange)}
.prow .pn{flex:1;min-width:0}.prow .pn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pr{display:flex;align-items:center;gap:8px;font-weight:800;white-space:nowrap}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.pill{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--card2);color:var(--muted);letter-spacing:.03em;vertical-align:middle}
.pill.cap{background:rgba(255,200,0,.15);color:var(--yellow)}.pill.host{background:rgba(255,85,0,.18);color:var(--orange2)}.pill.me{background:rgba(63,207,106,.15);color:var(--green)}
.logo-t.ta{background:linear-gradient(135deg,#3fcf6a,#1d5e31)}.logo-t.tb{background:linear-gradient(135deg,#ff4d4d,#6b1a1a)}
.score .s.vs{font-size:40px;color:var(--muted)}
.st-accept,.st-veto{color:var(--yellow)}.st-live{color:var(--red)}.st-finished{color:var(--green)}.st-dispute{color:var(--orange)}.st-cancelled{color:var(--muted)}
.wtag{display:inline-block;margin-top:6px;font-size:12px;font-weight:900;text-transform:uppercase}
.vhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.vt{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}.vt.hot{color:var(--red)}
.turn{padding:10px 14px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);font-weight:700;margin-bottom:12px}
.turn.mine{border-color:var(--orange);background:rgba(255,85,0,.12)}
.vmaps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.vmap{height:72px;border-radius:6px;border:2px solid transparent;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:8px 10px;text-align:left;position:relative;cursor:default}
.vmap .vn{font-weight:900;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.vmap .vb{font-size:11px;font-weight:700;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.vmap.banned{filter:grayscale(1);opacity:.35}
.vmap.can{cursor:pointer;border-color:rgba(255,255,255,.15)}.vmap.can:hover,.vmap.can:focus-visible{border-color:var(--red)}
.vmap.can .vb{background:var(--red);padding:1px 6px;border-radius:3px;opacity:0;text-shadow:none}.vmap.can:hover .vb,.vmap.can:focus-visible .vb{opacity:1}
.mapbig{height:120px;border-radius:8px;display:flex;align-items:flex-end;padding:16px}.mapbig b{font-size:30px;font-weight:900;font-style:italic;text-transform:uppercase;text-shadow:0 2px 6px rgba(0,0,0,.6);display:block;line-height:1.1}
.idcopy{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}.idcopy .vcode{margin:0}
.btn-sm{height:34px;padding:0 12px;font-size:12px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.testbox{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:grid;gap:8px}
.scan{display:flex;align-items:center;gap:10px;padding:14px;background:var(--bg2);border-radius:6px}
.spin{width:18px;height:18px;flex:none;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.resbig{font-size:34px;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.1}
.live-banner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;border-color:var(--orange);background:linear-gradient(90deg,rgba(255,85,0,.14),var(--card))}
.admin-box{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:20px;padding:16px;border:1px dashed var(--orange);border-radius:6px;background:rgba(255,85,0,.05)}
.acc-sec{font-size:64px;font-weight:900;font-style:italic;line-height:1;margin-top:16px;font-variant-numeric:tabular-nums}
#accBar{transition:width .2s linear}
.acc-ok{min-height:52px;display:grid;place-items:center;border-radius:4px;background:rgba(63,207,106,.12);color:var(--green);font-weight:800;border:1px solid rgba(63,207,106,.4)}
.res.d{background:rgba(255,255,255,.08);color:#ddd}
.btn:disabled{opacity:.45;cursor:not-allowed}

.adm-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Responsive */

@media (max-width:760px){
 .side{top:auto;bottom:0;width:100%;height:64px;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);justify-content:space-around}
 .side a{flex-direction:column;gap:2px;height:52px;padding:4px 6px;font-size:11px;justify-content:center}
 .side a.on{box-shadow:inset 0 -3px 0 var(--orange)}
 .side .sep,.side .online,.side .hide-m{display:none}
 main{margin-left:0;padding-bottom:64px}
 .search{display:none}.top .right .btn-g,.top .right a[href="#/lobby"]{display:none}.top{padding:0 12px}.logo{font-size:18px}
 .wrap{padding:20px 16px}
 .hero{min-height:480px}.hero h1{font-size:44px}.hero h1 .rot{height:44px}
 .feat,footer{grid-template-columns:1fr}
 .party{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.slot{padding:4px;overflow:hidden}.slot b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot .ava{width:36px;height:36px;font-size:14px}.slot{font-size:10px}.slot .plus{width:32px;height:32px}
 .maps{grid-template-columns:repeat(2,1fr)}
 .btn-find{width:100%;min-width:0}
 .stats{grid-template-columns:repeat(2,1fr)}
 .elo-box{margin-left:0}
 .mhead{grid-template-columns:1fr;text-align:center}.team,.team.r{justify-content:center;text-align:center}
 .lb-top{grid-template-columns:1fr}
 .userchip .nm{display:none}
 .btn-lg{font-size:15px;padding:0 16px;text-align:center}
}

<body>
<header class="top">
  <a href="#/" class="logo" aria-label="StandHub — на главную">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 4h24l-6 8h6L10 28l4-11H6z" fill="#ff5500"/></svg>
    STAND<b>HUB</b>
  </a>
  <div class="search"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-top:3px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span><input placeholder="Поиск игроков, матчей, команд" aria-label="Поиск" id="q"></div>
  <div class="right" id="topRight"></div>
</header>
<nav class="side" id="side" aria-label="Основная навигация"></nav>
<main id="app"></main>

<div class="toast" id="toast" role="status"></div>
<div class="modal" id="accModal"></div>

<script>
/* ===== Справочники ===== */
const MAPS=[["Sandstone","#c89a5b,#6b4a22"],["Rust","#b5532b,#3e1c0d"],["Province","#7fa36a,#2f4524"],["Zone 7","#6a7f9e,#232c3d"],["Hanami","#d77fa1,#4a2233"],["Breeze","#5fb5c9,#1f4550"],["Dune","#d9b26a,#5c4318"],["Sakura","#e59aa8,#57303a"]];
const TH=[0,100,801,951,1101,1251,1401,1551,1701,1851,2001];
function lvlOf(e){let l=1;for(let i=1;i<=10;i++)if(e>=TH[i])l=i;return l}
function lvlColor(l){return l===1?"var(--l1)":l<=3?"var(--l2)":l<=7?"var(--l4)":l<=9?"var(--l8)":"var(--l10)"}
function lvlPct(e){const l=lvlOf(e);if(l===10)return 100;return Math.round((e-TH[l])/(TH[l+1]-TH[l])*100)}
function badge(e,cls=""){const l=lvlOf(e);return `<span class="lvl ${cls}" style="--c:${lvlColor(l)};--p:${Math.max(8,lvlPct(e))}%" title="Уровень ${l} · ${e} ELO">${l}</span>`}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ava(n,url){if(url)return `<span class="ava" style="background:#26262b center/cover no-repeat url('${esc(url)}')" role="img" aria-label="${esc(n)}"></span>`;const h=[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360;return `<span class="ava" style="background:linear-gradient(135deg,hsl(${h} 70% 45%),hsl(${(h+40)%360} 60% 20%))">${esc(n[0].toUpperCase())}</span>`}
function mapBg(m){const x=MAPS.find(a=>a[0]===m);return `linear-gradient(135deg,${x?x[1]:"#555,#222"})`}
const fmt=n=>Number(n).toLocaleString("ru-RU");
const kd=u=>u.deaths?(u.kills/u.deaths).toFixed(2):(u.kills?u.kills.toFixed(2):"—");
const wr=u=>u.matches?Math.round(u.wins/u.matches*100)+"%":"—";
const hsp=u=>u.kills?Math.round(u.hsKills/u.kills*100)+"%":"—";

/* ===== Состояние и API ===== */
const S={token:localStorage.getItem("sh_token"),user:null,searching:false,qSince:0,timer:null,mode:"5v5",match:null,mv:{},skew:0,live:{online:null,searching:null,live:null}};
const VID=localStorage.getItem("sh_vid")||(()=>{const v=crypto.randomUUID();localStorage.setItem("sh_vid",v);return v})();
async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{"Content-Type":"application/json",...(S.token?{Authorization:"Bearer "+S.token}:{})}});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||"Ошибка"),j);return j;
}
let es;
function connectLive(){
  if(es)es.close();
  if(location.protocol==="file:"){S.live={online:null};paintLive();return}
  es=new EventSource(`/api/events?vid=${VID}&token=${S.token||""}`);
  es.onmessage=e=>{try{onLive(JSON.parse(e.data))}catch(err){console.error(err)}};
  es.onerror=()=>{S.live={online:null,searching:null,live:null};paintLive()};
}
function paintLive(){
  const v=k=>S.live[k]==null?"—":fmt(S.live[k]);
  document.querySelectorAll("[data-live]").forEach(el=>el.textContent=v(el.dataset.live));
}
const L=k=>`<b data-live="${k}">${S.live[k]==null?"—":fmt(S.live[k])}</b>`;

/* ===== Каркас ===== */
const ICONS={"home":"<path d=\"M3 11l9-8 9 8v10h-6v-6H9v6H3z\"/>","play":"<path d=\"M7 4l13 8-13 8z\"/>","user":"<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 4-6 8-6s8 2 8 6z\"/>","swords":"<path d=\"M3 3h4l10 10-2 2-2-2-3 3-2-2 3-3zM21 3h-4l-5 5 2 2 1-1 2 2-6 6 2 2 3-3 2 2 2-2-2-2 3-3z\"/>","crown":"<path d=\"M3 7l5 4 4-7 4 7 5-4-2 12H5z\"/>","shield":"<path d=\"M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z\"/>","help":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.5 9a2.5 2.5 0 115 0c0 2-2.5 2-2.5 4M12 17h0\" stroke=\"#0f0f11\" stroke-width=\"2\" fill=\"none\"/>"};
function ic(n){return `<svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">${ICONS[n]}</svg>`}
function renderChrome(route){
  const u=S.user;
  document.getElementById("topRight").innerHTML=u?`
    <a class="btn btn-o" href="#/lobby">Играть</a>
    <a class="userchip" href="#/profile" aria-label="Мой профиль">${ava(u.nick,u.avatar)}<span class="nm">${esc(u.nick)}</span>${badge(u.elo,"sm")}</a>
    <button class="btn btn-g" id="logout">Выйти</button>`:`
    <a class="btn btn-g" href="#/login">Войти</a><a class="btn btn-o" href="#/register">Регистрация</a>`;
  const lo=document.getElementById("logout");if(lo)lo.onclick=async()=>{S.searching=false;stopQTimer();try{await api("/api/logout",{method:"POST"})}catch{}S.token=null;S.user=null;S.match=null;closeAccept();localStorage.removeItem("sh_token");connectLive();location.hash="#/"};
  const items=[["#/","home","Главная"],["#/lobby","play","Играть"],["#/profile","user","Профиль"],["#/matches","swords","Матчи"],["#/leaderboard","crown","Рейтинг"]];
  if(u&&u.admin)items.push(["#/admin","shield","Админ"]);
  document.getElementById("side").innerHTML=items.map(([h,i,t])=>`<a href="${h}" class="${(route===h.slice(1)||(h==="#/"&&route==="/"))?"on":""}">${ic(i)}${t}</a>`).join("")+
   `<div class="sep"></div><a href="#" class="hide-m">${ic("shield")}Античит</a><a href="#" class="hide-m">${ic("help")}Поддержка</a>
    <div class="online"><span class="dot"></span>${L("online")} на сайте</div>`;
}
const app=document.getElementById("app");
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2600)}
function needAuth(){if(!S.user){location.hash="#/login";toast("Войдите, чтобы продолжить");return true}return false}
function empty(title,text,btn){return `<div class="empty"><div class="empty-ic">${ic("crown")}</div><b>${title}</b><p class="muted">${text}</p>${btn||""}</div>`}

/* ===== Главная ===== */
async function pageHome(){
  const words=["ПРИЦЕЛ","СКИЛЛ","РАНГ","РЕАКЦИЮ","ТАКТИКУ","КОМАНДУ","ИГРУ"];
  app.innerHTML=`
  <section class="hero"><div class="stripes"></div>
   <svg class="emblem" viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a33"/><stop offset="1" stop-color="#ff3d00"/></linearGradient></defs>
    <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,85,0,.25)" stroke-width="2"/><circle cx="100" cy="100" r="70" fill="none" stroke="rgba(255,85,0,.15)" stroke-width="10" stroke-dasharray="6 10"/>
    <path d="M40 40h120l-30 40h30L70 170l20-55H50z" fill="url(#g)"/></svg>
   <div class="wrap">
    <h1>Прокачай<span class="rot"><span>${words.map(w=>w+"<br>").join("")}${words[0]}</span></span></h1>
    <p>Соревновательный StandLeo на максимуме. Матчмейкинг 5 на 5, ELO-рейтинг, турниры и команды — без потолка для роста.</p>
    <a class="btn btn-o btn-lg" href="${S.user?"#/lobby":"#/register"}">Играть сейчас</a>
    <div class="online-big"><span class="dot"></span>${L("online")} на сайте прямо сейчас</div>
   </div></section>
  <section class="sec"><div class="wrap">
    <h2>Больше чем матчмейкинг</h2>
    <p class="muted" style="max-width:640px">StandHub — дом для любых амбиций: разные соревновательные форматы для игроков любого уровня и размера пати.</p>
    <div class="feat">
      <div class="card"><span class="tag live">Live</span><h3>Матчмейкинг</h3><p class="muted">Соло или пати. Поднимай ELO под защитой античита StandHub. Бесплатно.</p><a class="btn btn-o" href="#/lobby">Играть</a></div>
      <div class="card"><span class="tag">Скоро</span><h3>Командные лиги</h3><p class="muted">Проверь, как далеко пройдёт твоя команда среди любительских составов.</p><span class="btn btn-g">Скоро</span></div>
      <div class="card"><span class="tag">Скоро</span><h3>Кубки</h3><p class="muted">Ежедневные и еженедельные кубки по расписанию с наградами за места.</p><span class="btn btn-g">Скоро</span></div>
      <div class="card"><span class="tag">Скоро</span><h3>Турниры</h3><p class="muted">Официальные квалификации и турниры от организаторов сообщества.</p><span class="btn btn-g">Скоро</span></div>
    </div></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap">
    <h2>Рейтинг игроков</h2>
    <p class="muted" style="max-width:640px;margin-bottom:24px">Поднимайся в таблице лидеров и смотри, где ты находишься среди лучших игроков StandLeo.</p>
    <div class="card scroll" id="homeLb"><div class="pad muted">Загрузка…</div></div>
    <div style="margin-top:16px"><a class="btn btn-g" href="#/leaderboard">Весь рейтинг</a></div>
  </div></section>
  <section class="cta"><h2 style="font-size:40px;font-weight:900;font-style:italic;text-transform:uppercase;margin-bottom:24px">Готов бросить вызов?</h2><a class="btn btn-o btn-lg" href="${S.user?"#/lobby":"#/register"}">Играть сейчас</a></section>
  <footer>
    <div><h4>StandHub</h4><p>Соревновательная платформа для StandLeo.</p></div>
    <div><h4>Помощь</h4><a href="#">Поддержка</a><a href="#">Античит</a><a href="#">Правила</a></div>
    <div><h4>Платформа</h4><a href="#/lobby">Матчмейкинг</a><a href="#/leaderboard">Рейтинг</a><a href="#/matches">Матчи</a></div>
    <div><h4>Документы</h4><a href="#">Условия использования</a><a href="#">Политика конфиденциальности</a></div>
  </footer>`;
  const lb=await getLb();document.getElementById("homeLb").innerHTML=lb.length?lbTable(lb.slice(0,5),true):lbEmpty();bind();
}
async function getLb(){try{return await api("/api/leaderboard")}catch{return[]}}
function lbEmpty(){return empty("Рейтинг пока пуст","Здесь появятся игроки после первых сыгранных матчей. Стань первым!",S.user?`<a class="btn btn-o" href="#/lobby">Найти матч</a>`:`<a class="btn btn-o" href="#/register">Регистрация</a>`)}
function lbTable(list,compact){
  return `<table><thead><tr><th>#</th><th>Игрок</th><th>Уровень</th><th>ELO</th>${compact?"":"<th>Матчи</th><th>Победы</th><th>K/D</th><th>HS%</th>"}</tr></thead><tbody>
  ${list.map((p,i)=>`<tr class="click" data-p="${esc(p.nick)}"><td class="rank">${p.rank||i+1}</td><td><div class="pl">${ava(p.nick,p.avatar)}<b>${esc(p.nick)}</b></div></td><td>${badge(p.elo,"sm")}</td><td><b>${p.elo}</b></td>${compact?"":`<td>${p.matches}</td><td>${wr(p)}</td><td>${kd(p)}</td><td>${hsp(p)}</td>`}</tr>`).join("")}</tbody></table>`;
}

/* ===== Вход / регистрация ===== */
function pageAuth(type){
  const reg=type==="register";
  app.innerHTML=`<div class="auth"><form class="card" id="f" novalidate>
   <h1>${reg?"Создать аккаунт":"Вход в StandHub"}</h1>
   <p class="muted">${reg?"Присоединяйся к соревновательному StandLeo":"Рады видеть снова, боец"}</p>
   ${reg?`<div class="field"><label for="nick">Никнейм</label><input id="nick" autocomplete="nickname" placeholder="Например, Fl4mus"><div class="err" id="e-nick"></div></div>
   <div class="field"><label for="soid">Игровой ID в StandLeo</label><input id="soid" inputmode="numeric" placeholder="123456789"><div class="err" id="e-soid"></div></div>`:""}
   <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@mail.ru"><div class="err" id="e-email"></div></div>
   <div class="field"><label for="pw">Пароль</label><input id="pw" type="password" autocomplete="${reg?"new-password":"current-password"}" placeholder="••••••••"><div class="err" id="e-pw"></div></div>
   ${reg?`<div class="field"><label for="region">Регион</label><select id="region"><option>Европа</option><option>СНГ</option></select></div>
   <label class="chk"><input type="checkbox" id="tos"> <span>Я принимаю условия использования и правила античита StandHub</span></label><div class="err" id="e-tos"></div>`:""}
   <button class="btn btn-o btn-lg" style="width:100%;margin-top:20px" type="submit">${reg?"Зарегистрироваться":"Войти"}</button>
   <p class="muted" style="text-align:center;margin-top:20px;font-size:14px">${reg?'Уже есть аккаунт? <a href="#/login" style="color:var(--orange)">Войти</a>':'Нет аккаунта? <a href="#/register" style="color:var(--orange)">Регистрация</a>'}</p>
  </form></div>`;
  document.getElementById("f").onsubmit=async e=>{
    e.preventDefault();const v=id=>(document.getElementById(id)||{}).value?.trim()||"";
    const set=(id,m)=>{const el=document.getElementById("e-"+id);if(el)el.textContent=m};
    ["nick","soid","email","pw","tos"].forEach(k=>set(k,""));
    if(reg&&!document.getElementById("tos").checked)return set("tos","Нужно принять условия");
    try{
      const r=await api(reg?"/api/register":"/api/login",{method:"POST",body:JSON.stringify(reg?{nick:v("nick"),soid:v("soid"),email:v("email"),pw:v("pw"),region:v("region")}:{email:v("email"),pw:v("pw")})});
      if(r.pending){sessionStorage.setItem("sh_pending",JSON.stringify(r));location.hash="#/verify";return}
      S.token=r.token;S.user=r.user;localStorage.setItem("sh_token",r.token);connectLive();
      toast("Вы вошли");location.hash="#/lobby";
    }catch(err){if(err.pending){sessionStorage.setItem("sh_pending",JSON.stringify(err));location.hash="#/verify";return}if(err.field)set(err.field,err.message);else toast(location.protocol==="file:"?"Запустите сайт через сервер (node server.js)":err.message)}
  };
}


/* ===== Подтверждение через Telegram ===== */
let verifyTimer=null;
function pageVerify(){
  const p=JSON.parse(sessionStorage.getItem("sh_pending")||"null");
  if(!p){location.hash="#/register";return}
  const link=p.bot?`https://t.me/${p.bot}?start=${p.code}`:null;
  app.innerHTML=`<div class="auth"><div class="card" style="max-width:520px">
   <div class="tag">Шаг 2 из 2</div>
   <h1 style="margin-top:6px">Подтвердите аккаунт</h1>
   <p class="muted">Аккаунт <b style="color:#fff">${esc(p.nick)}</b> создан. Чтобы войти, подтвердите, что игровой ID <b style="color:#fff">${esc(p.soid)}</b> — ваш.</p>
   <ol class="steps">
     <li><b>Откройте нашего Telegram-бота</b><span class="muted">${p.bot?"@"+esc(p.bot):"Бот пока не подключён"}</span></li>
     <li><b>Отправьте боту код</b><span class="muted">Если нажали кнопку ниже — код отправится сам</span><code class="vcode">${esc(p.code)}</code></li>
     <li><b>Пришлите скриншот профиля StandLeo</b><span class="muted">Так, чтобы был хорошо виден ваш ID</span></li>
   </ol>
   ${link?`<a class="btn btn-o btn-lg" style="width:100%" href="${link}" target="_blank" rel="noopener">Открыть бота в Telegram</a>`:`<div class="card pad" style="border-color:var(--orange)">Telegram-бот ещё не настроен администратором сайта.</div>`}
   <div id="vstatus" class="muted" style="text-align:center;margin-top:16px"><span class="dot" style="background:var(--orange)"></span>Ждём подтверждения от бота…</div>
   <p class="muted" style="text-align:center;margin-top:16px;font-size:13px">Код действует 24 часа. <a href="#/register" style="color:var(--orange)">Зарегистрироваться заново</a></p>
  </div></div>`;
  clearInterval(verifyTimer);
  verifyTimer=setInterval(async()=>{
    if(location.hash!=="#/verify")return clearInterval(verifyTimer);
    try{const r=await api("/api/verify-status?code="+p.code);
      if(r.verified){clearInterval(verifyTimer);sessionStorage.removeItem("sh_pending");toast("Аккаунт подтверждён! Теперь войдите");location.hash="#/login"}
      else if(r.linked){document.getElementById("vstatus").innerHTML='<span class="dot" style="background:var(--orange)"></span>Бот на связи — пришлите ему скриншот профиля'}
    }catch{}
  },3000);
}

/* ===== Лобби ===== */
const MODE_NAME={"5v5":"5 на 5","2v2":"2 на 2","1v1":"1 на 1"};
function pageLobby(){
  if(needAuth())return;const u=S.user;const m=S.match&&["veto","live"].includes(S.match.state)?S.match:null;
  app.innerHTML=`<div class="wrap"><h1 class="h">Матчмейкинг</h1>
  ${m?`<div class="card pad live-banner"><div><div class="tag live">Ваш матч идёт</div><b style="font-size:18px">${MODE_NAME[m.mode]}${m.map?" · "+esc(m.map):""}${m.test?" · тест":""}</b><div class="muted" style="font-size:14px">${m.state==="veto"?"Капитаны выбирают карту":"Игра идёт — после неё капитаны загружают скриншот счёта"}</div></div><a class="btn btn-o" href="#/match/${m.id}">В комнату матча</a></div>`:""}
  <div class="lobby">
   <div class="card pad">
     <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
       <div><div class="tag">StandLeo</div><h3 style="margin:4px 0 0;font-size:20px">Твоё пати</h3></div>

function renderParty(){

}
const fmtD=d=>d==null?"—":(d>=0?"+":"")+d;
const resName=r=>r==="win"?"Победа":r==="loss"?"Поражение":"Ничья";
function myRes(m,nick){const p=m.players.find(x=>x.nick===nick)||{};const r=p.draw?"D":p.win?"W":"L";
  return {p,r,cls:r==="W"?"w":r==="L"?"l":"d",sc:m.scoreA==null?"—":p.team==="B"?`${m.scoreB} : ${m.scoreA}`:`${m.scoreA} : ${m.scoreB}`}}
function mini(m){const x=myRes(m,S.user.nick);return `<a class="mrow" href="#/match/${m.id}"><span style="display:flex;align-items:center;gap:10px"><span class="res ${x.cls}">${x.r}</span><b style="color:#fff">${esc(m.map)}</b>${m.test?'<span class="pill">тест</span>':""}</span><span>${x.sc}</span><span class="${(x.p.delta||0)>=0?"w":"l"}">${fmtD(x.p.delta)}</span></a>`}
async function startSearch(auto){

  catch(e){S.searching=false;stopQTimer();if(e.match)onMatch(e.match);refreshLobby();if(!auto)toast(location.protocol==="file:"?"Запустите сайт через сервер (node server.js)":e.message)}
}
async function stopSearch(silent){

function startQTimer(){clearInterval(S.timer);S.timer=setInterval(qtick,1000);qtick()}
function stopQTimer(){clearInterval(S.timer);S.timer=null}
function qtick(){const el=document.getElementById("qstatus");if(!el||!S.searching)return;const t=Math.max(0,Math.floor((Date.now()-S.qSince)/1000));el.innerHTML=`<span class="dot" style="background:var(--orange)"></span>Ищем игроков · ${MODE_NAME[S.mode]} · ${Math.floor(t/60)}:${String(t%60).padStart(2,"0")} · в поиске ${L("searching")}`}
const curHash=()=>location.hash.slice(1)||"/";
function refreshLobby(){if(curHash()==="/lobby")pageLobby()}
function refreshMe(){api("/api/me").then(u=>{S.user=u;renderChrome(curHash().split("/").slice(0,2).join("/"))}).catch(()=>{})}

/* ===== Матчи: события в реальном времени ===== */
const BUSY=["accept","veto","live"];
function onLive(d){
  if(d.type==="stats"){S.live=d;paintLive();return}
  if(d.type==="state")return applyState(d);
  if(d.type==="match")onMatch(d.match);
}
function applyState(d,fromAction){
  const was=S.searching;
  if(d.queue){S.searching=true;S.mode=d.queue.mode;S.qSince=Date.now()-d.queue.waited;startQTimer()}
  else if(!fromAction||d.match){S.searching=false;stopQTimer()}
  if(d.match)onMatch(d.match,!fromAction);
  else if(S.match&&BUSY.includes(S.match.state)){S.match=null;closeAccept()}
  // поиск сбросился (например, сайт обновлялся) — встаём в очередь снова
  if(!fromAction&&was&&!d.queue&&!d.match&&S.user)return startSearch(true);
  refreshLobby();
}
function onMatch(m,silent){
  const prev=S.mv[m.id]?S.mv[m.id].state:null;
  S.skew=m.now-Date.now();S.mv[m.id]=m;
  if(BUSY.includes(m.state)&&m.me){S.match=m;S.searching=false;stopQTimer()}else if(S.match&&S.match.id===m.id)S.match=null;
  if(m.state==="accept"&&m.me){showAccept(m);if(prev!=="accept"&&!silent){beep();flash("Матч найден!")}}
  else if(S.mv[m.id]&&document.getElementById("accModal").dataset.id===m.id)closeAccept();
  if(prev==="accept"&&m.state==="veto"){toast("Все приняли матч — капитаны выбирают карту");if(curHash()!=="/match/"+m.id){location.hash="#/match/"+m.id;return}}
  if(prev==="accept"&&m.state==="cancelled"){
    if(m.requeuedMe){S.searching=true;S.mode=m.mode;S.qSince=Date.now();startQTimer();toast("Не все игроки приняли матч — вы снова в поиске")}
    else toast(m.iAccepted?"Матч отменён: не все приняли":"Вы не приняли матч")}
  if(prev==="veto"&&m.state==="live"){beep(true);toast("Карта матча: "+m.map)}
  if(prev&&prev!=="finished"&&m.state==="finished"){refreshMe();const me=m.players.find(p=>p.me);if(me)toast(m.winner==="draw"?"Ничья":m.winner===me.team?"Победа! ELO "+fmtD(me.delta):"Поражение. ELO "+fmtD(me.delta))}
  if(prev&&prev!=="cancelled"&&prev!=="accept"&&m.state==="cancelled")toast("Матч отменён");
  if(curHash()==="/match/"+m.id)renderMatch(m);
  else if(prev!==m.state)refreshLobby();
}
async function act(id,a,b){
  try{const r=await api(`/api/match/${id}/${a}`,{method:"POST",body:JSON.stringify(b||{})});if(r.match)onMatch(r.match);return r}
  catch(e){toast(e.message);if(e.match)onMatch(e.match);return null}
}
/* звук и мигающий заголовок, когда матч найден */
let actx=null;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch{}}
document.addEventListener("pointerdown",unlockAudio,{once:true});
function beep(short){try{if(!actx)return;const t=actx.currentTime;(short?[0]:[0,.2]).forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=i?880:660;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.3,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.18);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+.2)})}catch{}}
let flashT=null;const TITLE=document.title;
function flash(t){clearInterval(flashT);if(!document.hidden)return;let on=0;flashT=setInterval(()=>{if(!document.hidden){clearInterval(flashT);document.title=TITLE;return}document.title=(on^=1)?"🔔 "+t:TITLE},800)}
/* окно «Матч найден» */
let accTimer=null;
function showAccept(m){
  const el=document.getElementById("accModal");el.classList.add("show");el.dataset.id=m.id;
  el.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="accH">

    <h2 id="accH">Матч найден!</h2>
    <div class="acc-sec" id="accSec" aria-hidden="true">15</div>

    <div class="accepts">${Array.from({length:m.total},(_,i)=>`<i class="${i<m.accepted?"ok":""}"></i>`).join("")}</div>
    <p class="muted" style="margin-bottom:20px">Приняли <b style="color:#fff">${m.accepted} из ${m.total}</b>. Матч начнётся, когда примут все.</p>
    ${m.iAccepted?`<div class="acc-ok">✓ Вы приняли матч — ждём остальных</div>`:`<button class="btn btn-o btn-lg" style="width:100%" id="accYes">Принять</button><button class="btn btn-g" style="width:100%;margin-top:8px" id="accNo">Отклонить</button>`}
  </div>`;
  const y=document.getElementById("accYes");if(y){y.onclick=()=>{y.disabled=true;act(m.id,"accept")};y.focus()}
  const n=document.getElementById("accNo");if(n)n.onclick=()=>act(m.id,"decline");
  clearInterval(accTimer);const total=(m.acceptDeadline-m.created)||15000;
  const upd=()=>{const s=document.getElementById("accSec"),b=document.getElementById("accBar");if(!s)return clearInterval(accTimer);const ms=Math.max(0,m.acceptDeadline-(Date.now()+S.skew));s.textContent=Math.ceil(ms/1000);b.style.width=(ms/total*100)+"%"};
  upd();accTimer=setInterval(upd,200);
}
function closeAccept(){clearInterval(accTimer);const el=document.getElementById("accModal");el.classList.remove("show");el.innerHTML="";delete el.dataset.id}
/* обратный отсчёт для всех таймеров на странице */

function matchTable(list,nick){

async function uploadAvatar(file){
  if(!file)return;if(!/^image\//.test(file.type))return toast("Выберите картинку");
  try{
    const img=await createImageBitmap(file);const S2=256,c=document.createElement("canvas");c.width=c.height=S2;
    const k=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,S2,S2);
    const u=await api("/api/avatar",{method:"POST",body:JSON.stringify({image:c.toDataURL("image/jpeg",.88)})});
    S.user=u;toast("Аватар обновлён");renderChrome("/profile");pageProfile();
  }catch(e){toast(e.message||"Не удалось загрузить аватар")}

/* ----- Комната матча ----- */
const ST={accept:"Принятие матча",veto:"Выбор карты",live:"Идёт игра",dispute:"Проверка результата",finished:"Матч завершён",cancelled:"Матч отменён"};
let matchPoll=null;
async function pageMatch(id){
  clearInterval(matchPoll);
  const cached=S.mv[id];
  if(cached)renderMatch(cached);else app.innerHTML=`<div class="wrap"><div class="card pad muted">Загрузка…</div></div>`;
  const load=async()=>{const m=await api("/api/match/"+id);S.skew=m.now-Date.now();const prev=S.mv[id];S.mv[id]=m;if(curHash()==="/match/"+id&&(!prev||prev.state!==m.state||!m.me))renderMatch(m);return m};
  try{const m=await load();if(!cached)renderMatch(m);
    // зрители (не участники) не получают события — обновляем страницу сами
    if(!m.me&&!["finished","cancelled"].includes(m.state))matchPoll=setInterval(()=>{if(curHash()!=="/match/"+id)return clearInterval(matchPoll);load().catch(()=>{})},4000);
  }catch{if(!cached)app.innerHTML=`<div class="wrap">${empty("Матч не найден","Возможно, ссылка устарела",`<a class="btn btn-g" href="#/matches">Все матчи</a>`)}</div>`}
}
function renderMatch(m){
  const fin=m.state==="finished",teams=m.players.some(p=>p.team);
  const avg=t=>{const ps=m.players.filter(p=>p.team===t);return ps.length?Math.round(ps.reduce((a,p)=>a+p.elo,0)/ps.length):"—"};
  const wt=t=>fin?(m.winner==="draw"?`<span class="wtag muted">Ничья</span>`:m.winner===t?`<span class="wtag w">Победа</span>`:`<span class="wtag l">Поражение</span>`):"";
  const head=teams?`<div class="mhead">
     <div class="team"><div class="logo-t ta">A</div><div><b>Команда ${esc(capName(m,"A"))}</b><div class="muted" style="font-size:13px">Средний ELO ${avg("A")}</div>${wt("A")}</div></div>
     <div class="score">${fin&&m.scoreA!=null?`<div class="s">${m.scoreA}<span>:</span>${m.scoreB}</div>`:`<div class="s vs">VS</div>`}<div class="st st-${m.state}">${ST[m.state]}</div>${m.map?`<div class="muted" style="margin-top:6px;font-weight:700">${esc(m.map)}</div>`:""}</div>
     <div class="team r"><div><b>Команда ${esc(capName(m,"B"))}</b><div class="muted" style="font-size:13px">Средний ELO ${avg("B")}</div>${wt("B")}</div><div class="logo-t tb">B</div></div>
   </div>`:"";
  const body=teams?`<div class="room"><div class="card">${roster(m,"A")}</div><div class="grid center" style="align-content:start">${center(m)}</div><div class="card">${roster(m,"B")}</div></div>`
    :`<div class="room" style="grid-template-columns:1fr 1fr"><div class="grid center" style="align-content:start">${center(m)}</div><div class="card"><div class="thead"><b>Игроки</b><span class="muted">${m.accepted} из ${m.total} приняли</span></div>${m.players.map(p=>prow(m,p,true)).join("")}</div></div>`;
  app.innerHTML=`<div class="wrap">
   <div class="mtop"><div><div class="tag">${MODE_NAME[m.mode]} · StandLeo${m.test?" · тестовый матч":""}</div><h1 class="h" style="margin:4px 0 0">Комната матча</h1></div><div class="muted" style="font-size:13px">Матч #${m.id}</div></div>
   ${head}${body}</div>`;
  bindMatch(m);
}
function prow(m,p,acc){
  return `<div class="prow${p.me?" me":""}">${ava(p.nick,p.avatar)}<div class="pn">${p.bot?`<b>${esc(p.nick)}</b>`:`<a href="#/player/${encodeURIComponent(p.nick)}"><b>${esc(p.nick)}</b></a>`}<div class="pills">${p.captain?`<span class="pill cap">Капитан</span>`:""}${p.host?`<span class="pill host">Хост</span>`:""}${p.bot?`<span class="pill">Бот</span>`:""}${p.me?`<span class="pill me">Вы</span>`:""}</div></div>
   <div class="pr">${acc?(p.accepted?`<span class="w">✓ принял</span>`:`<span class="muted">ждём…</span>`):`${badge(p.elo,"sm")}<span>${p.elo}</span>${m.state==="finished"&&p.delta!=null?`<span class="${p.delta>=0?"w":"l"}">${fmtD(p.delta)}</span>`:""}`}</div></div>`;
}
function roster(m,t){const ps=m.players.filter(p=>p.team===t).sort((a,b)=>b.elo-a.elo);return `<div class="thead"><b>Команда ${esc(capName(m,t))}</b><span class="muted">${ps.length} игр.</span></div>${ps.map(p=>prow(m,p)).join("")}`}
function center(m){
  const me=m.me,h=m.host||{};
  if(m.state==="accept")return `<div class="card pad"><h3>Ждём, пока все примут матч</h3><p class="muted">Приняли ${m.accepted} из ${m.total}. Осталось <b style="color:#fff" data-dl="${m.acceptDeadline}">0:15</b></p>${me&&!m.iAccepted?`<button class="btn btn-o btn-lg" style="width:100%;margin-top:16px" data-acc>Принять матч</button>`:""}</div>`;
  if(m.state==="cancelled")return `<div class="card pad"><h3>Матч отменён</h3><p class="muted">${esc(m.cancelReason||"")}. ELO не изменился.</p><a class="btn btn-o" style="margin-top:16px" href="#/lobby">В лобби</a></div>`;
  if(m.state==="veto"){
    const my=me&&me.captain&&m.turn===me.team;
    return `<div class="card pad"><div class="vhead"><div><h3 style="margin:0">Выбор карты</h3><div class="muted" style="font-size:13px">Капитаны по очереди убирают карты. Последняя оставшаяся — карта матча.</div></div><div class="vt" data-dl="${m.turnDeadline}" aria-label="Время на ход">0:20</div></div>
     <div class="turn ${my?"mine":""}">${my?"Ваш ход — уберите одну карту":`Убирает команда ${esc(capName(m,m.turn))}`}</div>
     <div class="vmaps">${m.maps.map(x=>{const b=m.bans.find(y=>y.map===x);return `<button class="vmap${b?" banned":""}${my&&!b?" can":""}" style="background:${mapBg(x)}" ${my&&!b?`data-ban="${esc(x)}" aria-label="Убрать карту ${esc(x)}"`:"disabled"}><span class="vn">${esc(x)}</span>${b?`<span class="vb">Убрана · ${b.auto?"время вышло":"команда "+esc(capName(m,b.team))}</span>`:my?`<span class="vb">Убрать</span>`:""}</button>`}).join("")}</div>
     <div class="muted" style="font-size:13px;margin-top:10px">Если капитан не успеет за 20 секунд, карта уберётся случайно.</div></div>`;
  }
  const mapCard=`<div class="mapbig" style="background:${mapBg(m.map)}"><div><div class="tag" style="color:#fff">Карта матча</div><b>${esc(m.map)}</b></div></div>`;
  if(m.state==="live"){
    let guide;
    if(!me)guide=`<div class="card pad"><h3>Идёт игра</h3><p class="muted">Хост матча: <b style="color:#fff">${esc(h.nick||"")}</b>. Результат появится, когда капитаны загрузят скриншот счёта.</p></div>`;
    else if(me.host)guide=`<div class="card pad"><h3>Вы — хост матча</h3><ol class="steps">
      <li><b>Создайте лобби в StandLeo</b><span class="muted">Карта ${esc(m.map)} · ${MODE_NAME[m.mode]} · <b style="color:#fff">13 раундов до победы</b></span></li>
      <li><b>Ждите сообщений «.» в личке</b><span class="muted">Игроки найдут вас по вашему ID <b style="color:#fff">${esc(h.soid||"")}</b> и напишут «.» — пригласите каждого в лобби</span></li>
      <li><b>Рассадите игроков по командам и начните</b><span class="muted">Составы команд — слева и справа</span></li></ol></div>`;
    else guide=`<div class="card pad"><h3>Как зайти в матч</h3><ol class="steps">
      <li><b>Найдите хоста в StandLeo по ID</b><span class="muted">Хост: ${esc(h.nick||"")}</span><span class="idcopy"><code class="vcode">${esc(h.soid||"")}</code><button class="btn btn-g btn-sm" data-copy="${esc(h.soid||"")}">Скопировать ID</button></span></li>
      <li><b>Напишите ему «.» в личные сообщения</b><span class="muted">Так хост поймёт, что вы из этого матча, и пригласит вас в лобби</span></li>
      <li><b>Играйте за свою команду</b><span class="muted">Карта ${esc(m.map)} · 13 раундов до победы</span></li></ol></div>`;
    return mapCard+guide+resultCard(m)+(me?`<div class="card pad"><h3>Матч не состоялся?</h3><p class="muted" style="font-size:14px">Если лобби так и не собралось — проголосуйте. Когда наберётся ${m.cancelNeed} из ${m.total} голосов, матч отменится без изменения ELO.</p><button class="btn btn-g" style="margin-top:12px" id="voteC">${me.votedCancel?"Отозвать голос":"Матч не состоялся"} · ${m.cancelVotes}/${m.cancelNeed}</button></div>`:"");
  }
  if(m.state==="dispute")return mapCard+`<div class="card pad"><h3>Результат проверяется</h3><p class="muted">Капитаны прислали разные результаты. Администратор проверит матч и выставит итог. ELO пока не меняется.</p></div>`;
  // finished
  const p=m.players.find(x=>x.me);
  const big=p?(m.winner==="draw"?"Ничья":m.winner===p.team?`<span class="w">Победа</span>`:`<span class="l">Поражение</span>`):(m.winner==="draw"?"Ничья":`Победила команда ${esc(capName(m,m.winner))}`);
  return mapCard+`<div class="card pad"><h3>Итог матча</h3><div class="resbig">${big}</div>${m.scoreA!=null?`<div class="muted" style="margin-top:4px">Счёт ${m.scoreA} : ${m.scoreB}</div>`:""}
    ${p?`<div style="margin-top:12px;font-size:18px">Ваш ELO: <b class="${p.delta>=0?"w":"l"}">${fmtD(p.delta)}</b></div>`:""}
    ${m.test?`<p class="muted" style="font-size:13px;margin-top:8px">Тестовый матч — рейтинг игроков не изменился.</p>`:""}
    ${p?`<a class="btn btn-o" style="margin-top:16px" href="#/lobby">Найти новый матч</a>`:""}</div>`;
}
function resultCard(m){
  const me=m.me;if(!me)return "";
  const caps=["A","B"].map(t=>`<div class="qrow"><span class="muted">Капитан ${esc(capName(m,t))}</span>${m.reports[t]?`<span class="w">✓ загрузил</span>`:`<span class="muted">ждём</span>`}</div>`).join("");
  let b;
  if(!me.captain)b=`<p class="muted">После игры капитаны загружают скриншот со счётом — ELO пересчитается автоматически.</p>`;
  else if(m.myReport)b=`<p>Вы отправили: <b>${resName(m.myReport.result)}${m.myReport.score?" · "+m.myReport.score.join(" : "):""}</b></p><p class="muted" style="font-size:14px">Ждём капитана соперников. Если он не загрузит скриншот за 30 минут, засчитается ваш результат.</p><label class="btn btn-g btn-sm" style="margin-top:12px">Загрузить другой скриншот<input type="file" accept="image/*" class="sr" data-shot></label>`;
  else if(m.pendingScore)b=`<p>На скриншоте счёт <b>${m.pendingScore.join(" : ")}</b>, но не видно, кто победил.</p><p class="muted">Ваша команда выиграла?</p><div class="row2" style="margin-top:12px"><button class="btn btn-o" data-res="win">Да, мы победили</button><button class="btn btn-g" data-res="loss">Нет, проиграли</button></div>`;
  else b=`<p class="muted" style="font-size:14px">Вы капитан. После игры сделайте скриншот итогового экрана со счётом и загрузите сюда — сайт сам определит победителя. Скриншот нигде не сохраняется.</p><label class="btn btn-o" style="margin-top:12px;width:100%">Загрузить скриншот счёта<input type="file" accept="image/*" class="sr" data-shot></label>`;
  if(me.captain&&m.test&&!m.myReport)b+=`<div class="testbox"><div class="muted" style="font-size:13px">Тестовый матч: можно без скриншота</div><div class="row2"><button class="btn btn-g btn-sm" data-res="win">Мы победили</button><button class="btn btn-g btn-sm" data-res="loss">Мы проиграли</button></div></div>`;
  return `<div class="card pad" id="resBox"><h3>Результат матча</h3>${b}<div style="margin-top:12px">${caps}</div></div>`;
}
function bindMatch(m){
  app.querySelectorAll("[data-ban]").forEach(x=>x.onclick=()=>{app.querySelectorAll("[data-ban]").forEach(y=>y.disabled=true);act(m.id,"ban",{map:x.dataset.ban})});
  app.querySelectorAll("[data-res]").forEach(x=>x.onclick=()=>{x.disabled=true;act(m.id,"confirm",{result:x.dataset.res})});
  app.querySelectorAll("[data-acc]").forEach(x=>x.onclick=()=>{x.disabled=true;act(m.id,"accept")});
  app.querySelectorAll("[data-shot]").forEach(x=>x.onchange=()=>uploadShot(m.id,x.files[0]));
  app.querySelectorAll("[data-copy]").forEach(x=>x.onclick=()=>{navigator.clipboard.writeText(x.dataset.copy).then(()=>toast("ID скопирован"),()=>toast("Не удалось скопировать"))});
  const v=document.getElementById("voteC");if(v)v.onclick=()=>{v.disabled=true;act(m.id,"cancel")};
}
// готовим скриншот: уменьшаем до 2000px + делаем контрастную ч/б копию для распознавания
async function prepShot(file){
  const img=await createImageBitmap(file);const k=Math.min(1,2000/Math.max(img.width,img.height));
  const w=Math.round(img.width*k),h=Math.round(img.height*k),c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");x.drawImage(img,0,0,w,h);const orig=c.toDataURL("image/jpeg",.85);
  const d=x.getImageData(0,0,w,h),p=d.data;let sum=0;
  for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i]=g;sum+=g}
  const inv=sum/(p.length/4)<128; // тёмный экран — инвертируем, чтобы текст стал тёмным на светлом
  for(let i=0;i<p.length;i+=4){let g=inv?255-p[i]:p[i];g=Math.max(0,Math.min(255,(g-128)*1.6+128));p[i]=p[i+1]=p[i+2]=g}
  x.putImageData(d,0,0);return [orig,c.toDataURL("image/jpeg",.85)];
}
async function uploadShot(id,file){
  if(!file)return;if(!/^image\//.test(file.type))return toast("Выберите картинку");
  const box=document.getElementById("resBox");if(box)box.innerHTML=`<h3>Результат матча</h3><div class="scan"><span class="spin"></span>Распознаём скриншот… Это может занять до 30 секунд</div>`;
  let imgs;try{imgs=await prepShot(file)}catch{toast("Не удалось прочитать картинку");return renderMatch(S.mv[id])}
  const r=await act(id,"report",{image:imgs[0],image2:imgs[1]});
  if(r&&r.needResult)toast("Счёт распознан — подтвердите результат");else if(r&&r.ok&&r.match.state==="live")toast("Результат отправлен");
  if(!r&&curHash()==="/match/"+id)renderMatch(S.mv[id]);
}
/* ----- Админка ----- */
async function pageAdmin(){
  if(needAuth())return;
  if(!S.user.admin){app.innerHTML=`<div class="wrap">${empty("Нет доступа","Эта страница только для администраторов")}</div>`;return}
  app.innerHTML=`<div class="wrap"><h1 class="h">Админка · матчи</h1><p class="muted" style="margin:-12px 0 20px">Идущие и спорные матчи. Спорный — когда капитаны прислали разные результаты.</p><div id="adm" class="grid"><div class="card pad muted">Загрузка…</div></div></div>`;
  const list=await api("/api/admin/matches").catch(()=>[]);const el=document.getElementById("adm");if(!el)return;
  if(!list.length){el.innerHTML=`<div class="card">${empty("Сейчас нет идущих матчей","Здесь появятся идущие матчи и матчи, где капитаны не сошлись в результате")}</div>`;return}
  const rep=(m,t)=>m.reports[t]?`${resName(m.reports[t].result)}${m.reports[t].score?" "+m.reports[t].score.join(":"):""}`:"ещё нет";
  el.innerHTML=list.map(m=>`<div class="card pad"><div class="adm-h"><div><span class="st st-${m.state}" style="display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:4px;background:var(--card2);text-transform:uppercase">${ST[m.state]}</span> <b>${MODE_NAME[m.mode]} · ${esc(m.map||"карта ещё выбирается")}</b>${m.test?' <span class="pill">тест</span>':""}<div class="muted" style="font-size:13px;margin-top:4px">Матч #${m.id} · ${new Date(m.created).toLocaleString("ru-RU")}</div></div><a class="btn btn-g btn-sm" href="#/match/${m.id}">Открыть</a></div>
    <div style="font-size:14px;margin:12px 0">Капитан ${esc(capName(m,"A"))}: <b>${rep(m,"A")}</b><span class="muted"> · </span>Капитан ${esc(capName(m,"B"))}: <b>${rep(m,"B")}</b></div>
    <div class="row2">${m.map?`<button class="btn btn-o btn-sm" data-w="A" data-id="${m.id}">Победа: команда ${esc(capName(m,"A"))}</button><button class="btn btn-o btn-sm" data-w="B" data-id="${m.id}">Победа: команда ${esc(capName(m,"B"))}</button><button class="btn btn-g btn-sm" data-w="draw" data-id="${m.id}">Ничья</button>`:""}<button class="btn btn-g btn-sm" data-w="cancel" data-id="${m.id}">Отменить матч</button></div></div>`).join("");
  el.querySelectorAll("[data-w]").forEach(b=>b.onclick=async()=>{if(!confirm(b.dataset.w==="cancel"?"Отменить матч? ELO не изменится.":"Выставить результат: «"+b.textContent+"»?"))return;try{await api(`/api/admin/match/${b.dataset.id}/resolve`,{method:"POST",body:JSON.stringify({winner:b.dataset.w})});toast("Готово");pageAdmin()}catch(e){toast(e.message)}});
}
async function pageLeaderboard(){
  app.innerHTML=`<div class="wrap"><h1 class="h">Таблица лидеров</h1><div id="lb"><div class="card pad muted">Загрузка…</div></div></div>`;
  const list=(await getLb()).map((p,i)=>({...p,rank:i+1}));const el=document.getElementById("lb");
  if(!list.length){el.innerHTML=`<div class="card">${lbEmpty()}</div>`;return}
  el.innerHTML=`${list.length>=3?`<div class="lb-top">${[1,0,2].map(i=>{const p=list[i];return `<a href="#/player/${encodeURIComponent(p.nick)}" class="card podium p${i+1}"><span class="rk">#${i+1}</span>${ava(p.nick,p.avatar)}<b style="font-size:18px;display:block">${esc(p.nick)}</b><div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px">${badge(p.elo,"sm")}<b>${p.elo} ELO</b></div><div class="muted" style="font-size:13px;margin-top:4px">${p.matches} матчей · ${wr(p)} побед</div></a>`}).join("")}</div>`:""}
   <div class="card scroll">${lbTable(list.length>=3?list.slice(3):list,false)}</div>`;
  bind();
}

/* ===== Роутер ===== */
function route(){
  const h=location.hash.slice(1)||"/";const [,a,b]=h.split("/");
  renderChrome("/"+(a||""));window.scrollTo(0,0);clearInterval(matchPoll);
  if(!a)pageHome();else if(a==="login")pageAuth("login");else if(a==="register")pageAuth("register");else if(a==="verify")pageVerify();
  else if(a==="lobby")pageLobby();else if(a==="profile")pageProfile();else if(a==="player")pageProfile(decodeURIComponent(b));
  else if(a==="matches")pageMatches();else if(a==="match")pageMatch(b);else if(a==="leaderboard")pageLeaderboard();else if(a==="admin")pageAdmin();else pageHome();
  bind();
}
function bind(){
  document.querySelectorAll("[data-p]").forEach(r=>r.onclick=()=>location.hash="#/player/"+encodeURIComponent(r.dataset.p));
  document.querySelectorAll("[data-m]").forEach(r=>r.onclick=()=>location.hash="#/match/"+r.dataset.m);
}
document.getElementById("q").addEventListener("keydown",async e=>{if(e.key!=="Enter")return;const r=await api("/api/search?q="+encodeURIComponent(e.target.value)).catch(()=>[]);if(r[0])location.hash="#/player/"+encodeURIComponent(r[0].nick);else toast("Игрок не найден")});
window.addEventListener("hashchange",route);
(async()=>{if(S.token){try{S.user=await api("/api/me")}catch{S.token=null;localStorage.removeItem("sh_token")}}connectLive();route()})();
</script>
